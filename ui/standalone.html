<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hana Player</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-shell="window">
<audio id="audio" preload="metadata"></audio>

<div class="frame" id="frame">
  <div class="player" id="player" data-layout="long" data-page="play" data-drawer="0" data-lyrics="1" data-ambient="none">

    <section class="stage" id="stage">
      <!-- 舞台：环境色（封面右缘色铺满）+ 封面（贴左不裁切）+ 歌词/频谱 -->
      <div class="scene" id="scene">
        <div class="stage-ambient" id="stageAmbient" aria-hidden="true"></div>
        <div class="cover-haze" id="coverHaze" aria-hidden="true"></div>
        <div class="cover" id="cover" aria-hidden="true"></div>
        <div class="lyric-scrim" id="lyricScrim" aria-hidden="true"></div>

        <div class="scene-top" id="sceneTop">
          <h1 class="track-title" id="trackTitle">风经过的地方</h1>
          <!-- 歌手名 = 搜索入口：点一下用这位歌手去搜（搜索页三种布局都能开）。
               视觉与原来的 <p> 一致，只多一枚低透明度搜索字形作提示；
               没歌手（或还没曲目）时禁用并隐去字形。 -->
          <button class="track-artist" id="trackArtist" type="button" hidden>
            <span class="ta-name" id="trackArtistName"></span>
            <svg class="icon ta-go" aria-hidden="true"><use href="#i-search"></use></svg>
          </button>
          <div class="track-meta-row">
            <p class="track-meta" id="trackMeta"></p>
            <!-- 红心（我的喜欢）：跟着当前曲一起换。窄卡缩小但仍保留。 -->
            <button class="fav-btn" id="stageFavBtn" type="button" aria-pressed="false" aria-label="加入我的喜欢" title="加入我的喜欢"></button>
          </div>
        </div>

        <div class="lyric-wrap" id="lyricWrap">
          <div class="lyrics" id="lyrics"></div>
        </div>

        <!-- 指针涟漪：Canvas 2D 流光波场，接真音频（captureStream，跨源退纯指针）。落在封面/薄纱之上、文字之下，
             封面区与歌词区都可见。方案见 docs/player-ui/RIPPLE-LAB.md。 -->
        <canvas class="ripple-canvas" id="rippleCanvas" aria-hidden="true"></canvas>
      </div>

      <!-- 舞台/队列 可拖分隔线（仅长卡）：拖动改封面区/队列区比例，持久化 -->
      <div class="split-handle" id="splitHandle" role="separator" aria-orientation="horizontal" aria-label="调整封面与队列比例" hidden></div>

      <div class="drawer-scrim" id="drawerScrim" hidden></div>

      <!-- 播放队列：三种布局共用一份 DOM -->
      <section class="queue" id="queue" aria-label="播放队列">
        <div class="queue-topline">
          <button class="back-btn" id="backBtn" type="button">
            <svg class="icon icon-sm" aria-hidden="true"><use href="#i-chevron-left"></use></svg>
            <span>返回播放</span>
          </button>
        </div>

        <header class="queue-head" id="queueHead">
          <h2 class="queue-title"><span id="queueTitle">播放队列</span> <span class="queue-count"><span id="queueCount">12</span> 首</span></h2>
          <div class="queue-head-actions">
            <button class="icon-btn" id="renameBtn" type="button" aria-label="重命名歌单" title="重命名歌单" hidden>
              <svg class="icon" aria-hidden="true"><use href="#i-pencil"></use></svg>
            </button>
            <button class="icon-btn" id="importBtn" type="button" aria-label="添加曲目" title="添加曲目" aria-expanded="false">
              <svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg>
            </button>
            <button class="icon-btn" id="drawerCloseBtn" type="button" aria-label="关闭队列" title="关闭队列">
              <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
            </button>
          </div>
        </header>

        <div class="list-tabs" id="listTabs" role="tablist" aria-label="歌单切换"></div>

        <ol class="queue-list" id="queueList"></ol>

        <!-- 行内「更多」菜单 -->
        <div class="pop pop-more" id="morePop" hidden>
          <p class="pop-title" id="moreTitle"></p>
          <button class="pop-item" id="removeBtn" type="button">
            <svg class="icon icon-sm" aria-hidden="true"><use href="#i-trash"></use></svg>
            <span>从队列移除</span>
          </button>
        </div>

        <!-- 导入面板 -->
        <div class="pop pop-import" id="importPop" hidden>
          <p class="pop-title">添加曲目</p>
          <div class="pop-link">
            <input class="pop-input" id="linkInput" type="url" inputmode="url" placeholder="粘贴歌曲 / 歌单链接" aria-label="在线链接">
            <button class="pop-go" id="linkAddBtn" type="button" aria-label="添加链接">添加</button>
          </div>
          <button class="pop-item" data-import="file" type="button">
            <svg class="icon icon-sm" aria-hidden="true"><use href="#i-file"></use></svg>
            <span>本地文件</span>
          </button>
          <button class="pop-item" data-import="folder" type="button">
            <svg class="icon icon-sm" aria-hidden="true"><use href="#i-folder"></use></svg>
            <span>本地文件夹</span>
          </button>
          <button class="pop-item" data-import="backfill" id="backfillBtn" type="button">
            <svg class="icon icon-sm" aria-hidden="true"><use href="#i-user"></use></svg>
            <span>补全歌手</span>
          </button>
          <p class="pop-note" id="importNote"></p>
        </div>

        <!-- 歌单删除确认（长按 / 右键切换条上的导入列表） -->
        <div class="pop pop-list" id="listPop" hidden>
          <p class="pop-title" id="listPopTitle"></p>
          <button class="pop-item" id="listDeleteBtn" type="button">
            <svg class="icon icon-sm" aria-hidden="true"><use href="#i-trash"></use></svg>
            <span>删除歌单</span>
          </button>
          <button class="pop-item" id="listCancelBtn" type="button">
            <svg class="icon icon-sm" aria-hidden="true"><use href="#i-close"></use></svg>
            <span>取消</span>
          </button>
        </div>
      </section>

      <!-- 搜索页：只覆盖舞台（封面 + 歌词）区域，不遮下方控制条 -->
      <section class="search-page" id="searchPage" hidden aria-label="搜索歌曲">
        <header class="search-head">
          <button class="back-btn" id="searchBackBtn" type="button">
            <svg class="icon icon-sm" aria-hidden="true"><use href="#i-chevron-left"></use></svg>
            <span>返回</span>
          </button>
          <div class="search-bar">
            <svg class="icon icon-sm" aria-hidden="true"><use href="#i-search"></use></svg>
            <input class="search-input" id="searchInput" type="search" placeholder="搜歌名 / 歌手" aria-label="搜索关键词" autocomplete="off">
            <button class="search-go" id="searchGoBtn" type="button" aria-label="搜索">搜索</button>
          </div>
          <!-- 平台 + 范围 = 一组筛选条件（一个选去哪找、一个选找什么）。
               宽窗跟输入框同一行；卡片（非宽窗）整组换行，内部平台条横滑、范围恒在可见处。 -->
          <div class="search-filters">
            <div class="search-servers" id="searchServers" role="group" aria-label="搜索平台"></div>
            <div class="search-scope" id="searchScope" role="group" aria-label="搜索范围">
              <button class="search-scope-btn is-active" type="button" data-scope="song" aria-pressed="true">搜歌曲</button>
              <button class="search-scope-btn" type="button" data-scope="artist" aria-pressed="false">搜歌手</button>
            </div>
          </div>
        </header>
        <!-- 推荐区：仅在未搜索时显示（搜索时整块隐去，改由结果列表接管） -->
        <div class="search-discover" id="searchDiscover">
          <section class="discover-block">
            <h3 class="discover-title">热门推荐</h3>
            <ol class="discover-songs" id="hotList"></ol>
          </section>
          <section class="discover-block" id="chartsBlock">
            <h3 class="discover-title">榜单 · 歌单</h3>
            <div class="discover-grid" id="chartsGrid"></div>
          </section>
          <section class="discover-block" id="radiosBlock">
            <h3 class="discover-title">热门电台</h3>
            <div class="discover-grid" id="radiosGrid"></div>
          </section>
        </div>
        <p class="search-section" id="searchSection" hidden></p>
        <ol class="search-list" id="searchList"></ol>
        <p class="search-note" id="searchNote"></p>
      </section>
    </section>

    <!-- 底部播放控制 · 静听（连续布局）：一张控制面，三种尺寸只重排周边槽位。
         时间线在上沿；下沿一行里，中央三键（上一首·播放·下一首）几何中心恒在面正中，
         宽窗「搜索 … 曲目信息+红心 … ⟳ … 音量 … 队列」，长卡/窄卡藏搜索与曲目信息、红心落最左，
         特别窄（宽 < 400）时模式与音量上移一行。几何与动效见 docs/player-ui/QUIET-CONTROLS-HANDOFF.md。 -->
    <footer class="controls" id="controls">
      <div class="controls-main">
        <div class="progress-row">
          <span class="time" id="curTime">1:03</span>
          <input class="range range-seek" id="seek" type="range" min="0" max="284" step="0.1" value="63" aria-label="播放进度">
          <span class="time" id="durTime">4:44</span>
        </div>

        <!-- 搜索入口：控制面最左端，从左侧展开搜索页（仅独立窗显示） -->
        <button class="search-entry" id="searchEntryBtn" type="button" aria-label="搜索歌曲" title="搜索歌曲">
          <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
        </button>

        <!-- 曲目信息（歌名 13 / 歌手 11 两行）+ 红心：紧邻成组 -->
        <div class="identity" id="ctlIdentity">
          <div class="track-copy ctl-title" id="ctlTitle">
            <strong id="ctlTitleText"></strong>
            <span id="ctlArtist"></span>
          </div>
          <button class="heart fav-btn fav-btn-bar" id="favBtn" type="button" aria-pressed="false" aria-label="加入我的喜欢" title="加入我的喜欢">
            <svg class="icon" aria-hidden="true"><use href="#i-heart"></use></svg>
          </button>
        </div>

        <!-- 播放模式：中央三键左侧 -->
        <button class="mode icon-btn" id="modeBtn" type="button"></button>

        <!-- 中央三键：整张面里唯一恒定的一组（44×44 / 中心距 52 / 整组宽 148） -->
        <div class="transport">
          <button class="icon-btn" id="prevBtn" type="button" aria-label="上一首" title="上一首">
            <svg class="icon" aria-hidden="true"><use href="#i-prev"></use></svg>
          </button>
          <button class="play-btn" id="playBtn" type="button" aria-label="暂停" title="暂停">
            <span class="play-glyph glyph-play" aria-hidden="true"><svg class="icon" aria-hidden="true"><use href="#i-play"></use></svg></span>
            <span class="play-glyph glyph-pause" aria-hidden="true"><svg class="icon" aria-hidden="true"><use href="#i-pause"></use></svg></span>
          </button>
          <button class="icon-btn" id="nextBtn" type="button" aria-label="下一首" title="下一首">
            <svg class="icon" aria-hidden="true"><use href="#i-next"></use></svg>
          </button>
        </div>

        <!-- 音量：一颗按钮。点 = 切静音；悬停（或键盘聚焦）向上弹出竖向滑条，移开即收。
             浮层是按钮的绝对定位子元素，三种布局通用（内部结构/交互/动效沿用最新生产版）。 -->
        <div class="volume-wrap vol-group" id="volGroup">
          <button class="icon-btn" id="muteBtn" type="button" aria-label="静音" title="静音" aria-haspopup="true" aria-expanded="false"></button>
          <div class="vol-pop" id="volPop">
            <input class="range range-vol" id="vol" type="range" min="0" max="100" step="1" value="72" aria-label="音量">
          </div>
        </div>

        <!-- 队列入口：控制面最右端（独立窗为右侧抽屉） -->
        <button class="queue-btn" id="queueBtn" type="button">
          <svg class="icon" aria-hidden="true"><use href="#i-list"></use></svg>
          <span class="qb-label"><span class="qb-word">队列</span> <span id="queueBtnCount">12</span><span class="qb-now">正在播放</span></span>
        </button>
      </div>
    </footer>

    <div class="toast" id="toast" hidden></div>
    <button class="resume-chip" id="resumeBtn" type="button" hidden>
      <svg class="icon icon-sm" aria-hidden="true"><use href="#i-play"></use></svg>
      <span>继续播放</span>
    </button>

    <pre class="report" id="report" hidden></pre>
  </div>
</div>

<script src="app.js" defer></script>
<script>window.__HANA_BUILD = "1003131620";</script>
<script type="module">
  import { hana } from "./sdk.js";
  window.hana = hana;
  window.__hana = hana;
  try { hana.ready(); } catch (e) { console.warn("[hana] ready failed", e); }
  window.dispatchEvent(new Event("hana-sdk-ready"));
</script>
</body>
</html>
