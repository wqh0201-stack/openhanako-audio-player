  /* ---------- softfocus 入场与驻留时的虚实 ---------- */
  PV.reg('treatment', 'softfocus', {
    nm: '柔焦', tags: ['calm', 'emotional'], w: 0.6,
    when: function () { return PV.fx.texture > 0.3 && PV.fx.motion < 0.6; }   /* 原来是 .45：七档气氛没有一档同时满足 texture>.45 与 motion<.6，
     * 等于这件永远抽不到（死门槛）。.3 之后 calm 与 emotional 能到 */,
    apply: function (c) {
      if (!c.el) return null;
      c.el.style.filter = 'blur(' + (0.2 + 0.5 * PV.fx.texture).toFixed(2) + 'px) saturate(1.06)';
      return function () { if (c.el) c.el.style.filter = ''; };
    }
  });

  /* ---------- dust 细尘（比 particles 更碎，texture 推） ---------- */
  PV.reg('treatment', 'dust', {
    nm: '细尘', tags: ['calm', 'emotional', 'editorial'], w: 0.7,
    when: function () { return PV.fx.texture > 0.3; },
    apply: function () {
      var g = layerEl('jv-dust');
      if (!g) return null;
      if (!g.childElementCount) {
        var h = '';
        for (var i = 0; i < 26; i++) {
          h += '<i style="left:' + (Math.random() * 98).toFixed(1) + '%;top:' + (Math.random() * 98).toFixed(1) +
            '%;width:' + (1 + Math.random() * 2).toFixed(1) + 'px;height:' + (1 + Math.random() * 2).toFixed(1) +
            'px;animation-duration:' + (5 + Math.random() * 9).toFixed(1) + 's;animation-delay:-' + (Math.random() * 9).toFixed(1) + 's"></i>';
        }
        g.innerHTML = h;
      }
      g.style.opacity = (0.14 + 0.5 * PV.fx.texture).toFixed(3);
      return null;
    }
  });
})();


/* PV 引擎 · 16 衔接层扩容（⑤）
 * 补三件：残影（上一段留半透明拖影）、三段切片擦入、由下推入。
 */
(function () {
  'use strict';
  var PV = window.PV;

  function an(el, kf, opt) {
    if (!el || !el.animate) return null;
    var a = el.animate(kf, opt);
    PV.addStop(function () { try { a.cancel(); } catch (e) { } });
    return a;
  }

  /* 残影：上一段原地留一份半透明副本，新段同时进来 */
  PV.reg('transition', 'trail', {
    nm: '残影', tags: ['glitch', 'emotional', 'graphic'], w: 0.8,
    when: function () { return PV.fx.motion > 0.3; },
    play: function (c, prev, next, swap) {
      /* 整行克隆预算：同一时刻只允许一份。上一轮 chroma 已经在克隆当前行时，
       * 这件就只做个淡入，不再叠第三份同文字（用户报的“字影叠字影”就是这么来的）。*/
      var mine = PV.requestGhost && PV.requestGhost('trail');
      if (prev && mine) {
        var g = prev.cloneNode(true);
        g.className = prev.className + ' jv-trail';
        g.setAttribute('aria-hidden', 'true');
        if (g.style) g.style.opacity = '';
        prev.parentNode.appendChild(g);
        an(g, [{ opacity: Math.min(.32, PV.ghostMax || .3) }, { opacity: 0, transform: 'translateY(-.6em) scale(1.03)' }],
          { duration: 420, fill: 'forwards', easing: 'ease-out' });
        var t = setTimeout(function () {
          if (g.parentNode) g.parentNode.removeChild(g);
          PV.releaseGhost && PV.releaseGhost('trail');
        }, 480);
        PV.addStop(function () {
          clearTimeout(t);
          if (g.parentNode) g.parentNode.removeChild(g);
          PV.releaseGhost && PV.releaseGhost('trail');
        });
      } else if (prev) {
        an(prev, [{ opacity: 1 }, { opacity: 0 }], { duration: 180, fill: 'both', easing: 'ease-in' });
      }
      swap();
      an(next, [{ opacity: 0 }, { opacity: 1 }], { duration: 260, fill: 'both', easing: 'ease-out' });
    }
  });

  /* 三段横向切片依次擦入 */
  PV.reg('transition', 'sliceIn', {
    nm: '切三', tags: ['glitch', 'graphic', 'pop'], w: 0.7,
    play: function (c, prev, next, swap) {
      /* 整行克隆预算：这件一次就克隆三份（每条切片一份），
       * 是“同一句话被画四遍”的最大来源。领不到票就做个普通擦入。*/
      if (PV.requestGhost && !PV.requestGhost('sliceIn')) {
        swap();
        an(next, [{ clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0 0 0)' }],
          { duration: 320, fill: 'both', easing: 'cubic-bezier(.5,0,.2,1)' });
        return;
      }
      swap();
      var h = ['inset(0 0 66.6% 0)', 'inset(33.3% 0 33.3% 0)', 'inset(66.6% 0 0 0)'];
      var w = ['inset(0 100% 66.6% 0)', 'inset(33.3% 100% 33.3% 0)', 'inset(66.6% 100% 0 0)'];
      for (var i = 0; i < 3; i++) {
        (function (i) {
          var b = document.createElement('div');
          b.className = 'jv-slice-in';
          b.style.clipPath = h[i];
          b.appendChild(next.cloneNode(true));
          b.firstChild.classList.add('show');
          b.style.opacity = '1';
          next.style.opacity = '0';
          next.parentNode.insertBefore(b, next);
          an(b, [{ clipPath: w[i], opacity: 1 }, { clipPath: h[i], opacity: 1, offset: 0.99 }, { clipPath: h[i], opacity: 0 }],
            { duration: 300 + i * 90, delay: i * 60, fill: 'both', easing: 'cubic-bezier(.5,0,.2,1)' });
          var t = setTimeout(function () {
            next.style.opacity = '';
            if (b.parentNode) b.parentNode.removeChild(b);
            if (i === 2 && PV.releaseGhost) PV.releaseGhost('sliceIn');
          }, 470 + i * 90);
          PV.addStop(function () { clearTimeout(t); if (b.parentNode) b.parentNode.removeChild(b); next.style.opacity = ''; });
        })(i);
      }
    }
  });

  /* 由下推入，上一段同时被顶上去 */
  PV.reg('transition', 'riseIn', {
    nm: '顶入', tags: ['pop', 'graphic', 'calm'], w: 0.8,
    play: function (c, prev, next, swap) {
      swap();
      var dist = Math.max(40, (c.stage ? c.stage.clientHeight : 400) * 0.16);
      an(next, [{ transform: 'translateY(' + dist.toFixed(0) + 'px)', opacity: .2 }, { transform: 'none', opacity: 1 }],
        { duration: 340 + 160 * PV.fx.motion, fill: 'both', easing: 'cubic-bezier(.18,.9,.28,1)' });
      if (prev) an(prev, [{ transform: 'none', opacity: 1 }, { transform: 'translateY(' + (-dist * 0.8).toFixed(0) + 'px)', opacity: 0 }],
        { duration: 300, fill: 'both', easing: 'ease-in' });
    }
  });
})();

/* PV 引擎 · 17 字体表（⑥）
 *
 * 离线优先：不引 Google Fonts，只用本机已装字体。两件事分开：
 *
 * 1) 组栈。一条 font-family 里「拉丁 display 在前、中文 display 在后、generic 收尾」。
 *    CSS 是一个字一个字往下找的：Impact 没有汉字，汉字就顺到下一个族去——所以一个变量
 *    同时拿到英文的冲击感和中文的骨架，不必拆两套。
 *
 * 2) 探测（只做报告，不参与删栈）。这里踩过两个坑，都记下来：
 *    · 基线不能用裸 monospace，要用一个必然不存在的族名——否则黑体/宋体这类
 *      与系统回退走宽相同的字体会被判成「没装」（实测误杀 SimHei）。
 *    · 就算换了基线，**中文字体本质上量不出来**：所有 CJK 字体的汉字进宽都是 1em，
 *      '永字八法' 换任何中文字体宽度都不变。只有拉丁部分能区分。
 *      所以探测是三态：true（拉丁段有差异）/ false（无差异）/ null（只能靠汉字判，未知）。
 *    结论：探测只用来在面板上告诉你「这个字体大概率在不在」，栈永远带全部候选——
 *    没装的族 CSS 自己跳，拿一个会误判的探测去删栈只会把好字体静默丢掉。
 *
 * 字体是一层（group 'face'），参与气氛与强调偏置；风格可以钉死自己的字体
 * （新闻体就该黑体，不该被随机带走）。auto 风格连字体一起让给 App，不抢。
 */
(function () {
  'use strict';
  var PV = window.PV;

  /* key, 名字, 中文栈, 拉丁栈, 字重, 字距, 气氛
   * 中文栈里英文名与本地化名都带：实测这台 Chrome 认「华文隶书」「等线」「微软雅黑」，
   * 却认不了 SimHei / SimSun / KaiTi / YouYuan——只写一种名字会静默掉回退。*/
  var DEF = [
    ['hei', '黑体', ['Microsoft YaHei', '微软雅黑', 'DengXian', '等线', 'SimHei', '黑体', 'PingFang SC'], ['Arial Black', 'Impact', 'Franklin Gothic Heavy'], 800, '.02em', ['pop', 'graphic', 'glitch', 'horror']],
    ['song', '宋体', ['STSong', '华文宋体', 'SimSun', '宋体', 'Songti SC', 'Noto Serif SC'], ['Georgia', 'Cambria'], 700, '.06em', ['editorial', 'calm', 'emotional']],
    ['kai', '楷体', ['STKaiti', '华文楷体', 'KaiTi', '楷体', 'KaiTi_GB2312', '楷体_GB2312'], ['Cambria', 'Georgia'], 600, '.12em', ['calm', 'emotional', 'editorial']],
    ['li', '隶书', ['STLishu', '华文隶书', 'LiSu', '隶书'], ['Cambria', 'Bodoni MT'], 700, '.14em', ['emotional', 'editorial', 'horror']],
    ['xing', '行楷', ['STXingkai', '华文行楷'], ['Harlow Solid Italic', 'Brush Script MT'], 600, '.10em', ['emotional', 'calm']],
    ['yuan', '圆体', ['STHupo', '华文琥珀', 'YouYuan', '幼圆', 'Microsoft YaHei'], ['Tw Cen MT', 'Berlin Sans FB'], 700, '.05em', ['pop', 'calm']],
    ['cai', '彩云', ['STCaiYun', '华文彩云', 'STZhongsong', '华文中宋'], ['Rockwell', 'Copperplate Gothic Light'], 700, '.16em', ['pop', 'emotional']],
    ['shu', '舒体', ['FZShuTi', '方正舒体', 'FZYaoTi', '方正姚体'], ['Rockwell', 'Bookman Old Style'], 700, '.06em', ['pop', 'graphic']],
    ['blk', '西洋黑', ['Microsoft YaHei', '微软雅黑', 'SimHei', '黑体'], ['Impact', 'Franklin Gothic Heavy', 'Arial Black'], 900, '-.01em', ['glitch', 'graphic', 'pop', 'horror']],
    ['scr', '西洋饰', ['SimHei', '黑体', 'Microsoft YaHei'], ['Bodoni MT', 'Copperplate Gothic Light', 'Elephant'], 700, '.10em', ['editorial', 'graphic']],
    ['goth', '哥特', ['Yu Gothic', 'Malgun Gothic', 'Microsoft JhengHei', '等线'], ['Bahnschrift', 'Franklin Gothic Demi'], 700, '.04em', ['glitch', 'graphic']],
    ['mono', '等宽', ['DengXian', '等线', 'Microsoft YaHei'], ['Consolas', 'Cascadia Mono', 'Courier New'], 700, '.02em', ['glitch', 'editorial', 'graphic']]
  ];

  var ctx2d = null, cache = {};
  function widths(f) {
    if (!ctx2d) ctx2d = document.createElement('canvas').getContext('2d');
    ctx2d.font = '64px ' + f;
    /* 只用拉丁段判：汉字进宽对所有 CJK 字体都是 1em，量了也白量 */
    return ctx2d.measureText('AWMWwm@123&fl').width;
  }
  function baseW() { if (cache.__b == null) cache.__b = widths('"__no_such_face_zzq__", monospace'); return cache.__b; }

  /* true 有 / false 没有 / null 判不了（该族只在中文段出现，或它与回退同宽） */
  function has(fam) {
    if (cache[fam] != null) return cache[fam];
    cache[fam] = Math.abs(widths('"' + fam + '", monospace') - baseW()) > 0.6;
    return cache[fam];
  }
  PV.faceHas = has;

  function look(fam) {
    /* 中文名也能量：'永' 这类汉字在任何中文字体里都是 1em，但本地化族名
     * 能否解析可以从拉丁段差异看出——量不出差异就当未知，不删栈 */
    return has(fam);
  }

  function stack(cjk, lat) {
    return lat.concat(cjk).map(function (f) { return '"' + f + '"'; }).join(',') + ',sans-serif';
  }

  DEF.forEach(function (d) {
    var all = d[2].concat(d[3]);
    var hit = [], miss = [], unk = [];
    all.forEach(function (f) {
      var v = look(f);
      if (v === true) hit.push(f); else if (v === false) miss.push(f); else unk.push(f);
    });
    PV.reg('face', d[0], {
      nm: d[1], tags: d[6], w: 1,
      weight: d[4], track: d[5],
      mono: d[0] === 'mono',
      cjk: d[2], latin: d[3],
      hit: hit, miss: miss, unknown: unk,
      stack: stack(d[2], d[3])
    });
  });

  PV.facesReport = function () {
    return PV.parts('face').map(function (f) {
      return f.key + ' ' + f.nm + '：判到 ' + f.hit.length + '、判无 ' + f.miss.length + '、判不了 ' + f.unknown.length +
        (f.hit.length ? '（' + f.hit.join(' ') + '）' : '');
    });
  };

  /* ---------- 应用 ---------- */
  var cur = null;
  PV.face = function (f) { if (f) cur = f; return cur; };

  PV.useFace = function (f) {
    if (typeof f === 'string') f = PV.part('face', f);
    if (!f) return PV.clearFace();
    cur = f;
    var st = PV.stage();
    if (!st) return f;
    st.style.setProperty('--jv-face', f.stack);
    st.style.setProperty('--jv-face-weight', String(f.weight));
    st.style.setProperty('--jv-face-track', f.track);
    return f;
  };
  PV.clearFace = function () {
    cur = null;
    var st = PV.stage();
    if (st) {
      st.style.removeProperty('--jv-face');
      st.style.removeProperty('--jv-face-weight');
      st.style.removeProperty('--jv-face-track');
    }
    return null;
  };
  PV.applyMonoStack = function () {
    var st = PV.stage(), m = PV.part('face', 'mono');
    if (st && m) st.style.setProperty('--jv-mono', m.stack);
  };

  PV.faceManual = false;                 // false = 参与抽签；字符串 = 钉死某个 face key
  PV.setFaceManual = function (k) {
    if (!k || k === 'auto') { PV.faceManual = false; PV.clearFace(); return null; }
    var f = PV.part('face', k);
    if (!f) return null;
    PV.faceManual = k;
    PV.useFace(f);
    return f;
  };

  /* 抽签优先级：本段指定 > 风格钉死 > 手动锁定 > 气氛/强调加权 */
  PV.rollFace = function (ctx, opts) {
    if (opts.face) return PV.part('face', opts.face);
    var st = ctx.style;
    if (st && st.face) { var pin = PV.part('face', st.face); if (pin) return pin; }
    if (PV.faceManual) { var mf = PV.part('face', PV.faceManual); if (mf) return mf; }
    return PV.choose('face', ctx, opts) || PV.part('face', 'hei');
  };
})();

/* PV 引擎 · 18 装配体检
 *
 * 层和件堆到一百多之后，真正没人管的是**几何**：
 *   - 版式的 fit() 只看字数，不看这行字在舞台上会不会顶出边界；
 *   - 逐字入场时长 = stagger × 字数 + duration，长句经常超过本段时长——
 *     字还没出完就换行，看起来像卡了一下；
 *   - 小字（注釈/HUD）压在正文上没人管碰撞。
 *
 * 所以这里做一个纯几何的体检：关掉入场/保持/镜头（否则量到的是动画中间态），
 * 逐个 版式 × 样例行 渲染，量四类问题。跑一次约 20×N 帧，几十毫秒级。
 *
 * 用法：PV.audit()            返回 {溢出, 入场超时, 挤压, 空段}
 *       PV.audit({quiet:true}) 只返回计数（控制台刷屏时用）
 */
(function () {
  'use strict';
  var PV = window.PV;

  /* 真实歌词会遇到的形状：短、中、长、超长、拉丁、混合、带空格、带记号 */
  PV.AUDIT_LINES = [
    '夜',
    '夜明けの色を',
    '夜明けの色を 覚えてる',
    '就算前面是深渊也别回头',
    '就算前面是深渊也别回头，我一直都在这里等',
    '就算前面是深渊也别回头我一直都在这里等从没有想过要放手',
    'We are the champions, my friends',
    'Standing in the rain of a thousand burning suns',
    '风也/停了/星也落了',
    '2026 年的夏夜，蝉声和吉他一起响',
    '*烧成灰也要亮一下*|现场版',
    '永字八法草龍龜_SN1234@#'
  ];

  function rectIn(inner, box) {
    var r = inner.getBoundingClientRect();
    return r.left >= box.left - 1 && r.right <= box.right + 1 &&
      r.top >= box.top - 1 && r.bottom <= box.bottom + 1;
  }
  function overArea(inner, box) {
    var r = inner.getBoundingClientRect();
    var w = Math.max(0, Math.min(r.right, box.right) - Math.max(r.left, box.left));
    var h = Math.max(0, Math.min(r.bottom, box.bottom) - Math.max(r.top, box.top));
    var outW = Math.max(0, r.width - w), outH = Math.max(0, r.height - h);
    return Math.round(outW * r.height + outH * r.width);
  }

  PV.audit = function (opts) {
    opts = opts || {};
    var L = PV.lyrics();
    var lines = opts.lines || PV.AUDIT_LINES.map(function (t) { return { text: t }; });
    var out = { 溢出: [], 入场超时: [], 空段: [], 边缘挤压: [], 入场挤压: [], 样本: lines.length, 跳过: 0 };
    var skipped = 0;
    var box;

    /* 入场时长用件上声明的 dur 与 staggerOf 算，不靠猜 */
    function enterCost(enter, ctx) {
      var st = ctx.stagger == null ? 45 : ctx.stagger;
      var n = ctx.tokens.length;
      /* 乘上引擎给本段算的 tempo：件声明的 dur 是理想值，真跑起来会被缩，
       * 不乘就会拿理想值去比真实窗口，报出来的全是假超时 */
      var tp = ctx.tempo == null ? 1 : ctx.tempo;
      return ((enter && enter.dur || 400) + st * (enter && enter.staggerOf || 1) * Math.max(0, n - 1)) * Math.min(1, tp);
    }

    var keepIdx = PV.curIdx();
    /* 体检基线必须包含上游：mood 与 fx 会改 when 门槛（谁在池里）与版式幅度（摆多远），
     * 不钉住它们，同一页连跑两次能拿到 10 和 0 两种结果——光播种不够。
     * 现在：气氛清空、强度回开机值、字体钉成黑体（宽度可控），跑完全部还原。 */
    var saved = { mood: PV.mood, fx: Object.assign({}, PV.fx), manual: PV.faceManual, style: PV.style() && PV.style().id };
    PV.mood = null;
    if (PV.FX0) Object.keys(PV.FX0).forEach(function (k) { PV.fx[k] = PV.FX0[k]; });
    /* 字体必须走 opts.face 逐格指定：faceManual 的优先级排在「风格钉死」之后，
     * 风格是 gold 这类钉了字体的时候，faceManual 根本管不到（实测就是这样量出不一致的数）。
     * 同时把风格切到 auto：颜色不改度量，但 auto 不钉字体，才能让 opts.face 说话。*/
    PV.setLyrics(lines);
    /* 体检必须自己播种：以前不播，于是它继承页面当前的随机流，
     * 同一个页面连跑两次能得出 14 / 16 两种结果——那这个工具给的数字就没一句能信。
     * 现在按（版式 × 行 × 段）固定播种，每一格都是可复现的。*/
    var layNo = {};
    PV.parts('layout').forEach(function (d, i) { layNo[d.key] = i; });
    /* 一轮扫描 = 一个字体下的全部（版式 × 行 × 段）格子。
     * 字体是真实变量（同一格子宋体比黑体宽），钉死字体换来的「0 溢出」不算答案，
     * 所以 opts.eachFace 能把 12 套字体各扫一遍。 */
    function pass(PINFACE) {
      var F = PINFACE === 'hei' ? '' : ' @' + PINFACE;
      for (var li = 0; li < lines.length; li++) {
        var cuts = PV.splitLine(lines[li], li) || [];
        if (!cuts.length && (lines[li].text || '').trim()) out.空段.push(li + ':' + lines[li].text.slice(0, 10));
        for (var ci = 0; ci < cuts.length; ci++) {
          var avail = cuts[ci].t1 - cuts[ci].t0;
          PV.parts('layout').forEach(function (lay) {
            if (lay.sp) return;
            /* 体检是强制每套版式吃每一行，但 fit() 本来就会拒掉一部分组合
             * （比如 22 字塞竖写）——那些在真实配牌里抽不到，报出来是假问题。
             * 先按 fit 筛一遍，只量可达的组合。 */
            var probe = PV.makeCtx(li, cuts[ci].text);
            probe.tokens = cuts[ci].tokens; probe.cutN = cuts.length; probe.cutI = ci;
            probe.t0 = cuts[ci].t0; probe.t1 = cuts[ci].t1;
            probe.ltr = PV.hasLatin(cuts[ci].text);
            if (lay.pre) lay.pre(probe);
            if (lay.fit && !lay.fit(probe)) { skipped++; return; }
            var p = null;
            var sd = 90000 + li * 419 + ci * 31 + (layNo[lay.key] || 0);
            PV.seed(sd);
            try {
              p = PV.show(li, {
                force: true, keepCuts: true, cutI: ci, layout: lay.key,
                bg: 'solid', look: 'none', face: PINFACE,
                enter: 'none', hold: 'none', exit: 'none', transition: 'cut', camera: 'none',
                decor: [], treatment: []
              });
            } catch (e) {
              out.溢出.push(lay.key + '@' + li + ' 抛错 ' + e.message + ' [seed ' + sd + ']' + F); return;
            }
            if (!p) return;
            var stage = PV.stage();
            if (!stage) return;
            box = stage.getBoundingClientRect();
            var toks = p.ctx.tokensEls || [];
            /* 量「所有可见行」而不只量当前行：前后幽灵行也在台上，
             * 上一轮就是幽灵行因为版式重写了 position 而排到舞台外，体检完全没看到。*/
            var lnav = PV.layer() ? PV.layer().querySelectorAll('.jv-line:not(.jv-out) .jv-t') : [];
            if (lnav.length) toks = Array.prototype.slice.call(lnav).filter(function (el) {
              if (!el.isConnected) return false;
              var q = el.getBoundingClientRect();
              return q.width || q.height;
            });
            if (!toks.length && lay.key !== 'ring' && lay.key !== 'interlude') {
              out.空段.push(lay.key + '@' + li + ' 无 token'); return;
            }
            /* 被裁掉的不算溢出：跑马/胶片这类版式故意把内容探出窗口，由某个
             * overflow:hidden 的祖先切掉。判据用引擎的 PV._clippedIn（和守卫同一个）——
             * 两各写一版的话，总有一天一版放行另一版报错。*/
            toks = toks.filter(function (el) { return !PV._clippedIn(el, stage, box); });
            var worst = 0, first = null;
            toks.forEach(function (el) {
              if (!rectIn(el, box)) {
                var a = overArea(el, box);
                if (a > worst) { worst = a; first = el.textContent; }
              }
            });
            if (worst > 40) out.溢出.push(lay.key + '@' + li + '「' + (first || '') + '」溢出 ' + worst + 'px² [seed ' + sd + ']' + F);
            /* 贴边：任何 token 距边界 < 6px 记一笔，攒久了画面很挤 */
            var tight = 0;
            toks.forEach(function (el) {
              var r = el.getBoundingClientRect();
              if (r.left - box.left < 6 || box.right - r.right < 6) tight++;
            });
            if (tight && tight >= Math.min(4, toks.length)) out.边缘挤压.push(lay.key + '@' + li + ' 贴边 ' + tight + ' 字 [seed ' + sd + ']' + F);

            /* 入场跑不完本段：拿基准登场件（升起）重算一次配牌（不碰 DOM），
             * 看引擎把 stagger 收完之后还有多长——收不下的才是真问题。 */
            var tp = PV.planLine(li, {
              keepCuts: true, cutI: ci, layout: lay.key, face: PINFACE, look: 'none', bg: 'solid',
              enter: 'rise', hold: 'none', exit: 'none', transition: 'cut', camera: 'none',
              decor: [], treatment: []
            });
            /* 时间不能只测 rise：⑫ 一下多了 12 件登场，只测默认那件就等于
             * 新件的时长没人管。登场的 dur/staggerOf 都在件上声明，
             * 这里不碰 DOM，拿同一套算式逐件算一遍——错了就是真错，不是量具错。*/
            var es = opts.eachEnter === false ? [PV.part('enter', 'rise')] : PV.parts('enter');
            es.forEach(function (ep) {
              if (!ep) return;
              var ectx = tp ? tp.ctx : null;
              var cost = enterCost(ep, ectx);
              if (cost > avail * 0.9) {
                out.入场超时.push(lay.key + '@' + li + ' 入场[' + ep.key + '] ' +
                  Math.round(cost) + 'ms，本段 ' + Math.round(avail) + 'ms（阈值 90%）[seed ' + sd + ']' + F);
              }
              /* tempo 收到 0.45 以下，字几乎同时出来——逐字入场已经没了。
               * 超时那项现在由引擎保证（收完必然落在预算里），能看出问题的反而是这个数。*/
              if (ectx && ectx.tempo != null && ectx.tempo < 0.45) {
                out.入场挤压.push(lay.key + '@' + li + ' 入场[' + ep.key + '] tempo=' +
                  ectx.tempo.toFixed(2) + '，' + (ectx.tokens ? ectx.tokens.length : '?') + ' 字挤在 ' +
                  Math.round(avail) + 'ms 里 [seed ' + sd + ']' + F);
              }
            });
            var cost = tp ? enterCost(tp.enter, tp.ctx) : 0;
            void cost;   /* 上面逐件算过了，这里不再单独报 rise，免得同一件事记两笔 */
          });
        }
      }
    }
    try {
      if (opts.eachFace) PV.parts('face').forEach(function (f) { pass(f.key); });
      else pass(opts.face || 'hei');
    } finally {
      PV.faceManual = saved.manual;
      if (saved.style && PV.useStyle) PV.useStyle(saved.style);
      /* 先恢复气氛（setMood 会把 fx 刷成该气氛的预设），再把 fx 精确贴回体检前的值 */
      if (saved.mood) PV.setMood(saved.mood);
      Object.assign(PV.fx, saved.fx);
      PV.setLyrics(L);
      if (keepIdx >= 0) PV.show(keepIdx, { force: true });
    }
    out.跳过 = skipped;
    out.可达组合 = out.可达组合 || (21 - 2) * lines.length;
    if (opts.quiet) {
      return {
        溢出: out.溢出.length, 入场超时: out.入场超时.length,
        空段: out.空段.length, 边缘挤压: out.边缘挤压.length
      };
    }
    return out;
  };
})();

/* PV 引擎 · 19 背景层（⑧）
 *
 * JIZURA 的背景是 66 件、逐段重掷的，我们之前整块底只有一个风格纯色——
 * 这就是「只有那一排在动」的根因。补一个 bg 层：每段按概率换，图样自己带强度，
 * 由 fx.texture / fx.density / energy 推着走。
 *
 * 三条规矩：
 *  · 一律挂在 #pvJv 上（在 .jv-track 之下、 folia 的 .pv-bg 之上），inset:0、不吃交互。
 *  · 换不换由 PV.bgSwap 管（0=跟着风格走，1=每段都换）。段段换会眼晕，
 *    JIZURA 自己也是「頻度」滑块而不是恒定切换。
 *  · 只建一个宿主层反复换样式，不按段往 DOM 里堆节点——粒子那种「一层用到老」是有意为之。
 */
(function () {
  'use strict';
  var PV = window.PV;

  PV.bgSwap = 0.45;         // 每段换背景的概率
  PV.defaults.bg = 'solid';
  if (PV.rolling) PV.rolling.bg = true;

  var host = null;
  function bgHost() {
    var L = PV.layer();
    if (!L) return null;
    if (!host || !host.isConnected) {
      host = L.querySelector('.jv-bg-layer');
      if (!host) {
        host = document.createElement('div');
        host.className = 'jv-bg-layer';
        L.insertBefore(host, L.firstChild);      // 永远在最底下
      }
    }
    return host;
  }
  PV.bgHost = bgHost;

  function put(el, props) {
    if (!el) return;
    for (var k in props) if (props[k] == null) el.style.removeProperty(k); else el.style.setProperty(k, props[k]);
  }

  /* ---------- 12 件背景 ---------- */
  PV.reg('bg', 'solid', {
    nm: '纯色', w: 1.2, tags: ['calm', 'editorial', 'pop', 'graphic', 'emotional', 'glitch', 'horror'],
    apply: function (c) { put(bgHost(), { background: '', 'background-image': '' }); }
  });

  PV.reg('bg', 'duo', {
    nm: '双色', w: 1, tags: ['pop', 'emotional', 'calm', 'graphic'],
    apply: function (c) {
      var st = c.style || {}, ang = Math.round(PV.rnd(360));
      var a = st.sub || 'color-mix(in srgb,var(--jv-bg) 78%, var(--jv-acc))';
      put(bgHost(), { 'background-image': 'linear-gradient(' + ang + 'deg, transparent, ' + a + ' 130%)' });
    }
  });

  PV.reg('bg', 'vig', {
    nm: '晕影', w: 0.9, tags: ['calm', 'emotional', 'editorial', 'horror'],
    apply: function () {
      put(bgHost(), {
        'background-image': 'radial-gradient(120% 92% at 50% 42%, transparent 34%, rgba(0,0,0,.55) 100%)'
      });
    }
  });

      });

  });

  /* 能量驱动的一层：没有音频数据时 when 不成立，抽不到 */
  PV.reg('bg', 'pulse', {
    nm: '能量底', w: 0.9, tags: ['pop', 'glitch', 'graphic'],
    when: function () { return PV.audio.energy != null; },
    apply: function () {

      if (!el) return null;
      el.style.setProperty('background-image', 'radial-gradient(120% 90% at 50% 60%, color-mix(in srgb,var(--jv-acc) 30%, transparent), transparent 62%)');
      el.style.mixBlendMode = 'screen';

      fr();
      PV.onFrame(fr);
      return function () { PV.offFrame(fr); el.style.mixBlendMode = ''; };
    }
  });

  /* ---------- 选与用 ---------- */
  var cur = null;
  PV.bgKey = function () { return cur; };

  PV.rollBg = function (ctx, opts) {
    if (opts.bg) return PV.part('bg', opts.bg) || PV.part('bg', PV.defaults.bg);
    if (PV.bgSwap <= 0) return cur ? PV.part('bg', cur) : PV.part('bg', PV.defaults.bg);
    if (cur && PV.rnd(1) > PV.bgSwap) return PV.part('bg', cur);   // 不换就沿用上件
    /* 决定换了就不再抽回同一件——否则「换率 0.45」实际只跑出 0.33，旋钮说的不算 */
    var b = PV.choose('bg', ctx, opts);
    for (var i = 0; i < 3 && b && cur && b.key === cur; i++) b = PV.choose('bg', ctx, opts);
    return b || PV.part('bg', 'solid');
  };

  PV.useBg = function (b, ctx) {
    if (typeof b === 'string') b = PV.part('bg', b);
    if (!b) b = PV.part('bg', PV.defaults.bg);
    if (!b) return null;
    cur = b.key;
    var el = bgHost();
    if (!el) return b;
    /* 换件前抹掉上一件留下的样式，否则 background-image / animation 会串台。
     * 清单要盖全：⑮ 加了带 mask / blend / position 的件后，这几个不在表里就会渗到下一段
     * （实测 9 件背景换到纯色后 mask 还在，整块底被遮得只余一角）。*/
    ['background-image', 'background-size', 'background-position', 'background',
     'animation', 'opacity', 'mix-blend-mode', 'filter',
     'mask-image', '-webkit-mask-image', 'mask-size', 'mask-position'].forEach(function (k) {
      el.style.removeProperty(k);
    });
    el.dataset.bg = b.key;
    if (b.apply) return b.apply(ctx || {}, el);
    return null;
  };
})();

/* PV 引擎 · 21 字形外观层（⑩ look）
 *
 * 吸收自 JIZURA 的 11p_looks.js——先纠正一句我上一轮说错的话：那个包是**混合包**，
 * 85 条里前 24 条才是真「字形外观」（袋文字/立体/傍点/マーカー…），后面混着背景、
 * 镜头、转场、后处理。而那 24 条对应的能力，我们**一件都没有**——133 件里没有一个
 * 改变文字本身涂装的层。所以这层是补空白，不是扩量。
 *
 * 归属规矩（比件数重要）：本层只写**涂装**——text-shadow / -webkit-text-stroke /
 * background-clip / text-decoration / text-emphasis / font-style / color，
 * 全部通过 .pv-jv[data-look=…] 作用在 `i.jv-t` 上。
 * 不碰 transform（归版式与镜头）、不碰 left/top 与 --fx/--fy/--fk（归守卫）、
 * 不碰 --drift-*（归保持层）。所以外观能和呼吸、拍震、守卫叠加而谁也不盖谁。
 *
 * vars 可以是对象，也可以是函数(ctx) —— 函数版让每件在自己那段里掷幅度，
 * 同一个件每段看起来不至于像一个模子。
 */
(function () {
  'use strict';
  var PV = window.PV;

  PV.defaults.look = 'none';
  if (PV.rolling) PV.rolling.look = true;

  function rnd(a, b, unit) { return (a + PV.rnd(b - a)).toFixed(1) + (unit || ''); }

  PV.reg('look', 'none', { nm: '无', w: 1.5, tags: ['calm', 'editorial', 'pop', 'graphic', 'emotional', 'glitch', 'horror'] });

  /* ---------- 描边族 ---------- */
  PV.reg('look', 'outline', {
    nm: '袋文字', w: 1, tags: ['pop', 'graphic'],
    vars: function () { return { '--lk-sw': rnd(0.035, 0.07, 'em') }; }
  });
  PV.reg('look', 'outlineFill', {
    nm: '缘取', w: 1, tags: ['pop', 'graphic', 'emotional'],
    vars: function () { return { '--lk-sw': rnd(0.04, 0.08, 'em'), '--lk-fill': 'var(--jv-fg)' }; }
  });
  PV.reg('look', 'doubleOutline', {
    nm: '二重缘', w: 0.7, tags: ['graphic', 'glitch'],
    vars: function () { return { '--lk-sw': rnd(0.04, 0.065, 'em'), '--lk-ring': rnd(2, 5, 'px') }; }
  });
  PV.reg('look', 'dotted', {
    nm: '点线缘', w: 0.55, tags: ['editorial', 'graphic'],
    when: function () { return PV.fx.texture > 0.2; },
    vars: function () { return { '--lk-sw': rnd(0.05, 0.08, 'em'), '--lk-dash': rnd(3, 6, 'px') }; }
  });
  PV.reg('look', 'echoOutline', {
    nm: '轮廓回响', w: 0.6, tags: ['emotional', 'glitch'],

  PV.reg('look', 'extrude', {
    nm: '立体', w: 0.9, tags: ['pop', 'graphic'],

      var a = (120 + PV.rnd(120)) * Math.PI / 180;                 // 光从左上，影子往右下
      return { '--lk-dx': Math.cos(a).toFixed(3), '--lk-dy': Math.abs(Math.sin(a)).toFixed(3), '--lk-n': 7 };

  PV.reg('look', 'glow', {

  /* ---------- 填充族（background-clip:text） ---------- */
  PV.reg('look', 'gradientV', {
    nm: '纵向渐变', w: 0.9, tags: ['emotional', 'pop', 'graphic'],

  });
  PV.reg('look', 'splitColor', {
    nm: '上下二色', w: 0.75, tags: ['graphic', 'pop'],
    vars: function () { return { '--lk-clip': '1', '--lk-stop': Math.round(38 + PV.rnd(24)) + '%' }; }
  });
  PV.reg('look', 'halftone', {
    nm: '网点', w: 0.6, tags: ['graphic', 'glitch', 'pop'],
    when: function () { return PV.fx.texture > 0.25; },
    vars: function () { return { '--lk-clip': '1', '--lk-dot': rnd(3, 7, 'px') }; }
  });
  PV.reg('look', 'stripes', {
    nm: '条纹填充', w: 0.6, tags: ['graphic', 'pop'],
    when: function () { return PV.fx.texture > 0.2; },
    vars: function () { return { '--lk-clip': '1', '--lk-pitch': rnd(4, 9, 'px'), '--lk-ang': Math.round(rnd(60, 130)) + 'deg' }; }
  });
  PV.reg('look', 'hatch', {
    nm: '斜线填充', w: 0.5, tags: ['editorial', 'graphic'],
    when: function () { return PV.fx.texture > 0.3; },
    vars: function () { return { '--lk-clip': '1', '--lk-pitch': rnd(2, 4.5, 'px') }; }
  });
  PV.reg('look', 'marker', {
    nm: '荧光标记', w: 0.8, tags: ['editorial', 'pop'],
    vars: function () { return { '--lk-mk': rnd(58, 86) + '%' }; }
  });

  /* ---------- 线与框族 ---------- */
  PV.reg('look', 'underline', {
    nm: '下划线', w: 0.8, tags: ['editorial', 'calm'],
    vars: function () { return { '--lk-ul': rnd(2, 5, 'px') }; }
  });
  PV.reg('look', 'strike', { nm: '删除线', w: 0.45, tags: ['editorial', 'glitch'] });
  PV.reg('look', 'boxed', {
    nm: '箱组', w: 0.7, tags: ['graphic', 'pop', 'editorial'],
    vars: function () { return { '--lk-pad': rnd(2, 8, 'px'), '--lk-bw': rnd(1, 2.5, 'px') }; }
  });
  PV.reg('look', 'emphasisDots', { nm: '傍点', w: 0.7, tags: ['emotional', 'editorial', 'calm'] });
  PV.reg('look', 'alternate', { nm: '交互色', w: 0.6, tags: ['pop', 'graphic'] });
  PV.reg('look', 'italic', { nm: '斜体', w: 0.7, tags: ['emotional', 'editorial'] });
  PV.reg('look', 'stencil', {
    nm: '镂空', w: 0.45, tags: ['glitch', 'horror', 'graphic'],

    vars: function () { return { '--lk-clip': '1', '--lk-sw': rnd(0.03, 0.05, 'em'), '--lk-bar': rnd(6, 14, 'px') }; }
  });

  /* ---------- 挂接：一层一件，只写 vars 与 data-look ---------- */
  var applied = [];

  function clearVars(el) {
    applied.forEach(function (k) { el.style.removeProperty(k); });
    applied = [];
  }

  PV.useLook = function (l, ctx) {
    if (typeof l === 'string') l = PV.part('look', l);
    if (!l) l = PV.part('look', PV.defaults.look);
    var el = PV.layer();
    if (!el) return l ? l.key : null;
    clearVars(el);
    el.dataset.look = l ? l.key : 'none';
    var v = l ? l.vars : null;
    if (v) {
      if (typeof v === 'function') v = v(ctx || {});

      });

    var el = PV.layer();
    return el ? (el.dataset.look || 'none') : null;

    if (PV.rolling.look === false) return PV.part('look', PV.defaults.look);
    return PV.choose('look', ctx, opts) || PV.part('look', 'none');
  };
})();

/* PV 引擎 · 22 版式扩充（⑨）
 *
 * 从 JIZURA 的 270+ 版式里挑结构上真不同的吸收进来。挑选标准三条：
 *   1) 与我们已有 21 套的构图逻辑不重复（不然只是换皮，抽到了也看不出来）；
 *   2) 纯 CSS/DOM 能表达，不依赖贴图与 canvas；
 *   3) 能被 fitGuard 兜住——绝对定位的都标 spread:1，让守卫按单字回收。
 *
 * 一条血规矩（⑩ 那轮刚踩的）：**不要在版式类上重写行元素的 position**。
 * .jv-line 本身是 position:absolute;inset:0，改写成 relative 会让当前行与
 * 前后幽灵行从"叠在一起"变成"竖着排队"，后两条直接排到舞台外面去。
 * 需要定位上下文就包一层自己的 div，或者依赖 .jv-line 已经是包含块这个事实。
 */
(function () {
  'use strict';
  var PV = window.PV;
  function cr(i) { var x = Math.sin(i * 12.9898) * 43758.5453; return x - Math.floor(x); }   // 行内稳定伪随机，同 seed 同画面

  /* ---------- 1 下三分 ---------- */
  PV.reg('layout', 'l3', {
    nm: '下三分', tags: ['editorial', 'calm', 'pop'], w: 0.9,
    fit: function (c) { return c.tokens.length <= 24; },
    render: function (c) { return '<div class="l3box">' + PV.spans(c) + '</div>'; }
  });

  /* ---------- 2 阶梯 ---------- */
  PV.reg('layout', 'stair', {
    nm: '阶梯', tags: ['graphic', 'pop'], w: 0.8, spread: 1,
    pre: function (c) { c.stagger = 60; },
    fit: function (c) { return c.tokens.length <= 10; },
    render: function (c) {
      var n = c.tokens.length;
      return PV.spans(c, {
        style: function (i) {
          return 'left:' + (8 + i * (74 / Math.max(1, n - 1 || 1))).toFixed(1) + '%;top:' +
            (66 - i * (46 / Math.max(1, n))).toFixed(1) + '%';
        }
      });
    }
  });

  /* ---------- 3 之字 ---------- */
  PV.reg('layout', 'zigzag', {
    nm: '之字', tags: ['pop', 'graphic'], w: 0.8, spread: 1,
    fit: function (c) { return c.tokens.length <= 14; },
    render: function (c) {
      var n = c.tokens.length;
      return PV.spans(c, {
        style: function (i) {
          return 'left:' + (6 + i * (86 / Math.max(1, n))).toFixed(1) + '%;top:' +
            (i % 2 ? 58 : 28) + '%;transform:rotate(' + (i % 2 ? 4 : -4) + 'deg)';
        }
      });
    }
  });

  /* ---------- 4 弧顶 ---------- */
  PV.reg('layout', 'arc', {
    nm: '弧顶', tags: ['emotional', 'calm', 'pop'], w: 0.8, spread: 1,
    fit: function (c) { return c.tokens.length >= 3 && c.tokens.length <= 16; },
    render: function (c) {
      var n = c.tokens.length;
      return PV.spans(c, {
        style: function (i) {
          var t = (i / (n - 1 || 1)) * 2 - 1;                       // -1..1
          var ang = t * 1.15;
          return 'left:' + (50 + Math.sin(ang) * 42).toFixed(1) + '%;top:' +
            (30 + (1 - Math.cos(ang)) * 46).toFixed(1) + '%;transform:rotate(' +
            (t * 16).toFixed(1) + 'deg)';
        }
      });
    }
  });

  /* ---------- 5 螺旋 ---------- */
  PV.reg('layout', 'spiral', {
    nm: '螺旋', tags: ['glitch', 'graphic', 'emotional'], w: 0.6, spread: 1,
    fit: function (c) { return c.tokens.length >= 4 && c.tokens.length <= 14; },
    render: function (c) {
      var n = c.tokens.length;
      return PV.spans(c, {
        style: function (i) {
          var a = i * 0.72 + cr(i + (c.idx || 0)) * 0.4, r = 6 + i * (30 / n);
          return 'left:' + (50 + Math.cos(a) * r).toFixed(1) + '%;top:' +
            (50 + Math.sin(a) * r * 0.62).toFixed(1) + '%;font-size:' +
            (30 - i * 1.2).toFixed(0) + 'px;transform:rotate(' + (a * 26).toFixed(0) + 'deg)';
        }
      });

  });

  /* ---------- 6 宫格 ---------- */
  PV.reg('layout', 'cells', {
    nm: '宫格', tags: ['graphic', 'editorial'], w: 0.8,
    fit: function (c) { return c.tokens.length >= 4 && c.tokens.length <= 12; },
    pre: function (c) { c.stagger = 40; },
    render: function (c) { return '<div class="cellgrid">' + PV.spans(c) + '</div>'; }
  });

  /* ---------- 7 头字下沉 ---------- */
  PV.reg('layout', 'dropcap', {
    nm: '头字下沉', tags: ['editorial', 'calm'], w: 0.9,
    fit: function (c) { return !c.ltr && c.tokens.length >= 5 && c.tokens.length <= 18; },
    render: function (c) {
      return PV.spans(c, { cls: function (i) { return i === 0 ? 'dc-first' : 'dc-rest'; } });
    }
  });

  /* ---------- 8 两端对齐 ---------- */
  PV.reg('layout', 'justified', {
    nm: '两端对齐', tags: ['editorial', 'calm', 'graphic'], w: 0.9,
    fit: function (c) { return c.tokens.length >= 6; },
    render: function (c) { return '<div class="justrow">' + PV.spans(c) + '</div>'; }
  });

  PV.reg('layout', 'framebox', {
    nm: '框中框', tags: ['graphic', 'editorial', 'pop'], w: 0.8,
    fit: function (c) { return c.tokens.length <= 20; },
    render: function (c) { return '<div class="fb2"><div class="fb1">' + PV.spans(c) + '</div></div>'; }
  });

  /* ---------- 10 气泡 ---------- */
  PV.reg('layout', 'bubble', {
    nm: '气泡', tags: ['pop', 'calm', 'emotional'], w: 0.8,
    fit: function (c) { return c.tokens.length <= 22; },
    render: function (c) { return '<div class="bub">' + PV.spans(c) + '<i class="bubtail"></i></div>'; }
  });

  /* ---------- 11 跑马 ---------- */
  PV.reg('layout', 'ticker', {
    nm: '跑马', tags: ['glitch', 'graphic', 'pop'], w: 0.7,
    fit: function (c) { return c.tokens.length >= 6; },
    render: function (c) {
      var t = PV.spans(c);
      return '<div class="tick"><div class="tickrun">' + t + t + '</div></div>';   // 两遍正文，滚动接缝看不出来
    }
  });

/* PV 引擎 · 24 退场扩充（⑫ exit +10）
 *
 * 契约同 05-exit.js：play(ctx, el, drop)，收尾**必须**调 drop()，否则上一行永远赖在台上。
 * drop 一律走 after() 注册成 stop——退出 PV 时会被取消，不留悬挂的定时器。
 * 同样只动 transform / opacity / clip-path / filter，不写 text-shadow 与颜色（⑩ 外观层的地盘）。

 *   2) 形状不与已有 18 件撞（准星/刻度/网格/斜纹/粒子/引线那些已经在了）；
 *   3) 一律挂在本次 cut 的 .jv-line 里、带 jv-d 类——元素随段生灭，且不会被竖写带走方向（①⑤ 踩过两次）。
 *

 * 免得再造一个没人拧的旋钮。

/* PV 引擎 · 26 处理扩充（⑭ treatment +14）
 *
 * JIZURA 的 27 件文字处理（treattrans 包）是 canvas 逐字画的：ctx.save/translate/vbands。
 * 我们这层是 DOM/CSS，所以搬的是**效果**不是代码——每件都用 CSS 原语重写一遍。
 *
 * 分工先划清（这是上一轮 ⑩ 学的教训：谁写哪个属性要事先定死，不然就是最后一个写的赢）：
 *   · .jv-w 的 transform      → 版式（位置与旋转）
 *   · .jv-w 的 translate      → 守卫 --gdx/--gdy + 本层 --ttx/--tty（合成在 base.css 里）
 *   · .jv-w 的 rotate / scale → 本层 --ttrot / --ttscale
 *   · i.jv-t 的 transform / opacity / filter → 登场层（WAAPI 动画）
 *   · i.jv-t 的涂装（stroke / shadow / clip）→ ⑩ 外观层
 * 所以本层**不碰 opacity、不碰 transform、不碰 text-shadow**：
 *   要淡用 filter: opacity()，要糊用 filter: blur()，要填色用 clip-path（外观层用的是 mask，不撞）。
 * 逐帧的件一律返回 cleanup 调 PV.offFrame——③⑤ 立过的规矩。
 */
(function () {
  'use strict';
  var PV = window.PV;

  function vars(el, o) { for (var k in o) el.style.setProperty(k, o[k]); }

  /* 一件处理：给本段的每个字按位置算一组 --tt* 值。
   * anim=true 时注册逐帧回调（随时间推进）。
   * 属性名必须写 CSS 写法（'clip-path'）：写成驼峰 clipPath 会被 style.setProperty
   * 静默丢掉——实测 karaokeFill 就这样完全没作用且不报错，只能靠逐件量改到几个字才拓得出来。
   * **不论动与不动都返回同一个 cleanup**：静太式的件也会留下面上的内联样式，
   * 不抹干净就会渗到下一段（⑩ 那边同一个坑）。*/
  function perChar(c, fn, anim) {
    var els = c.tokensEls || [], wraps = [];
    els.forEach(function (t) { if (t.parentElement) wraps.push(t.parentElement); });
    if (!wraps.length) return null;
    function paint(time) {
      for (var i = 0; i < wraps.length; i++) {
        var v = fn(i, wraps.length, time);
        if (v) vars(wraps[i], v);
      }
    }
    paint(0);
    if (!anim) return function () { clean(wraps, c); };
    var fr = function (lt) { paint(lt || 0); };
    PV.onFrame(fr);
    return function () { PV.offFrame(fr); clean(wraps, c); };
  }
  function clean(wraps, c) {
    for (var i = 0; i < wraps.length; i++) {
      var s = wraps[i].style;
      ['--ttx', '--tty', '--ttrot', '--ttscale', 'filter', 'clip-path', 'outline', 'border', 'border-radius', 'padding']
        .forEach(function (p) { s.removeProperty(p); });
    }
    if (c && c.el) c.el.style.removeProperty('letter-spacing');
  }

  /* ---------- 节奏与姿态 ---------- */
  PV.reg('treatment', 'sizeWave', {
    nm: '大小律动', w: 0.8, tags: ['pop', 'graphic', 'emotional'],
    apply: function (c) {
      var ph = PV.rnd(6.28);
      return perChar(c, function (i, n) {
        return { '--ttscale': (1 + 0.3 * Math.sin(ph + i * 0.9)).toFixed(3) };
      });
    }
  });

  PV.reg('treatment', 'rotateAlt', {
    nm: '摇摆字', w: 0.75, tags: ['pop', 'graphic', 'calm'],
    apply: function (c) {
      var amp = 2 + PV.rnd(6);
      return perChar(c, function (i) {
        return { '--ttrot': ((i % 2 ? 1 : -1) * amp).toFixed(1) + 'deg' };
      });
    }
  });

  PV.reg('treatment', 'baseShift', {
    nm: '基线错落', w: 0.75, tags: ['graphic', 'editorial', 'glitch'],
    apply: function (c) {
      return perChar(c, function (i) {
        var k = Math.sin((i + 1) * 2.399963) ;           // 黄金角伪随机，同 seed 稳定
        return { '--tty': (k * 9).toFixed(1) + 'px' };
      });
    }
  });

  PV.reg('treatment', 'jitterChar', {
    nm: '逐字抖动', w: 0.6, tags: ['glitch', 'horror'],
    when: function () { return PV.fx.glitch > 0.25; },
    apply: function (c) {
      var amp = 1 + PV.fx.glitch * 3;
      return perChar(c, function (i, n, t) {
        var s = Math.sin(t * 7 + i * 2.7) * amp, s2 = Math.cos(t * 9 + i * 1.9) * amp;
        return { '--ttx': s.toFixed(2) + 'px', '--tty': s2.toFixed(2) + 'px' };
      }, true);
    }
  });

  /* ---------- 时间与进度 ---------- */
  PV.reg('treatment', 'karaokeFill', {
    nm: '逐字填色', w: 0.85, tags: ['pop', 'editorial', 'emotional'],
    apply: function (c) {
      var span = Math.max(600, ((c.t1 || 4000) - (c.t0 || 0)) * 0.8) / 1000;
      return perChar(c, function (i, n, t) {
        var k = Math.min(1, Math.max(0, (t / span) * n - i));
        var p = Math.round(Math.max(0, Math.min(100, (1 - k) * 100)));
        return { 'clip-path': 'inset(0 ' + p + '% 0 0)' };
      }, true);
    }
  });

  PV.reg('treatment', 'focusPull', {
    nm: '虚实推进', w: 0.7, tags: ['emotional', 'calm'],
    when: function () { return PV.fx.chroma > 0.15; },
    apply: function (c) {
      return perChar(c, function (i, n, t) {
        var k = Math.sin(t * 1.1 - i * 0.5);
        return { filter: 'blur(' + Math.max(0, k * 2.4).toFixed(2) + 'px)' };
      }, true);
    }
  });

  PV.reg('treatment', 'afterglow', {
    nm: '余韵渐隐', w: 0.7, tags: ['calm', 'emotional'],
    apply: function (c) {
      var n = (c.tokensEls || []).length;
      return perChar(c, function (i) {
        var o = 1 - (i / Math.max(1, n - 1)) * (0.25 + PV.rnd(0.35));
        return { filter: 'opacity(' + o.toFixed(2) + ')' };
      });
    }
  });

  PV.reg('treatment', 'hueWave', {
    nm: '逐字换色', w: 0.6, tags: ['pop', 'glitch'],
    when: function () { return PV.fx.chroma > 0.3; },
    apply: function (c) {
      var step = 12 + PV.rnd(40);
      return perChar(c, function (i) {
        return { filter: 'hue-rotate(' + (i * step % 330) + 'deg) saturate(1.25)' };
      });
    }
  });

  /* ---------- 印刷与切版 ---------- */
  PV.reg('treatment', 'cutShift', {
    nm: '错位切断', w: 0.6, tags: ['glitch', 'graphic'],
    when: function () { return PV.fx.glitch > 0.2; },
    apply: function (c) {
      return perChar(c, function (i) {
        if (i % 3 !== 1) return null;
        var d = (PV.rnd(1) - 0.5) * 14;
        return { '--ttx': d.toFixed(1) + 'px', 'clip-path': 'inset(0 0 50% 0)' };
      });
    }
  });

  PV.reg('treatment', 'rgbSplitChar', {
    nm: '逐字色版错位', w: 0.6, tags: ['glitch', 'pop'],
    when: function () { return PV.fx.glitch > 0.15 && PV.fx.chroma > 0.15; },
    apply: function (c) {
      var d = 1.5 + PV.fx.glitch * 4;
      return perChar(c, function (i) {
        var f = i % 2 ? 'drop-shadow(' + d.toFixed(1) + 'px 0 0 rgba(255,0,80,.55))' : 'drop-shadow(-' + d.toFixed(1) + 'px 0 0 rgba(0,220,255,.5))';
        return { filter: f };
      });
    }
  });

  PV.reg('treatment', 'gridCell', {
    nm: '原稿用紙', w: 0.55, tags: ['editorial', 'graphic', 'calm'],
    fit: function (c) { return c.tokens.length <= 24; },
    apply: function (c) {
      return perChar(c, function () {
        return { outline: '1px solid color-mix(in srgb, var(--jv-fg) 30%, transparent)', outlineOffset: '3px' };
      });
    }
  });

  PV.reg('treatment', 'circledChar', {
    nm: '逐字圈', w: 0.5, tags: ['pop', 'emotional'],
    when: function () { return PV.fx.decor > 0.4; },
    fit: function (c) { return c.tokens.length <= 14; },
    apply: function (c) {
      return perChar(c, function () {
        return {
          border: '1px solid color-mix(in srgb, var(--jv-acc) 60%, transparent)',
          borderRadius: '50%', padding: '2px 4px'
        };
      });
    }
  });

  PV.reg('treatment', 'wideSpace', {
    nm: '字距拉开', w: 0.7, tags: ['editorial', 'calm', 'graphic'],
    apply: function (c) {
      if (c.el) c.el.style.setProperty('letter-spacing', (0.16 + PV.rnd(0.42)).toFixed(2) + 'em');
      return perChar(c, function () { return null; });
    }
  });
  PV.reg('treatment', 'spotChar', {
    nm: '一字加亮', w: 0.55, tags: ['pop', 'emotional', 'editorial'],
    apply: function (c) {
      var n = (c.tokensEls || []).length, hit = n ? Math.floor(PV.rnd(n)) : -1;
      return perChar(c, function (i) {
        if (i !== hit) return { filter: 'opacity(.72)' };
        return { '--ttscale': '1.18', filter: 'brightness(1.25) drop-shadow(0 0 6px color-mix(in srgb, var(--jv-acc) 60%, transparent))' };
      });
    }
  });
})();




/* PV 引擎 · 27 背景扩充（⑮ bg +17）
 *
 * JIZURA 的 37 件背景（bgcamB 包）是 canvas 画的。这层搬的同样是效果：
 * 全部用 background-image 的渐变组合 + mask + animation 实现，不吃贴图。
 *
 * 归属规矩（与 ⑧ 一致，别越界）：只动 `.jv-bg-layer` 这一个节点上的
 * background-image / background-size / background-position / opacity / mask / animation。
 * 不碰 token、不碰 .jv-track、不碰 --lk-*（⑩ 外观）、不碰 --tt*（⑭ 处理）。
 * 强度一律读 fx.texture / fx.density / fx.chroma，动画件写进 bg.css 的 @keyframes。
 */
(function () {
  'use strict';
  var PV = window.PV;

  /* 通用铺法：给 .jv-bg-layer 写一套背景 */
  var PAINT_KEYS = { img: 1, size: 1, pos: 1, op: 1, anim: 1, blend: 1, mask: 1 };
  function paint(c, o) {
    var el = PV.bgHost();
    if (!el) return null;
    /* 不认的键**直接抛**：写成 position 而不是 pos 会被静默丢掉，
     * 而这种错在画面上看不出来、在数据上又隐身（⑭ 刚踩过 setProperty 驼峰同款）。*/
    for (var key in o) if (!PAINT_KEYS[key]) throw new Error('bg paint: 不认识的选项 ' + key);
    if (o.img) el.style.setProperty('background-image', o.img);
    if (o.size) el.style.setProperty('background-size', o.size);
    if (o.pos) el.style.setProperty('background-position', o.pos);
    el.style.opacity = o.op == null ? '1' : String(o.op);
    if (o.anim) el.style.setProperty('animation', o.anim);
    if (o.blend) el.style.setProperty('mix-blend-mode', o.blend);
    if (o.mask) { el.style.setProperty('-webkit-mask-image', o.mask); el.style.setProperty('mask-image', o.mask); }
    return null;
  }
  function tex() { return PV.fx.texture; }
  function den() { return PV.fx.density; }
  function chm() { return PV.fx.chroma; }
  function F(pct) { return 'color-mix(in srgb, var(--jv-fg) ' + pct + '%, transparent)'; }
  function A(pct) { return 'color-mix(in srgb, var(--jv-acc) ' + pct + '%, transparent)'; }

  /* ---------- 和织物与印刷 ---------- */
  PV.reg('bg', 'seigaiha', {
    nm: '青海波', w: 0.8, tags: ['calm', 'editorial', 'graphic'],
    apply: function (c) {
      var u = Math.round(26 + den() * 26);
      return paint(c, {
        img: 'radial-gradient(circle at 50% 100%, transparent 0 ' + (u * 0.5 - 3) + 'px, ' + F(30) + ' ' +
          (u * 0.5 - 3) + 'px ' + (u * 0.5 - 1.5) + 'px, transparent ' + (u * 0.5 - 1.5) + 'px ' +
          (u * 0.5 + 3) + 'px, ' + F(30) + ' ' + (u * 0.5 + 3) + 'px ' + (u * 0.5 + 4.5) + 'px, transparent ' + (u * 0.5 + 4.5) + 'px)',
        size: u + 'px ' + (u / 2) + 'px',
        op: (0.1 + 0.34 * tex()).toFixed(2)
      });
    }
  });

  PV.reg('bg', 'tartan', {
    nm: '苏格兰格', w: 0.7, tags: ['pop', 'graphic', 'editorial'],
    apply: function (c) {

 *
 * 归属：镜头只写 `.jv-track` 的 transform（translate / scale / rotate）。
 * ⑬ 那轮补了规矩：applyIn 在换件前把 track 的 transform/filter 抹掉——
 * 因为 .jv-track 是常驻节点，不清场的话上一段的推镜会永久留在画面上。

 * 姿态类（俯仰 / 侧倾往复 / 钟摆 / 眩晕 / 浮动噪声）与运镜类（snap pan / 电梯 /

(function () {

    if (!tr) return null;

    for (var key in opts) if (key !== 'origin') throw new Error('camera frame: 不认识的选项 ' + key);
    if (opts.origin) tr.style.transformOrigin = opts.origin;

      var s = fn(tr);
      if (s) tr.style.transform = s;

    fr();
    PV.onFrame(fr);
    return function () {

      if (opts.origin) tr.style.removeProperty('transform-origin');

    nm: '俯仰', tags: ['emotional', 'graphic'], w: 0.6,
    apply: function (c) {

      return frame(c, function () {
        var k = Math.sin((c.lt || 0) * 0.55);

      });

/* PV 引擎 · 29 转场扩充（⑰ transition +12）
 *
 * 契约（同 07-transition.js）：play(ctx, prev, next, swap)。
 *   · swap() 负责把新行挂上、旧行摘掉——**必须调用**，不调就是白屏；
 *   · 想在 swap 之前先演一段（旧行还在台上），就先动 prev，再在动画结束时 swap；
 *   · 想在 swap 之后演（新行已上台），先 swap() 再动 next——我们的 wipe 系都是后者，
 *     因为 swap 之后 DOM 稳定，不会出现"新旧两层同时在 clip 里打架"。
 *
 * 他们的 trans 池是 24 件（各包里的 `trReg(...)`）。这轮搬 12 件纯 clip / transform 能做的：
 * 斜带擦、时钟擦、观音开门、百叶、市松推入、块溶、像素 mosaic、覆盖/揭开、
 * 立方翻、短册移、闪接、 blink。
 */
(function () {
  'use strict';
  var PV = window.PV;

  function an(el, kf, opt) {

    if (!el.animate) return null;
    var a = el.animate(kf, opt);
    PV.addStop(function () { try { a.cancel(); } catch (e) { } });
    return a;

  /* clockWipe 已升级为真合成版，见 31-trans3.js（③ 续）*/

  /* 开门（⑳ 真合成）：旧行从中间合拢关掉，新行从中间拉开——两帧互补 */
  PV.reg('transition', 'doors', {
    nm: '开门', tags: ['graphic', 'pop', 'editorial'], w: 0.7, ownsPrev: 1,
    play: function (c, prev, next, swap, drop) {
      swap();
      var d = D(420);
      if (next) an(next, [{ clipPath: 'inset(0 50% 0 50%)' }, { clipPath: 'inset(0 0 0 0)' }],
        { duration: d, fill: 'both', easing: 'cubic-bezier(.5,0,.2,1)' });

        { clipPath: 'inset(0 50% 0 50%)', opacity: 0 }],
        { duration: d, fill: 'both', easing: 'ease-in' });

        if (next) { next.style.removeProperty('clip-path'); next.style.removeProperty('-webkit-mask-image'); next.style.removeProperty('mask-image'); }
        drop();
      }));
    }

/* PV 引擎 · 30 调参（⑲）
 *
 * 三件东西，都是为了让"观感"能被调，而不是每次让我改代码：
 *   1) 近窗去重 PV.dedupe —— 同类件在近 N 段里不重复抽（修"连着几段一个样"）
 *   2) 档位 PV.tune('quiet'|'balanced'|'rich'|'wild') —— 一次改一组旋钮并落到 localStorage
 *   3) 体检式报告 PV.tuneReport(n) —— 把"撞脸率 / 平均装饰数 / 入场占用"量成数字
 *
 * 旋钮只认这几种长期偏好：bgSwap、decorMax、treatMax、dedupe、rolling。
 * 强度 fx 不在这里动——那个归气氛与音频调制（③），动它会和气氛预设打架。
 */
(function () {
  'use strict';
  var PV = window.PV;

  /* ---------- 1 近窗去重 ---------- */
  /* 只保留有证据的：版式。
   * bg / look 的窗口实测白搭——背景连着重复的主因是 bgSwap 粘住上一件
   * （0.45 概率不换 ≈ 55% 保持），那条路径**不走抽签**，窗口根本管不到；
   * 实测开关窗口都是 52.3%，而把 bgSwap 推到 1 就呷到 0.0%——
   * 说明背景的重复归 bgSwap 管，不归去重管。造一个作不了用的旋钮，
   * 比没有旋钮更糟（fx.decor 那次就是这个病）。*/
  PV.dedupe = { layout: 6, bg: 0, look: 0, camera: 0, enter: 0, exit: 0, transition: 0, hold: 0 };

  PV.recordRecent = function (plan) {
    var S = PV.S;
    if (!S.recent) return;
    Object.keys(PV.dedupe).forEach(function (g) {
      var p = plan[g];
      if (!p) return;
      var arr = S.recent[g] || (S.recent[g] = []);
      if (arr[arr.length - 1] !== p.key) arr.push(p.key);
      /* 满长时要从**队首**丢。上一版写的 `arr.length = keep` 是在 push 之后截尾，
       * 正好把刚加进去的那个删掉——窗口在前 N 次之后就冻结了，
       * 后面的抽取全部在和一串陈旧名单比，去重形同没接。*/
      var keep = Math.max(PV.dedupe[g] || 0, 8) + 2;
      if (arr.length > keep) arr.splice(0, arr.length - keep);
    });
  };
  PV.recentOf = function (g) { return (PV.S.recent && PV.S.recent[g]) || []; };
  PV.clearRecent = function () {
    var S = PV.S;
    Object.keys(S.recent).forEach(function (g) { S.recent[g] = []; });
    S.lastLayout = '';
  };

  /* ---------- 2 档位 ---------- */
  var PRESETS = {
    quiet: {
      nm: '静', bgSwap: 0.22, decorMax: 1, treatMax: 0,
      rolling: { camera: false, hold: false }, dedupe: { layout: 8 }
    },
    balanced: {
      nm: '均衡', bgSwap: 0.45, decorMax: 2, treatMax: 1,
      rolling: { camera: true, hold: true }, dedupe: { layout: 6 }
    },
    rich: {
      nm: '满', bgSwap: 0.6, decorMax: 3, treatMax: 1,
      rolling: { camera: true, hold: true }, dedupe: { layout: 4 }
    },
    wild: {
      nm: '乱', bgSwap: 1, decorMax: 3, treatMax: 2,
      rolling: { camera: true, hold: true }, dedupe: { layout: 1 }
    }

  PV.PRESETS = PRESETS;

  PV.tune = function (name) {

    PV.tuneName = name || PV.tuneName;
    if (p.bgSwap != null) PV.bgSwap = p.bgSwap;
    if (p.decorMax != null) PV.decorMax = p.decorMax;
    if (p.treatMax != null) PV.treatMax = p.treatMax;
    if (p.rolling) Object.keys(p.rolling).forEach(function (k) { if (k in PV.rolling) PV.rolling[k] = p.rolling[k]; });

  };

   * 静/满是偏好，不该由引擎擅自替用户选。*/
  PV.tuneRestore = function () {
    var n = null;

    return n;
  };

  /* ---------- 3 报告：把观感量成数字 ---------- */
  PV.tuneReport = function (n) {
    n = n || 300;
    var L = PV.lyrics();
    if (!L.length) return { 说明: '没有歌词表，先 PV.setLyrics 或在 App 里放歌' };
    var savedSeed = PV.seedValue ? PV.seedValue() : null;
    var seq = { layout: [], bg: [], look: [] }, dupe = { layout: 0, bg: 0, look: 0 };
    var win = { layout: 0, bg: 0 };          // 近 N 段窗口内的重复（去重真正管的是这个，不是“紧邻”）
    var decorSum = 0, treatSum = 0, entSum = 0, entOver = 0, cuts = 0;
    for (var i = 0; i < n; i++) {
      PV.seed(100000 + i * 7);
      var p = PV.show(i % L.length, { force: true });
      if (!p) continue;
      cuts++;
      ['layout', 'bg', 'look'].forEach(function (g) {
        var k = p[g] ? p[g].key : '—';
        var prevKey = seq[g][seq[g].length - 1];
        if (prevKey && prevKey === k) dupe[g]++;
        if (g === 'layout' || g === 'bg') {
          var w = g === 'layout' ? (PV.dedupe.layout || 6) : (PV.bgSwap < 1 ? 3 : 0);
          if (w > 0 && seq[g].slice(Math.max(0, seq[g].length - w)).indexOf(k) >= 0) win[g]++;
        }
        seq[g].push(k);
      });
      decorSum += (p.decor || []).length;
      treatSum += (p.treatment || []).length;
      var cost = (p.enter && p.enter.dur || 400) + (p.ctx.stagger || 45) * Math.max(0, (p.ctx.tokens || []).length - 1);
      var avail = (p.ctx.t1 || 0) - (p.ctx.t0 || 0);
      entSum += avail > 0 ? cost / avail : 0;
      if (avail > 0 && cost > avail * 0.9) entOver++;
    }
    if (savedSeed != null) PV.seed(savedSeed);
    var pct = function (x) { return (x * 100).toFixed(1) + '%'; };
    return {
      段数: cuts,
      档位: PV.tuneName || 'balanced',
      /* 近窗重版式：注意——去重代码已接上并确实在过滤（10 连抽追踪里窗口正确滑走），
       * 但长序列统计仍在这附近徘徊，**两者未能调和**，所以下面这一项现在只能当现状读数，
       * 不能当“旋钮生效的证据”。调大窗口前先把这个矛盾查清楚。*/
      连着两段同版式: pct(dupe.layout / Math.max(1, cuts)),
      近窗口内重版式: pct(win.layout / Math.max(1, cuts)),
      近窗口内重背景: pct(win.bg / Math.max(1, cuts)),
      连着两段同背景: pct(dupe.bg / Math.max(1, cuts)),
      连着两段同外观: pct(dupe.look / Math.max(1, cuts)),
      平均装饰件数: (decorSum / Math.max(1, cuts)).toFixed(2),
      平均处理件数: (treatSum / Math.max(1, cuts)).toFixed(2),
      入场占段长比例: pct(entSum / Math.max(1, cuts)),
      入场超段: entOver,
      旋钮: { bgSwap: PV.bgSwap, decorMax: PV.decorMax, treatMax: PV.treatMax, dedupe: PV.dedupe }
    };
  };
})();

/* PV 引擎 · 31 真合成转场补充（③ 续）
 * 三件从「只动新行」升级成 prev / next 互补：
 *   时钟擦 —— conic 遮罩角度扫过（注册 @property 才能动画自定义属性）
 *   斜带擦 —— 两边用互补的多边形 clip，旧行被斜边推走
 *   短册移 —— 竖条 mask 左右反向滑移，旧行拆成条退场

    nm: '时钟擦', tags: ['graphic', 'editorial'], w: 0.6,
    when: function () { return PV.fx.texture > 0.1; }, ownsPrev: 1,
    play: function (c, prev, next, swap, drop) {
      swap();
      var d = D(620);
      var support = window.CSS && CSS.registerProperty !== undefined;
      if (!support) {
        // 退化：走 steps 单向揭开，至少不会白屏
        if (next) an(next, [{ clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0 0 0)' }],
          { duration: d, fill: 'both', easing: 'steps(9, end)' });

        [next, prev].forEach(function (el) {

      }));
    }
  });

  /* 斜带擦（真合成）：prev 与 next 用互补多边形，斜边推过去 */

    nm: '斜带擦', tags: ['graphic', 'pop'], w: 0.8, ownsPrev: 1,
    play: function (c, prev, next, swap, drop) {

      });

/* PV 引擎 · 32 运动幅度预算（修用户说的“抖动特别强烈”）
 *
 * 实测（glitch 气氛、逐帧采样 700ms 的位移范围）：
 *   crashZoom 201×113px、bounceIn 50×28、hold:beat 横向 49px、earthquake 22×21
 * crashZoom/bounceIn 那两条离谱，原因不是系数写大，而是**它们缩放的是整屏 .jv-track**：
 * 离中心越远的字位移越大（半屏 × 0.42 ≈ 200px），跟字号无关。
 *
 * 三条规矩：
 *   1. 整屏 scale 一律换算成"允许的边缘位移" —— PV.moveMax（默认 26px），
 *      件里写的 s-1 会被 clamp 到 (moveMax / 半屏)。
 *   2. 抖源互斥：camera 与 hold 同帧都抖时，hold 让位（实测 160 段里 4 次同时开）。
 *      两件各自抖各自的不叫叠加，叫糊。
 *   3. 件只读 PV.motionGain / PV.shakeGain，不在自己里乘 fx——缩放集中在引擎，
 *      改观感不用翻十几个文件。
 */
(function () {
  'use strict';
  var PV = window.PV;

  PV.moveMax = 26;      // 整屏位移/边缘摆幅上限（px）
  PV.shakeGain = 1;     // 全局抖动系数（0.5 = 所有抖都温柔一半）

  /* 哪些件属于"高频抖"：同帧只允许一个发声 */
  var SHAKE = {
    camera: { handheld: 1, beatZoom: 1, earthquake: 1, vertigo: 1, snapPan: 1, bounceIn: 1, crashZoom: 1, pendulum: 1, tiltDown: 1 },
    hold: { jitter: 1, beat: 1 }
  };

  /* 整屏 scale 的预算换算：s 是想要的 scale，返回不超过 moveMax 边缘位移的 scale */
  PV.scaleClamp = function (s) {
    var st = PV.stage();
    var half = st ? Math.max(1, st.getBoundingClientRect().width / 2) : 480;
    var maxS = 1 + PV.moveMax / half;
    if (s >= 1) return Math.min(s, maxS);
    return Math.max(s, 2 - maxS);          // 缩小方向同理
  };
  /* 整屏平移的预算 */
  PV.shiftClamp = function (px) {
    var lim = PV.moveMax;
    return Math.max(-lim, Math.min(lim, px));
  };

  /* ---------- 写 .jv-track 的 transform 只能经这两个入口 ----------
   * 以前 10 处各自拼字符串，scale 想怎么写就怎么写，于是“整屏缩放”把边缘字
   * 甩出 200px（半屏 × 0.42）。现在：件报它想要的值，这里统一钳位。
   * 不用“每帧再重写一次”的夹法：那个依赖帧序，相机件会在同一帧里把大值写回去
   * （我就是刚这么错过一次，看起来接上了其实没生效）。*/
  PV.tfScale = function (s, extra) {
    var st = PV.stage();
    var half = st ? Math.max(1, st.getBoundingClientRect().width / 2) : 480;
    var maxS = 1 + PV.moveMax / half;
    s = s >= 1 ? Math.min(s, maxS) : Math.max(s, 2 - maxS);
    return 'scale(' + s.toFixed(4) + ')' + (extra ? ' ' + extra : '');
  };
  PV.tfMove = function (x, y, extra) {
    var lim = PV.moveMax;
    x = Math.max(-lim, Math.min(lim, x * PV.shakeGain));
    y = Math.max(-lim, Math.min(lim, y * PV.shakeGain));
    return 'translate(' + x.toFixed(2) + 'px,' + y.toFixed(2) + 'px)' + (extra ? ' ' + extra : '');
  };

  /* 包一层 camera/hold 的 apply：抖源互斥 + 全局抖动系数 + scale/位移 clamp */
  function wrap(group, key) {
    var d = PV.part(group, key);
    if (!d || !d.apply || d.__wrapped) return;
    var raw = d.apply;
    d.__wrapped = 1;
    d.apply = function (c, target) {
      // 抖源互斥：camera 在抖时，hold 的抖动件直接退化成呼吸
      if (group === 'hold' && SHAKE.hold[key] && PV.S.plan && PV.S.plan.camera &&
          SHAKE.camera[PV.S.plan.camera.key] && PV.S.plan.camera.key !== 'none') {
        var soft = PV.part('hold', 'breathe');
        return soft && soft.apply ? soft.apply(c, target) : null;
      }
      var r = raw(c, target);
      return r;
    };
  }
  Object.keys(SHAKE.camera).forEach(function (k) { wrap('camera', k); });
  Object.keys(SHAKE.hold).forEach(function (k) { wrap('hold', k); });
  PV.MOTION_BUDGET = { moveMax: function () { return PV.moveMax; }, shake: SHAKE };
})();

})();
</script>
