.jv-interlude svg circle:nth-child(4) { animation-delay: 2.1s; }
@keyframes jvBr { 0%, 100% { transform: scale(.85); opacity: .12; } 50% { transform: scale(1.1); opacity: .7; } }
.jv-interlude .nt { position: relative; z-index: 2; font-size: 34px; color: var(--jv-acc); }

/* PV 引擎 · ⑨ 版式扩充样式（22 件，与 pv/src/22-layouts2.js 一一对应）
 *
 * 规矩：这些类都打在**行元素**上（.jv-line.jv-l3 …），而行已经是
 * position:absolute; inset:0 —— 所以这里绝不写 position，要绝对定位的是子层 .jv-w。
 * 上一轮 .jv-scatter / .jv-cad 就是改写了行的 position，三条线排队排到舞台外，
 * 体检只量当前行所以完全没发现。这条别再犯。
 */

/* 1 下三分 */
.jv-l3 { align-items: flex-end; justify-content: flex-start; }
.jv-l3 .l3box {
  width: 66%; min-width: 0; border-left: 4px solid var(--jv-acc);
  padding: 10px 0 10px 18px; font-size: 30px; font-weight: 800; line-height: 1.25;
}

/* 2 阶梯 / 3 之字 / 4 弧顶 / 5 螺旋 / 12 对分 / 18 纵深堆：token 绝对定位 */
.jv-stair .jv-w, .jv-zigzag .jv-w, .jv-arc .jv-w, .jv-spiral .jv-w,
.jv-splitscr .jv-w, .jv-depth .jv-w { position: absolute; }
.jv-stair .jv-w { font-size: 30px; font-weight: 800; }
.jv-zigzag .jv-w { font-size: 32px; font-weight: 900; }
.jv-arc .jv-w { font-size: 30px; font-weight: 800; }
.jv-spiral .jv-w { font-weight: 800; }
.jv-splitscr .jv-w { line-height: 1.3; }
.jv-depth .jv-w { font-weight: 900; }

/* 6 宫格 */
.jv-cells { display: block; }
.jv-cells .cellgrid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 0;
  width: 84%; margin: 0 auto; align-content: center; height: 100%;
}
.jv-cells .jv-w {
  display: flex; align-items: center; justify-content: center;
  font-size: 27px; font-weight: 800; border: 1px solid color-mix(in srgb, var(--jv-fg) 26%, transparent);
  min-height: 62px;
}

/* 7 头字下沉 */
.jv-dropcap { display: block; text-align: justify; align-content: center; padding: 40px 48px; }
.jv-dropcap .dc-first {
  float: left; font-size: 96px; font-weight: 900; line-height: .82;
  margin: 4px 14px 0 0; color: var(--jv-acc);
}
.jv-dropcap .dc-rest { font-size: 26px; font-weight: 600; line-height: 1.55; }

/* 8 两端对齐 */
.jv-justified { display: block; padding: 44px 46px; align-content: center; }
.jv-justified .justrow { display: flex; justify-content: space-between; width: 100%; flex-wrap: wrap; gap: 2px 0; }
.jv-justified .jv-w { font-size: 28px; font-weight: 700; flex: 1 0 auto; text-align: center; }
.jv-justified .jv-w:first-child { font-size: 38px; font-weight: 900; }

/* 9 框中框 */
.jv-framebox { display: block; }
.jv-framebox .fb2 {
  height: 100%; display: flex; align-items: center; justify-content: center;
  border: 2px solid var(--jv-acc); padding: 14px;
}
.jv-framebox .fb1 {
  border: 1px solid color-mix(in srgb, var(--jv-fg) 55%, transparent);
  padding: 22px 30px; font-size: 28px; font-weight: 800; text-align: center; line-height: 1.3;
}

/* 10 气泡 */
.jv-bubble { align-items: flex-start; padding-top: 14%; }
.jv-bubble .bub {
  position: relative; max-width: 74%; padding: 18px 26px;
  background: color-mix(in srgb, var(--jv-acc) 14%, transparent);
  border: 2px solid var(--jv-acc); border-radius: 26px 26px 26px 6px;
  font-size: 27px; font-weight: 700; line-height: 1.35;
}
.jv-bubble .bubtail {
  position: absolute; left: 22px; bottom: -14px; width: 0; height: 0;
  border: 7px solid transparent; border-top-color: var(--jv-acc); border-bottom: 0;
}

/* 11 跑马 */
.jv-ticker { justify-content: flex-start; }
.jv-ticker .tick { width: 100%; overflow: hidden; border-block: 1px solid color-mix(in srgb, var(--jv-fg) 30%, transparent); padding: 10px 0; }
.jv-ticker .tickrun { display: inline-flex; gap: 40px; white-space: nowrap; animation: jvTick 16s linear infinite; font-size: 30px; font-weight: 800; }
.jv-ticker .jv-w { margin-right: 26px; }
@keyframes jvTick { from { transform: translateX(0); } to { transform: translateX(-50%); } }

/* 13 镜像 */
.jv-mirror { align-items: flex-start; padding-top: 20%; }
.jv-mirror .mir {
  font-size: 34px; font-weight: 900; text-align: center;
  -webkit-box-reflect: below 4px linear-gradient(transparent 46%, rgba(0, 0, 0, .32));
  box-reflect: below 4px linear-gradient(transparent 46%, rgba(0, 0, 0, .32));
}

/* 14 横倒 */
.jv-sideways { display: block; }
.jv-sideways .side90 {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(90deg);
  transform-origin: center; white-space: nowrap; font-size: 32px; font-weight: 800;
}

/* 15 点阵 */
.jv-dotmatrix { display: block; }
.jv-dotmatrix .dm {
  height: 100%; display: flex; flex-wrap: wrap; align-content: center; justify-content: center;
  gap: 6px 14px; font-family: 'Consolas', 'Cascadia Mono', monospace; font-size: 30px; font-weight: 700;
}
.jv-dotmatrix .jv-w { border-bottom: 3px dotted color-mix(in srgb, var(--jv-acc) 70%, transparent); }

/* 16 双栏 */
.jv-columns { display: block; }
.jv-columns .cols2 {
  height: 100%; column-count: 2; column-gap: 34px; column-rule: 1px solid color-mix(in srgb, var(--jv-fg) 22%, transparent);
  align-content: center; font-size: 25px; font-weight: 600; line-height: 1.6; padding: 36px 8px;
}

/* 17 拼贴 */
.jv-ransom { display: block; }
.jv-ransom { align-content: center; justify-content: center; flex-wrap: wrap; padding: 34px; }
.jv-ransom .jv-w { display: inline-block; padding: 3px 9px; margin: 4px 3px; font-weight: 900; font-size: 27px; }
.jv-ransom .rn0 { background: var(--jv-acc); color: var(--jv-bg); font-family: Georgia, serif; }
.jv-ransom .rn1 { background: var(--jv-fg); color: var(--jv-bg); font-family: 'Consolas', monospace; }
.jv-ransom .rn2 { border: 2px solid var(--jv-fg); font-family: Impact, 'Microsoft YaHei', sans-serif; }
.jv-ransom .rn3 { background: color-mix(in srgb, var(--jv-acc) 30%, transparent); font-style: italic; }

/* 20 场记板 */
.jv-clapper { display: block; justify-content: center; }
.jv-clapper .clap { height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px; }
.jv-clapper .clapbar {
  width: 74%; height: 30px;
  background: repeating-linear-gradient(115deg, var(--jv-fg) 0 26px, var(--jv-bg) 26px 52px);
  transform: rotate(-3deg);
}
.jv-clapper .claptxt { font-size: 34px; font-weight: 900; letter-spacing: .04em; text-align: center; }
.jv-clapper .clapmeta { font-family: 'Consolas', monospace; font-size: 12px; letter-spacing: .28em; opacity: .6; }

/* 21 胶片 */
.jv-filmstrip { display: block; }
.jv-filmstrip .fs { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
.jv-filmstrip .fstxt { text-align: center; font-size: 28px; font-weight: 700; line-height: 1.4; }
.jv-filmstrip .fsperf {
  height: 20px; background:
    repeating-linear-gradient(90deg, transparent 0 16px, color-mix(in srgb, var(--jv-fg) 45%, transparent) 16px 30px);
  background-size: auto 8px; background-repeat: repeat-x; background-position: center;
}

/* 22 警示 */
.jv-hazard { display: block; }
.jv-hazard .hz { height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 14px; }
.jv-hazard .hzstrip { width: 70%; height: 16px; background: repeating-linear-gradient(45deg, var(--jv-acc) 0 14px, var(--jv-bg) 14px 28px); }
.jv-hazard .hzstrip.b { transform: scaleX(-1); }
.jv-hazard .hztxt {
  font-size: 30px; font-weight: 900; letter-spacing: .1em; text-align: center;
  border: 3px solid var(--jv-fg); padding: 14px 26px;
}

/* PV 引擎 · 舞台附件样式 */

.jv-tag {
  position: absolute; top: 10px; left: 12px; z-index: 30;
  font-family: monospace; font-size: 9px; letter-spacing: .12em;
  color: var(--jv-fg); opacity: .55;
  /* 默认整个件都不显示（PV.tagOn=false，按 T 唤出）。显示时也不抢交互：
   * 上一版给了它 pointer-events:auto 当按钮，既然改成按键开关，就不该再有个隐形热区 */
  pointer-events: none;
  transition: opacity .5s ease;
}
/* 开着时闲一会儿就再淡一点：别抢看词 */
.jv-tag.dim { opacity: .22; }

.jv-dice {
  position: absolute; top: 10px; right: 12px; z-index: 30;
  width: 32px; height: 32px; border-radius: 50%;
  border: 1px solid var(--jv-acc, #D4AF37);
  background: rgba(0, 0, 0, .35); color: var(--jv-acc, #D4AF37);
  font-size: 15px; cursor: pointer; display: grid; place-items: center;
  transition: transform .4s cubic-bezier(.34, 1.56, .64, 1);
  backdrop-filter: blur(4px);
}
.jv-dice:hover { transform: rotate(120deg) scale(1.1); }
.jv-dice:active { transform: rotate(360deg) scale(.92); }

.jv-ghost {
  position: absolute; left: 50%; transform: translateX(-50%); z-index: 2;
  font-size: 13px; letter-spacing: .05em; color: var(--jv-fg); opacity: .5;
  pointer-events: none; white-space: nowrap; max-width: 80%; overflow: hidden; text-overflow: ellipsis;
}
.jv-ghost.up { top: 12%; }
.jv-ghost.dn { bottom: 12%; }

.jv-bar {
  position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 30;
  display: flex; gap: 6px; padding: 6px 10px;
  background: rgba(0, 0, 0, .35); border-radius: 16px; backdrop-filter: blur(4px);
}
.jv-dot {
  width: 14px; height: 14px; border-radius: 50%; cursor: pointer; padding: 0;
  border: 1.5px solid var(--d-acc);
  background: linear-gradient(135deg, var(--d-bg) 45%, var(--d-acc));
  transition: transform .15s;
}
.jv-dot:hover { transform: scale(1.3); }
.jv-dot.on { box-shadow: 0 0 0 2px var(--jv-bg), 0 0 0 3.5px var(--d-acc); }

/* 粒子层（decor/particles） */
.jv-particles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
.jv-particles i {
  position: absolute; border-radius: 50%; background: var(--jv-acc); opacity: 0;
  animation: jvFloat linear infinite;
}
.jv-particles i.sq { border-radius: 1px; background: none; border: 1px solid var(--jv-acc); }
@keyframes jvFloat {
  0% { transform: translateY(30px) rotate(0deg); opacity: 0; }
  15% { opacity: .28; }
  80% { opacity: .22; }
  100% { transform: translateY(-70px) rotate(160deg); opacity: 0; }
}

/* PV 引擎 · ② 新增部件用的样式
 * 切片退场、白闪、HUD、引线、纹理层。全部 pointer-events:none，不吃交互。
 */

/* --- exit: slice 切片错位 --- */
.jv-slice {
  position: absolute; left: 0; right: 0;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; pointer-events: none;
  writing-mode: horizontal-tb;     /* 别继承竖写版式的书写方向 */
}

/* --- transition: flash 白闪 --- */
.jv-flash {
  position: absolute; inset: 0; z-index: 40; pointer-events: none;
  background: var(--jv-fg); opacity: .85; mix-blend-mode: screen;
}
.jv-flash.hard { background: var(--jv-acc); mix-blend-mode: lighten; }

/* --- decor: hud 边角 --- */
.jv-hud {
  position: absolute; right: 5%; bottom: 8%; z-index: 3;
  display: flex; flex-direction: column; gap: 3px; align-items: flex-end;
  font-family: monospace; font-size: 9px; letter-spacing: .18em;
  color: var(--jv-fg); opacity: .42; pointer-events: none;
  writing-mode: horizontal-tb;     /* 竖写版式里不加这条，HUD 会跟着竖排 */
}
.jv-hud .no { color: var(--jv-acc); opacity: .9; }

/* --- decor: rule 左右引线 --- */
.jv-rules { position: absolute; inset: 0; pointer-events: none; }
.jv-rules i {
  position: absolute; top: 50%; width: 8%; height: 1px; background: var(--jv-acc); opacity: .55;
}
.jv-rules i:first-child { left: 4%; }
.jv-rules i:last-child { right: 4%; }

/* --- treatment: chroma 色偏残影 --- */
.jv-ghostA, .jv-ghostB { pointer-events: none; z-index: 1; }

/* --- treatment: grain 纹理（扫描线 + 纸纹 + 边角暗角） --- */
.jv-texture {
  position: absolute; inset: 0; z-index: 5; pointer-events: none; opacity: .2;
  background-image:
    repeating-linear-gradient(0deg, rgba(255, 255, 255, .06) 0 1px, transparent 1px 3px),
    radial-gradient(120% 90% at 50% 50%, transparent 52%, rgba(0, 0, 0, .5) 100%);
  mix-blend-mode: overlay;
}

/* 层内元素给镜头留出变形空间：不要让行自己占满再叠 transform */
.jv-line { transform-origin: 50% 50%; }
.jv-w { transform-origin: 50% 50%; }
.jv-t { transform-origin: 50% 50%; }

/* PV 引擎 · ⑤ 装饰与处理扩容用的样式
 * 规矩：.jv-d（段内装饰，随 .jv-line 生灭）、.jv-t（整屏处理，挂在 #pvJv）。
 * 全部 horizontal-tb + pointer-events:none —— 竖写版式会把子层的文字方向一起带走（①踩过）。
 */

.jv-d, .jv-fx { pointer-events: none; writing-mode: horizontal-tb; }
.jv-d { position: absolute; inset: 0; z-index: 1; }
.jv-d > * { position: absolute; }
/* 整屏处理层叫 .jv-fx 不叫 .jv-t——.jv-t 从 ② 开始就是逐字 token 的类名，
 * 重名会把每个字拉成绝对定位铺满舞台（体检拓出来的，⑤ 自己埋的雷）。 */
.jv-fx { position: absolute; inset: 0; z-index: 6; }

/* ---------- decor ---------- */
.jv-frame .e { inset: 4.5% 5%; border: 1px solid var(--jv-fg); opacity: .35; }
.jv-frame .e2 { inset: 6.6% 7.2%; border: 1px solid var(--jv-acc); opacity: .5; }
.jv-frame .c { width: 13px; height: 13px; border: 2px solid var(--jv-acc); opacity: .8; }
.jv-frame .c.tl { left: 3.4%; top: 3.4%; border-right: 0; border-bottom: 0; }
.jv-frame .c.tr { right: 3.4%; top: 3.4%; border-left: 0; border-bottom: 0; }
.jv-frame .c.bl { left: 3.4%; bottom: 3.4%; border-right: 0; border-top: 0; }
.jv-frame .c.br { right: 3.4%; bottom: 3.4%; border-left: 0; border-top: 0; }

.jv-ticks { position: absolute; inset: auto 0 auto 0; top: 5.5%; height: 16px; display: flex; gap: 3px; justify-content: center; align-items: flex-start; }
.jv-ticks > i { position: static; width: 1px; background: var(--jv-fg); }

.jv-target svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.jv-target circle { fill: none; stroke: var(--jv-acc); stroke-width: .7; opacity: .3; }
.jv-target line { stroke: var(--jv-acc); stroke-width: 1; opacity: .5; }
.jv-target .co { fill: var(--jv-fg); font-family: monospace; font-size: 9px; opacity: .4; letter-spacing: .1em; }

/* 条码：从「整块硬边竖条墙」收成一个边缘渐隐的小饰条。高度不再吃满 46%，
 * 条高由 JS 逐根随机；mask 把上下左右抹掉，不然矩形边界本身就是那根「竖线」。 */
.jv-barcode { inset: auto; top: 50%; transform: translateY(-50%); display: flex; gap: 2px; align-items: flex-end; height: 24%;
  -webkit-mask-image: radial-gradient(120% 130% at 50% 50%, #000 46%, transparent 86%);
  mask-image: radial-gradient(120% 130% at 50% 50%, #000 46%, transparent 86%); }
.jv-barcode.l { left: 3.5%; }
.jv-barcode.r { right: 3.5%; }
.jv-barcode > i { position: static; background: var(--jv-fg); }

.jv-arrows { display: flex; gap: 12px; align-items: center; color: var(--jv-acc); font-size: 15px; inset: auto; }
.jv-arrows.top { top: 12%; left: 50%; transform: translateX(-50%); }
.jv-arrows.bot { bottom: 12%; left: 50%; transform: translateX(-50%); }
.jv-arrows > span { position: static; animation: jvArrow 1.5s ease-in-out infinite; }
@keyframes jvArrow { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(5px); } }

.jv-spark > i { background: var(--jv-acc); clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); animation: jvSpark 2.6s ease-in-out infinite; }
@keyframes jvSpark { 0%, 100% { opacity: 0; transform: scale(.4) rotate(0deg); } 45% { opacity: .85; transform: scale(1) rotate(45deg); } }

.jv-grid { position: absolute; inset: 0; pointer-events: none; z-index: 0; opacity: .18;
  background-image: linear-gradient(to right, color-mix(in srgb, var(--jv-fg) 22%, transparent) 1px, transparent 1px),
    linear-gradient(to bottom, color-mix(in srgb, var(--jv-fg) 22%, transparent) 1px, transparent 1px);
  background-size: 46px 46px; }

.jv-stripes > i { inset: 0; opacity: .1;
  background: repeating-linear-gradient(115deg, var(--jv-acc) 0 2px, transparent 2px 16px); }

.jv-bignum { display: flex; align-items: center; justify-content: center; font-size: min(30vh, 26vw); font-weight: 900; color: var(--jv-fg); opacity: .07; line-height: .8; letter-spacing: -.04em; overflow: hidden; }

.jv-ink > i { background: var(--jv-fg); border-radius: 50% 46% 52% 48% / 52% 48% 54% 46%; filter: blur(.4px); }

.jv-note { inset: auto; left: 50%; bottom: 12%; transform: translateX(-50%); font-size: 12px; letter-spacing: .22em; color: var(--jv-fg); opacity: .55; font-family: monospace; max-width: 74%; text-align: center; }

.jv-prog { inset: auto 0 6% 0; height: 2px; }
.jv-prog > i { position: static; display: block; width: 100%; height: 100%; background: var(--jv-acc); transform-origin: 0 50%; transform: scaleX(0); }

.jv-wave-band { display: flex; align-items: flex-end; gap: 3px; height: 16%; justify-content: center; inset: auto; }
.jv-wave-band.bot { left: 0; right: 0; bottom: 5%; }
.jv-wave-band.top { left: 0; right: 0; top: 5%; align-items: flex-start; }
.jv-wave-band > i { position: static; width: 3px; height: 100%; background: var(--jv-acc); transform-origin: 50% 100%; transform: scaleY(.1); }
.jv-wave-band.top > i { transform-origin: 50% 0; }

.jv-corner .pg { bottom: 7%; right: 6%; font-family: monospace; font-size: 10px; letter-spacing: .2em; color: var(--jv-fg); opacity: .45; }
.jv-corner .vt { top: 8%; right: 5.5%; writing-mode: vertical-rl; font-size: 11px; letter-spacing: .3em; color: var(--jv-acc); opacity: .5; max-height: 46%; overflow: hidden; }

/* ---------- treatment ---------- */
.jv-scan { background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .07) 0 1px, transparent 1px 4px); animation: jvScan 7s linear infinite; mix-blend-mode: overlay; }
@keyframes jvScan { 0% { background-position: 0 0; } 100% { background-position: 0 40px; } }

.jv-vig { background: radial-gradient(115% 88% at 50% 46%, transparent 46%, rgba(0, 0, 0, .62) 100%); transition: opacity .2s linear; }

.jv-punch { background: color-mix(in srgb, var(--jv-fg) 55%, transparent); mix-blend-mode: screen; opacity: 0; transition: opacity .09s linear; }

.jv-edge { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--jv-acc) 60%, transparent), inset 0 0 70px color-mix(in srgb, var(--jv-acc) 45%, transparent); }

.jv-gbars > i { left: 0; right: 0; background: var(--jv-acc); mix-blend-mode: screen; opacity: 0; }

.jv-duo { background: linear-gradient(150deg, color-mix(in srgb, var(--jv-acc) 70%, #0ff), color-mix(in srgb, var(--jv-acc) 55%, #f08)); mix-blend-mode: color; }

.jv-dust { opacity: .2; }
.jv-dust > i { background: var(--jv-fg); border-radius: 50%; animation: jvDust linear infinite; }
@keyframes jvDust { 0% { transform: translateY(6px); opacity: 0; } 20% { opacity: .5; } 80% { opacity: .35; } 100% { transform: translateY(-26px); opacity: 0; } }

/* ---------- transition ---------- */
.jv-trail { opacity: .5; pointer-events: none; mix-blend-mode: screen; }
.jv-slice-in { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 36px; pointer-events: none; }

/* PV 引擎 · ⑬ 装饰扩充样式（21 件，与 pv/src/25-decor2.js 一一对应）
 * 全部 .jv-d 已在 decor.css 里钉了 writing-mode:horizontal-tb 与 z-index，
 * 这里只画形状。颜色一律从 --jv-fg / --jv-acc 混出来，跟风格条走，不写死色值。
 */

/* 根因：.jv-d 基类是 inset:0（四边钉住）。只写 left/bottom 的话，
 * 另两边还是 0 → 元素被拉满整块舞台（实测“正字计数”975×102、“时间码”横贯全宽）。
 * ⑤ 就是靠 `inset:auto` 治过这个，这批新件又漏了——一次性在开头写清。*/
/* 角落件的正确摆法（⑬ 修过一次又错了一次）：
 *  `.jv-d` 基类是 inset:0（四边钉死）。只写 left/bottom 时另两边仍是 0 → 被拉成满幅；
 *  但改成 `inset:auto` 也不对：在 flex 容器（.jv-line 是 flex）里，
 *  只给单边的绝对定位元素会退回**静态位置**，而静态位置按 flex 对齐算 = 居中
 *  ——实测落款离右边 466px、下边 254px，印就压在正文上。
 *  所以：容器始绠保持 inset:0 当满幅框架，可见的东西给子元素，由框架的 flex 推到角。*/
.jv-d.jv-seal, .jv-d.jv-timecode, .jv-d.jv-datestamp, .jv-d.jv-tally,
.jv-d.jv-swatches, .jv-d.jv-dimline {
  inset: 0;
  display: flex;
}
.jv-d.jv-seal      { justify-content: flex-end; align-items: flex-end; padding: 0 3.5% 5% 0; }
.jv-d.jv-timecode  { justify-content: flex-end; align-items: flex-start; padding: 12px 14px 0 0; }
.jv-d.jv-datestamp { justify-content: flex-end; align-items: flex-end; padding: 0 16px 14px 0; }
.jv-d.jv-tally     { justify-content: flex-start; align-items: flex-end; padding: 0 0 16px 16px; }
.jv-d.jv-swatches  { justify-content: flex-end; align-items: flex-end; padding: 0 14px 14px 0; }
.jv-d.jv-dimline   { justify-content: flex-start; align-items: flex-start; padding: 12% 0 0 10%; }

/* 以上六件的样式都在 > i 上，容器只负责定位 */
.jv-seal > i {
  width: 38px; height: 38px; display: grid; place-items: center;
  border: 2px solid color-mix(in srgb, var(--jv-acc) 55%, #c0392b);
  border-radius: 6px; font-style: normal;
  color: color-mix(in srgb, var(--jv-acc) 55%, #c0392b);
  font-size: 20px; font-weight: 800;
  background: color-mix(in srgb, var(--jv-acc) 9%, transparent);
  transform: rotate(-6deg); opacity: .6;
}

.jv-d.jv-crop, .jv-d.jv-regmark, .jv-d.jv-swatches, .jv-d.jv-tally,
.jv-d.jv-dimline, .jv-d.jv-ruler, .jv-d.jv-guides, .jv-d.jv-timecode,
.jv-d.jv-datestamp, .jv-d.jv-tape, .jv-d.jv-circline, .jv-d.jv-scribble,
.jv-d.jv-brackets, .jv-d.jv-seal, .jv-d.jv-leak, .jv-d.jv-burstlines,
.jv-d.jv-sqrings, .jv-d.jv-plusgrid, .jv-d.jv-checker, .jv-d.jv-hanzi,
.jv-d.jv-notes, .jv-d.jv-ruled { position: absolute; pointer-events: none; }

/* ---- 纸面与印张 ---- */
.jv-crop { inset: 0; }
.jv-crop > i { position: absolute; width: 26px; height: 26px; border: 1px solid color-mix(in srgb, var(--jv-fg) 55%, transparent); }
.jv-crop > i:nth-child(1) { left: 12px; top: 12px; border-right: 0; border-bottom: 0; }
.jv-crop > i:nth-child(2) { right: 12px; top: 12px; border-left: 0; border-bottom: 0; }
.jv-crop > i:nth-child(3) { left: 12px; bottom: 12px; border-right: 0; border-top: 0; }
.jv-crop > i:nth-child(4) { right: 12px; bottom: 12px; border-left: 0; border-top: 0; }

.jv-regmark { left: 16px; bottom: 16px; width: 46px; height: 46px; opacity: .5; }
.jv-regmark > i { position: absolute; left: 50%; top: 50%; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; border: 1px solid var(--jv-fg); }
.jv-regmark > i.b { width: 12px; height: 12px; margin: -6px 0 0 -6px; border-color: var(--jv-acc); }
.jv-regmark::after { content: ''; position: absolute; inset: 0; background: linear-gradient(var(--jv-fg), var(--jv-fg)) 50% 0/1px 100% no-repeat, linear-gradient(var(--jv-fg), var(--jv-fg)) 0 50%/100% 1px no-repeat; }

.jv-ruled { left: 5%; right: 5%; top: 18%; bottom: 18%; opacity: .16;
  background: repeating-linear-gradient(to bottom, transparent 0 33px, color-mix(in srgb, var(--jv-fg) 60%, transparent) 33px 34px); }

.jv-swatches { right: 14px; bottom: 14px; display: flex; gap: 3px; opacity: .8; }
.jv-swatches > i { width: 15px; height: 8px; background: var(--jv-fg); }
.jv-swatches > i:nth-child(odd) { background: var(--jv-acc); }

.jv-tally { left: 16px; bottom: 16px; display: flex; gap: 5px; align-items: flex-end; height: 30px; opacity: .55; }
.jv-tally > i { width: 3px; height: 100%; background: var(--jv-fg); }
.jv-tally > i:nth-child(5) { position: absolute; left: -2px; top: 50%; width: 30px; height: 3px; transform: rotate(-24deg); }

/* ---- 标注与测量 ---- */
.jv-dimline { left: 10%; top: 12%; height: 16px; display: flex; align-items: center; opacity: .55; }
.jv-dimline > .bar { position: static; height: 1px; background: var(--jv-fg); }
.jv-dimline > .cap { position: static; width: 1px; height: 12px; background: var(--jv-fg); }
.jv-dimline > span { position: static; font-family: monospace; font-size: 9px; letter-spacing: .1em; margin-left: 6px; color: var(--jv-acc); }

.jv-ruler { left: 0; right: 0; top: 10px; height: 16px; display: flex; gap: 5px; align-items: flex-end; opacity: .38; }
.jv-ruler > i { flex: 1; background: color-mix(in srgb, var(--jv-fg) 70%, transparent); max-width: 2px; }

.jv-guides { inset: 0; opacity: .3; }
.jv-guides > .v { position: absolute; top: 0; bottom: 0; width: 1px; background: color-mix(in srgb, var(--jv-acc) 60%, transparent); }
.jv-guides > .v.a { left: 33.33%; } .jv-guides > .v.b { left: 66.66%; }
.jv-guides > .h { position: absolute; left: 0; right: 0; height: 1px; background: color-mix(in srgb, var(--jv-acc) 60%, transparent); }
.jv-guides > .h.a { top: 33.33%; } .jv-guides > .h.b { top: 66.66%; }

.jv-timecode {
  font-family: monospace; font-size: 10px; letter-spacing: .18em;
  color: var(--jv-acc); border: 1px solid color-mix(in srgb, var(--jv-acc) 45%, transparent);
  padding: 2px 7px; font-style: normal;
}

.jv-datestamp { font-family: 'Consolas', monospace; font-size: 13px; letter-spacing: .14em;
  color: color-mix(in srgb, var(--jv-acc) 80%, #f60); opacity: .85; text-shadow: 0 0 6px currentColor; font-style: normal; }

/* ---- 手绘与贴纸 ---- */
/* 胶带：容器推到角，内层负责斜放（和落款同一套框架模型）*/
.jv-d.jv-tape { inset: 0; display: flex; }
.jv-tape.tl { justify-content: flex-start; align-items: flex-start; padding: 16% 0 0 10%; }
.jv-tape.br { justify-content: flex-end; align-items: flex-end; padding: 0 10% 18% 0; }
.jv-tape > div { position: relative; width: 92px; height: 26px; opacity: .8; }
.jv-tape > div > i { position: absolute; inset: 0; background: color-mix(in srgb, var(--jv-acc) 34%, transparent);
  border-inline: 2px dashed color-mix(in srgb, var(--jv-acc) 60%, transparent); }
.jv-tape > div > i:nth-child(2) { transform: translateY(3px) rotate(2deg); opacity: .5; }

/* 六件的可见部分一律在子节点上，容器只管把东西推到角 */
.jv-tally > div { display: flex; gap: 5px; align-items: flex-end; height: 30px; }
.jv-tally > div > i { width: 3px; height: 100%; background: var(--jv-fg); }
.jv-swatches > div { display: flex; gap: 3px; }
.jv-swatches > div > i { width: 15px; height: 8px; background: var(--jv-fg); }
.jv-swatches > div > i:nth-child(odd) { background: var(--jv-acc); }
.jv-dimline > div { display: flex; align-items: center; width: 34%; opacity: .55; }
.jv-dimline .bar { height: 1px; background: var(--jv-fg); }
.jv-dimline .cap { width: 1px; height: 12px; background: var(--jv-fg); }
.jv-dimline b { font-family: monospace; font-size: 9px; letter-spacing: .1em; margin-left: 6px;
  color: var(--jv-acc); font-weight: 400; }

.jv-circline { left: 50%; top: 50%; width: 62%; height: 46%; transform: translate(-50%, -50%);
  border: 2px solid color-mix(in srgb, var(--jv-acc) 70%, transparent);
  border-radius: 48% 52% 45% 55% / 56% 44% 58% 42%; opacity: .55; }

.jv-scribble { left: 12%; right: 12%; height: 12px; opacity: .7; }
.jv-scribble.under { bottom: 20%; } .jv-scribble.through { top: 50%; }
.jv-scribble svg { width: 100%; height: 12px; }
.jv-scribble path { fill: none; stroke: var(--jv-acc); stroke-width: 2.4; stroke-linecap: round; }

.jv-brackets { inset: 0; }
.jv-brackets > i { position: absolute; font-style: normal; font-size: 46px; font-weight: 700;
  color: color-mix(in srgb, var(--jv-fg) 65%, transparent); }
.jv-brackets > i:first-child { left: 6%; top: 22%; }
.jv-brackets > i:last-child { right: 6%; bottom: 22%; }

/* 落款：印色不写死（本文件开头就定了“全用 fg/acc 混”），
 * 从 acc 往暖红方向推一点——保留印章感又不和风格打架。
 * 位置收到真正的角落、z-index 低于 token，不再压在正文上。*/
.jv-seal {
  right: 3.5%; bottom: 6%; width: 38px; height: 38px; z-index: 0;
  display: grid; place-items: center;
  border: 2px solid color-mix(in srgb, var(--jv-acc) 60%, #c0392b);
  border-radius: 6px;
  color: color-mix(in srgb, var(--jv-acc) 60%, #c0392b);
  font-size: 20px; font-weight: 800;
  background: color-mix(in srgb, var(--jv-acc) 10%, transparent);
  transform: rotate(-6deg); opacity: .62;
}

/* ---- 光与几何 ---- */
.jv-leak { inset: 0; mix-blend-mode: screen; opacity: .5; }
.jv-leak.l { background: radial-gradient(60% 90% at 0% 30%, color-mix(in srgb, var(--jv-acc) 55%, #ff9), transparent 62%); }
.jv-leak.r { background: radial-gradient(60% 90% at 100% 70%, color-mix(in srgb, var(--jv-acc) 55%, #f9a), transparent 62%); }

/* 放射线：容器不能是 0x0 的“原点”——子条写百分比宽度时，
 * 百分比对零尺寸父级求值就是 0，整件东西根本画不出来（实测 33 根全 0x2）。
 * 给它一个真尺寸，旋转原点仍然放在锁定的那个角上。*/
.jv-burstlines { width: 44%; height: 52%; }
.jv-burstlines.tl { left: 0; top: 0; }
.jv-burstlines.br { right: 0; bottom: 0; }
.jv-burstlines > i { position: absolute; left: 50%; top: 50%; width: 50%; height: 2px; transform-origin: 0 50%;
  background: linear-gradient(90deg, color-mix(in srgb, var(--jv-fg) 55%, transparent), transparent); }

/* 同心方：同理，容器得给真尺寸（原来 1px×1px，子块的 18% 就是 0.18px）*/
.jv-sqrings { left: 50%; top: 50%; width: 56%; height: 62%; transform: translate(-50%, -50%); }
.jv-sqrings > i { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  border: 1px solid color-mix(in srgb, var(--jv-acc) 40%, transparent); }

/* 加号阵：两条细线在一个单元格内交叉，平铺出来就是一排排 +。
 * （写成两条规则会前一条死掉——之就刚写过一份被自己盖掉的废规则）*/
.jv-plusgrid { inset: 0; opacity: .3;
  --pl: color-mix(in srgb, var(--jv-fg) 55%, transparent);
  background-image:
    linear-gradient(to right, transparent calc(50% - .5px), var(--pl) calc(50% - .5px) calc(50% + .5px), transparent calc(50% + .5px)),
    linear-gradient(to bottom, transparent calc(50% - .5px), var(--pl) calc(50% - .5px) calc(50% + .5px), transparent calc(50% + .5px));
  background-size: 34px 34px; }

.jv-checker { left: 0; right: 0; height: 22px; opacity: .35;
  background: repeating-conic-gradient(color-mix(in srgb, var(--jv-fg) 55%, transparent) 0 25%, transparent 0 50%) 0 0/22px 22px; }
.jv-checker.top { top: 0; } .jv-checker.bot { bottom: 0; }

.jv-hanzi { inset: 0; display: grid; place-items: center; font-size: min(46vh, 40vw); font-weight: 900;
  color: var(--jv-fg); opacity: .06; line-height: 1; letter-spacing: -.04em; }

.jv-notes { inset: 0; }
.jv-notes > i { position: absolute; font-style: normal; color: color-mix(in srgb, var(--jv-acc) 80%, var(--jv-fg));
  animation: jvNoteFloat 3.4s ease-in-out infinite; }
@keyframes jvNoteFloat {
  0%, 100% { transform: translateY(0) rotate(-6deg); opacity: .35; }
  50% { transform: translateY(-14px) rotate(8deg); opacity: .9; }
}

/* PV 引擎 · ⑥ 字体层样式
 * 两个变量：--jv-face（本段的主字体栈）、--jv-mono（等宽，打字版式与小字用）。
 * 版式自带的 letter-spacing 比这里更具体，会盖过字体自带的字距——这是故意的：
 * 竖写要 .35em、纵压要 .14em，那些是版式的形状，不该被字体拽回去。
 */

.jv-line { font-family: var(--jv-face, inherit); }
.jv-line .cur, .jv-line .bandrow, .jv-line .capbar, .jv-line .pl, .jv-line .sk,
.jv-line .cd, .jv-line .dt, .jv-line .ct, .jv-line .tagbox, .jv-line .tt,
.jv-line .big, .jv-line .sm, .jv-line .prev, .jv-line .next {
  font-weight: var(--jv-face-weight, inherit);
}

/* 打字版式永远等宽，不参与字体抽签 */
.jv-type, .jv-type .jv-w, .jv-type .jv-t { font-family: var(--jv-mono, monospace); }

/* 注釈 / HUD / 刻度 / 页角 / 底纹数字这类小字要可读，也别用行楷 */
.jv-note, .jv-hud, .jv-ticks, .jv-corner .pg, .jv-bignum {
  font-family: var(--jv-mono, monospace);
  font-weight: 400;
}

/* PV 引擎 · ⑧ 背景层样式
 * .jv-bg-layer 只建一个，换件时靠 JS 抹旧属性——所以这里的动画名必须和 19-bg.js 里
 * 写的 animation 名一一对上，改了那边记得改这边。
 */

.jv-bg-layer {
  position: absolute; inset: 0; z-index: 0;
  pointer-events: none;
  background-repeat: repeat;
  transition: opacity .5s ease;
}

@keyframes jvBgBeam {
  0% { background-position: -60% 0; }
  100% { background-position: 160% 0; }
}
@keyframes jvBgZoom {
  0% { transform: scale(1); }
  100% { transform: scale(1.22); }
}
@keyframes jvBgScan {
  0% { background-position: 0 0; }
  100% { background-position: 0 40px; }
}
@keyframes jvBgDrift {
  0% { background-position: 0 0; }
  100% { background-position: 120px -180px; }
}
@keyframes jvBgHue {
  0%, 100% { filter: hue-rotate(0deg); }
  50% { filter: hue-rotate(28deg); }
}

/* 扫光与同心圈要能真的动起来：background-position / transform 都得可动画 */
.jv-bg-layer[data-bg="beam"] { background-size: 220% 100%; }

/* PV 引擎 · ⑮ 背景扩充用的动画
 * 只给背景层用（.jv-bg-layer）。⑧ 的五个动画在 css/bg.css，这里补齐 ⑮ 新引用的六个。
 * 注意：background-position / transform / filter 这三类才可在背景层上安全动画——
 * 它只有一个节点，换件时 JS 会把属性抹掉，所以 animation 名必须和 27-bg2.js 一一对上。
 */

/* 摩尔纹：两层同心环错开位移，交叠处自然生出条纹 */
@keyframes jvBgMoire {
  0% { background-position: 0 0, 0 0; }
  100% { background-position: 46px 30px, -38px 22px; }
}

/* 方洞：从中心往外呼吸式放大 */
@keyframes jvBgTunnel {
  0% { transform: scale(1); opacity: .5; }
  100% { transform: scale(1.5); opacity: .9; }
}

/* 旋臂 / 万花筒：慢转与色相漂移 */
@keyframes jvBgSpinSlow {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* 光芒：摆角，不是整圈转 */
@keyframes jvBgRay {
  0% { transform: rotate(-7deg) scale(1.05); }
  100% { transform: rotate(7deg) scale(1.12); }
}

/* 极光：横向漂移 + 轻微伸缩，配合 screen 混合出流动感 */
@keyframes jvBgAurora {
  0% { background-position: -20% 0; transform: translateX(-6%) skewY(-1.2deg); }
  100% { background-position: 120% 0; transform: translateX(6%) skewY(1.2deg); }
}

/* VHS 带：一条横向亮带自上而下走过 + 底纹抖动 */
@keyframes jvBgVhs {
  0% { background-position: 0 0, 0 -40%; }
  100% { background-position: 0 0, 0 140%; }
}

/* PV 引擎 · ⑩ 字形外观层样式
 * 只作用在 i.jv-t 上（登场层的那个内层），只写涂装属性。
 * 幅度一律走 .pv-jv 上的 --lk-* 变量，由 21-looks.js 每件自己掷；
 * 变量没给时下面的 fallback 就是这件的默认长相。
 */

/* ---------- 描边族 ---------- */
.pv-jv[data-look="outline"] .jv-t,
.pv-jv[data-look="outlineFill"] .jv-t,
.pv-jv[data-look="doubleOutline"] .jv-t,
.pv-jv[data-look="dotted"] .jv-t,
.pv-jv[data-look="echoOutline"] .jv-t,
.pv-jv[data-look="stencil"] .jv-t {
  -webkit-text-stroke: var(--lk-sw, .05em) var(--jv-acc);
  color: var(--lk-fill, transparent);
  paint-order: stroke fill;
}
.pv-jv[data-look="doubleOutline"] .jv-t {
  text-shadow: var(--lk-ring, 3px) var(--lk-ring, 3px) 0 color-mix(in srgb, var(--jv-acc) 45%, transparent);
}
/* 点线缘：整字按横向节距切片，读起来就是虚线描的 */
.pv-jv[data-look="dotted"] .jv-t {
  -webkit-mask-image: repeating-linear-gradient(90deg, #000 0 var(--lk-dash, 4px), transparent 0 calc(var(--lk-dash, 4px) * 2));
  mask-image: repeating-linear-gradient(90deg, #000 0 var(--lk-dash, 4px), transparent 0 calc(var(--lk-dash, 4px) * 2));
}
.pv-jv[data-look="echoOutline"] .jv-t {
  text-shadow:
    var(--lk-echo, 10px) var(--lk-echo, 10px) 0 color-mix(in srgb, var(--jv-acc) 22%, transparent),
    calc(var(--lk-echo, 10px) * -1) calc(var(--lk-echo, 10px) * -1) 0 color-mix(in srgb, var(--jv-acc) 14%, transparent);
}

/* ---------- 阴影族（方向由 --lk-dx/--lk-dy 给单位less 步长，CSS 乘 px） ---------- */
.pv-jv[data-look="extrude"] .jv-t {
  text-shadow:
    calc(var(--lk-dx, .7) * 1px) calc(var(--lk-dy, .7) * 1px) 0 var(--lk-sh),
    calc(var(--lk-dx, .7) * 2px) calc(var(--lk-dy, .7) * 2px) 0 var(--lk-sh),
    calc(var(--lk-dx, .7) * 3px) calc(var(--lk-dy, .7) * 3px) 0 var(--lk-sh),
    calc(var(--lk-dx, .7) * 4px) calc(var(--lk-dy, .7) * 4px) 0 var(--lk-sh),
    calc(var(--lk-dx, .7) * 5px) calc(var(--lk-dy, .7) * 5px) 0 var(--lk-sh),
    calc(var(--lk-dx, .7) * 6px) calc(var(--lk-dy, .7) * 6px) 0 var(--lk-sh2),
    calc(var(--lk-dx, .7) * 7px) calc(var(--lk-dy, .7) * 7px) 0 var(--lk-sh2),
    calc(var(--lk-dx, .7) * 8px) calc(var(--lk-dy, .7) * 8px) 3px rgba(0, 0, 0, .35);
}
.pv-jv[data-look="longShadow"] .jv-t {
  text-shadow:
    calc(var(--lk-dx, 1) * 1px) calc(var(--lk-dy, 1) * 1px) 0 var(--lk-sh3),
    calc(var(--lk-dx, 1) * 2px) calc(var(--lk-dy, 1) * 2px) 0 var(--lk-sh3),
    calc(var(--lk-dx, 1) * 3px) calc(var(--lk-dy, 1) * 3px) 0 var(--lk-sh3),
    calc(var(--lk-dx, 1) * 4px) calc(var(--lk-dy, 1) * 4px) 0 var(--lk-sh3),
    calc(var(--lk-dx, 1) * 5px) calc(var(--lk-dy, 1) * 5px) 0 var(--lk-sh3),
    calc(var(--lk-dx, 1) * 6px) calc(var(--lk-dy, 1) * 6px) 0 var(--lk-sh3),

/**
 * default-theme.js
 * 默认歌词视觉主题
 * 
 * 纯CSS实现，无Canvas/WebGL依赖，兼容所有设备
 */

const defaultTheme = {
  id: 'default-theme',
  name: '默认主题',
  description: '基础歌词显示，兼容所有设备',
  version: '1.0.0',
  author: '奥菲莉娅',
  
  // 性能要求
  requirements: {
    minTier: 'low',
    features: [],
  },
  
  // 渲染器
  renderer: {
    type: 'css',
    container: null,
    settings: null,
    
    /**
     * 初始化渲染器
     * @param {HTMLElement} container
     * @param {object} settings
     */
    init(container, settings) {
      this.container = container;
      this.settings = settings;
      
      // 创建歌词容器
      this.lyricsContainer = document.createElement('div');
      this.lyricsContainer.className = 'lyrics-container default-theme';
      this.lyricsContainer.style.cssText = `
        font-size: ${settings.fontSize || 16}px;
        line-height: ${settings.lineHeight || 1.8};
        color: ${settings.text || '#e0e0e0'};
        padding: ${settings.padding || 16}px;
        text-align: center;
        overflow-y: auto;
        max-height: 100%;
      `;
      
      this.container.appendChild(this.lyricsContainer);
    },
    
    /**
     * 渲染歌词
     * @param {object} state
     */
    render(state) {
      if (!this.lyricsContainer) return;
      
      const { lines, currentLine, highlightColor } = state;
      
      // 清空容器
      this.lyricsContainer.innerHTML = '';
      
      // 渲染每一行歌词
      lines.forEach((line, index) => {
        const lineElement = document.createElement('div');
        lineElement.className = 'lyric-line';
        lineElement.textContent = line.text;
        
        // 高亮当前行
        if (index === currentLine) {
          lineElement.style.cssText = `
            color: ${highlightColor || this.settings.highlight || '#d49a6a'};
            font-weight: bold;
            font-size: ${(this.settings.fontSize || 16) * 1.1}px;
            transition: all 0.3s ease;
          `;
        } else {
          lineElement.style.cssText = `
            color: ${this.settings.text || '#e0e0e0'};
            opacity: ${index < currentLine ? 0.5 : 0.8};
            transition: all 0.3s ease;
          `;
        }
        
        this.lyricsContainer.appendChild(lineElement);
      });
      
      // 滚动到当前行
      if (currentLine >= 0 && currentLine < lines.length) {
        const currentElement = this.lyricsContainer.children[currentLine];
        if (currentElement) {
          currentElement.scrollIntoView({
            behavior: 'smooth',
            block: 'center',
          });
        }
      }
    },
    
    /**
     * 销毁渲染器
     */
    destroy() {
      if (this.lyricsContainer) {
        this.lyricsContainer.remove();
        this.lyricsContainer = null;
      }
    },
  },
  
  // 设置Schema
  settingsSchema: {
    type: 'object',
    properties: {
      fontSize: {
        type: 'number',
        default: 16,
        title: '字号',
        minimum: 12,
        maximum: 24,
      },
      lineHeight: {
        type: 'number',
        default: 1.8,
        title: '行高',
        minimum: 1.2,
        maximum: 2.5,
      },
      text: {
        type: 'string',
        default: '#e0e0e0',
        title: '文字颜色',
        format: 'color',
      },
      highlight: {
        type: 'string',
        default: '#d49a6a',
        title: '高亮颜色',
        format: 'color',
      },
      padding: {
        type: 'number',
        default: 16,
        title: '内边距',
        minimum: 8,
        maximum: 32,
      },
    },
  },
  
  // 默认设置
  defaultSettings: {
    fontSize: 16,
    lineHeight: 1.8,
    text: '#e0e0e0',
    highlight: '#d49a6a',
    padding: 16,
  },
  
  // Fallback主题ID（自身是最终fallback）
  fallback: null,

/**
 * waveform-theme.js
 * 波形歌词视觉主题
 * 
 * Canvas实现，显示音频波形，中性能档位
 */

const waveformTheme = {
  id: 'waveform-theme',
  name: '波形主题',
  description: '歌词与音频波形同步显示',
  version: '1.0.0',
  author: '奥菲莉娅',
  
  // 性能要求
  requirements: {
    minTier: 'medium',
    features: ['canvas'],
  },
  
  // 渲染器
  renderer: {
    type: 'canvas',
    container: null,
    settings: null,
    canvas: null,
    ctx: null,
    animationId: null,
    waveformData: [],
    
    /**
     * 初始化渲染器
     * @param {HTMLElement} container
     * @param {object} settings
     */
    init(container, settings) {
      this.container = container;
      this.settings = settings;
      
      // 创建Canvas元素
      this.canvas = document.createElement('canvas');
      this.canvas.className = 'waveform-canvas';
      this.canvas.style.cssText = `
        width: 100%;
        height: ${settings.waveHeight || 60}px;
        display: block;
      `;
      this.container.appendChild(this.canvas);
      
      // 获取上下文
      this.ctx = this.canvas.getContext('2d');
      
      // 创建歌词容器
      this.lyricsContainer = document.createElement('div');
      this.lyricsContainer.className = 'lyrics-container waveform-theme';
      this.lyricsContainer.style.cssText = `
        font-size: ${settings.fontSize || 16}px;
        line-height: ${settings.lineHeight || 1.8};
        color: ${settings.lyricColor || '#d49a6a'};
        padding: ${settings.padding || 16}px;
        text-align: center;
        overflow-y: auto;
        max-height: calc(100% - ${settings.waveHeight || 60}px);
      `;
      this.container.appendChild(this.lyricsContainer);
      
      // 初始化波形数据
      this.waveformData = new Array(64).fill(0);
      
      // 调整Canvas大小
      this.resizeCanvas();
      window.addEventListener('resize', () => this.resizeCanvas());
    },
    
    /**
     * 调整Canvas大小
     */
    resizeCanvas() {
      if (!this.canvas) return;
      
      const rect = this.canvas.getBoundingClientRect();
      this.canvas.width = rect.width * window.devicePixelRatio;
      this.canvas.height = rect.height * window.devicePixelRatio;
      this.ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    },
    
    /**
     * 渲染歌词和波形
     * @param {object} state
     */
    render(state) {
      if (!this.ctx || !this.lyricsContainer) return;
      
      const { lines, currentLine, waveData } = state;
      
      // 更新波形数据
      if (waveData && waveData.length > 0) {
        this.waveformData = waveData;
      }
      
      // 清空Canvas
      this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
      
      // 绘制波形
      this.drawWaveform();
      
      // 渲染歌词
      this.renderLyrics(lines, currentLine);
    },
    
    /**
     * 绘制波形
     */
    drawWaveform() {
      const { width, height } = this.canvas.getBoundingClientRect();
      const barWidth = width / this.waveformData.length;
      const waveColor = this.settings.waveColor || '#4ade80';
      
      this.ctx.fillStyle = waveColor;
      
      this.waveformData.forEach((value, index) => {
        const barHeight = value * height * 0.8;
        const x = index * barWidth;
        const y = (height - barHeight) / 2;
        
        this.ctx.fillRect(x, y, barWidth - 1, barHeight);
      });
    },
    
    /**
     * 渲染歌词
     * @param {Array} lines
     * @param {number} currentLine
     */
    renderLyrics(lines, currentLine) {
      // 清空容器
      this.lyricsContainer.innerHTML = '';
      
      // 渲染每一行歌词
      lines.forEach((line, index) => {
        const lineElement = document.createElement('div');
        lineElement.className = 'lyric-line';
        lineElement.textContent = line.text;
        
        // 高亮当前行
        if (index === currentLine) {
          lineElement.style.cssText = `
            color: ${this.settings.lyricColor || '#d49a6a'};
            font-weight: bold;
            font-size: ${(this.settings.fontSize || 16) * 1.1}px;
            transition: all 0.3s ease;
          `;
        } else {
          lineElement.style.cssText = `
            color: ${this.settings.lyricColor || '#d49a6a'};
            opacity: ${index < currentLine ? 0.5 : 0.8};
            transition: all 0.3s ease;
          `;
        }
        
        this.lyricsContainer.appendChild(lineElement);
      });
      
      // 滚动到当前行
      if (currentLine >= 0 && currentLine < lines.length) {
        const currentElement = this.lyricsContainer.children[currentLine];
        if (currentElement) {
          currentElement.scrollIntoView({
            behavior: 'smooth',
            block: 'center',
          });
        }
      }
    },
    
    /**
     * 销毁渲染器
     */
    destroy() {
      if (this.animationId) {
        cancelAnimationFrame(this.animationId);
      }
      
      if (this.canvas) {
        this.canvas.remove();
        this.canvas = null;
      }
      
      if (this.lyricsContainer) {
        this.lyricsContainer.remove();
        this.lyricsContainer = null;
      }
      
      window.removeEventListener('resize', this.resizeCanvas);
    },
  },
  
  // 设置Schema
  settingsSchema: {
    type: 'object',
    properties: {
      waveColor: {
        type: 'string',
        default: '#4ade80',
        title: '波形颜色',
        format: 'color',
      },
      lyricColor: {
        type: 'string',
        default: '#d49a6a',
        title: '歌词颜色',
        format: 'color',
      },
      waveHeight: {
        type: 'number',
        default: 60,
        title: '波形高度',
        minimum: 30,
        maximum: 120,
      },
      fontSize: {
        type: 'number',
        default: 16,
        title: '字号',
        minimum: 12,
        maximum: 24,
      },
      lineHeight: {
        type: 'number',
        default: 1.8,
        title: '行高',
        minimum: 1.2,
        maximum: 2.5,
      },
      padding: {
        type: 'number',
        default: 16,
        title: '内边距',
        minimum: 8,
        maximum: 32,
      },
    },
  },
  
  // 默认设置
  defaultSettings: {
    waveColor: '#4ade80',
    lyricColor: '#d49a6a',
    waveHeight: 60,
    fontSize: 16,
    lineHeight: 1.8,
    padding: 16,
  },
  
  // Fallback主题ID
  fallback: 'default-theme',
};

// 导出
if (typeof module !== 'undefined' && module.exports) {

        left: 0;
        right: 0;
        font-size: ${settings.fontSize || 16}px;
        line-height: ${settings.lineHeight || 1.8};
        color: ${settings.lyricColor || '#d49a6a'};
        padding: ${settings.padding || 16}px;
        text-align: center;
        background: linear-gradient(transparent, rgba(0,0,0,0.7));
        max-height: 40%;
        overflow-y: auto;
      `;
      this.container.appendChild(this.lyricsContainer);
      
      // 初始化频谱数据
      this.spectrumData = new Array(settings.barCount || 64).fill(0);
      
      // 调整Canvas大小
      this.resizeCanvas();
      window.addEventListener('resize', () => this.resizeCanvas());
    },
    
    /**
     * 初始化WebGL
     */
    initWebGL() {
      const gl = this.gl;
      
      // 着色器源码
      const vertexShaderSource = `
        attribute vec2 a_position;
        attribute float a_height;
        uniform vec2 u_resolution;
        varying float v_height;
        
        void main() {
          vec2 clipSpace = (a_position / u_resolution) * 2.0 - 1.0;
          gl_Position = vec4(clipSpace * vec2(1, -1), 0, 1);
          v_height = a_height;
        }
      `;
      
      const fragmentShaderSource = `
        precision mediump float;
        uniform vec3 u_color;
        varying float v_height;
        
        void main() {
          gl_FragColor = vec4(u_color * v_height, 1.0);
        }
      `;
      
      // 编译着色器
      const vertexShader = this.compileShader(gl.VERTEX_SHADER, vertexShaderSource);
      const fragmentShader = this.compileShader(gl.FRAGMENT_SHADER, fragmentShaderSource);
      
      // 创建程序
      this.program = gl.createProgram();
      gl.attachShader(this.program, vertexShader);
      gl.attachShader(this.program, fragmentShader);
      gl.linkProgram(this.program);
      
      if (!gl.getProgramParameter(this.program, gl.LINK_STATUS)) {
        console.error('Program link failed:', gl.getProgramInfoLog(this.program));
        return;
      }
      
      // 获取属性位置
      this.positionLocation = gl.getAttribLocation(this.program, 'a_position');
      this.heightLocation = gl.getAttribLocation(this.program, 'a_height');
      this.resolutionLocation = gl.getUniformLocation(this.program, 'u_resolution');
      this.colorLocation = gl.getUniformLocation(this.program, 'u_color');
      
      // 创建缓冲区
      this.positionBuffer = gl.createBuffer();
      this.heightBuffer = gl.createBuffer();
    },
    
    /**
     * 编译着色器
     * @param {number} type
     * @param {string} source
     * @returns {WebGLShader}
     */
    compileShader(type, source) {
      const gl = this.gl;
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error('Shader compile failed:', gl.getShaderInfoLog(shader));
        gl.deleteShader(shader);
        return null;
      }
      
      return shader;
    },
    
    /**
     * 调整Canvas大小
     */
    resizeCanvas() {
      if (!this.canvas || !this.gl) return;
      
      const rect = this.canvas.getBoundingClientRect();
      this.canvas.width = rect.width * window.devicePixelRatio;
      this.canvas.height = rect.height * window.devicePixelRatio;
      this.gl.viewport(0, 0, this.canvas.width, this.canvas.height);
    },
    
    /**
     * 渲染歌词和频谱
     * @param {object} state
     */
    render(state) {
      if (!this.gl || !this.lyricsContainer) return;
      
      const { lines, currentLine, spectrumData } = state;
      
      // 更新频谱数据
      if (spectrumData && spectrumData.length > 0) {
        this.spectrumData = spectrumData;
      }
      
      // 绘制频谱
      this.drawSpectrum();
      
      // 渲染歌词
      this.renderLyrics(lines, currentLine);
    },
    
    /**
     * 绘制频谱
     */
    drawSpectrum() {
      const gl = this.gl;
      const { width, height } = this.canvas.getBoundingClientRect();
      
      // 清空画布
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      
      gl.useProgram(this.program);
      
      // 设置分辨率
      gl.uniform2f(this.resolutionLocation, width, height);
      
      // 设置颜色
      const color = this.hexToRgb(this.settings.spectrumColor || '#818cf8');
      gl.uniform3f(this.colorLocation, color.r, color.g, color.b);
      
      // 计算顶点位置
      const barWidth = width / this.spectrumData.length;
      const positions = [];
      const heights = [];
      
      this.spectrumData.forEach((value, index) => {
        const x = index * barWidth;
        const barHeight = value * height * 0.8;
        
        // 矩形顶点（两个三角形）
        positions.push(
          x, height - barHeight,
          x + barWidth - 1, height - barHeight,
          x, height,
          x, height,
          x + barWidth - 1, height - barHeight,
          x + barWidth - 1, height
        );
        
        // 高度值
        heights.push(value, value, value, value, value, value);
      });
      
      // 更新位置缓冲区
      gl.bindBuffer(gl.ARRAY_BUFFER, this.positionBuffer);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(positions), gl.DYNAMIC_DRAW);
      gl.enableVertexAttribArray(this.positionLocation);
      gl.vertexAttribPointer(this.positionLocation, 2, gl.FLOAT, false, 0, 0);
      
      // 更新高度缓冲区
      gl.bindBuffer(gl.ARRAY_BUFFER, this.heightBuffer);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(heights), gl.DYNAMIC_DRAW);
      gl.enableVertexAttribArray(this.heightLocation);
      gl.vertexAttribPointer(this.heightLocation, 1, gl.FLOAT, false, 0, 0);
      
      // 绘制
      gl.drawArrays(gl.TRIANGLES, 0, positions.length / 2);
    },
    
    /**
     * 渲染歌词
     * @param {Array} lines
     * @param {number} currentLine
     */
    renderLyrics(lines, currentLine) {
      // 清空容器
      this.lyricsContainer.innerHTML = '';
      
      // 渲染每一行歌词
      lines.forEach((line, index) => {
        const lineElement = document.createElement('div');
        lineElement.className = 'lyric-line';
        lineElement.textContent = line.text;
        
        // 高亮当前行
        if (index === currentLine) {
          lineElement.style.cssText = `
            color: ${this.settings.lyricColor || '#d49a6a'};
            font-weight: bold;
            font-size: ${(this.settings.fontSize || 16) * 1.1}px;
            transition: all 0.3s ease;
            text-shadow: 0 0 10px ${this.settings.lyricColor || '#d49a6a'};
          `;
        } else {
          lineElement.style.cssText = `
            color: ${this.settings.lyricColor || '#d49a6a'};
            opacity: ${index < currentLine ? 0.5 : 0.8};
            transition: all 0.3s ease;
          `;
        }
        
        this.lyricsContainer.appendChild(lineElement);
      });
      
      // 滚动到当前行
      if (currentLine >= 0 && currentLine < lines.length) {
        const currentElement = this.lyricsContainer.children[currentLine];
        if (currentElement) {
          currentElement.scrollIntoView({
            behavior: 'smooth',
            block: 'center',
          });
        }
      }
    },
    
    /**
     * Hex转RGB
     * @param {string} hex
     * @returns {object}
     */
    hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? {
        r: parseInt(result[1], 16) / 255,
        g: parseInt(result[2], 16) / 255,
        b: parseInt(result[3], 16) / 255,
      } : { r: 0.5, g: 0.5, b: 1.0 };
    },
    
    /**
     * 销毁渲染器
     */
    destroy() {
      if (this.animationId) {
        cancelAnimationFrame(this.animationId);
      }
      
      if (this.gl) {
        this.gl.deleteProgram(this.program);
        this.gl.deleteBuffer(this.positionBuffer);
        this.gl.deleteBuffer(this.heightBuffer);
      }
      
      if (this.canvas) {
        this.canvas.remove();
        this.canvas = null;
      }
      
      if (this.lyricsContainer) {
        this.lyricsContainer.remove();
        this.lyricsContainer = null;
      }
      
      window.removeEventListener('resize', this.resizeCanvas);
    },
  },
  
  // 设置Schema
  settingsSchema: {
    type: 'object',
    properties: {
      spectrumColor: {
        type: 'string',
        default: '#818cf8',
        title: '频谱颜色',
        format: 'color',
      },
      lyricColor: {
        type: 'string',
        default: '#d49a6a',
        title: '歌词颜色',
        format: 'color',
      },
      barCount: {
        type: 'number',
        default: 64,
        title: '频谱条数',
        minimum: 16,
        maximum: 128,
      },
      sensitivity: {
        type: 'number',
        default: 1.0,
        title: '灵敏度',
        minimum: 0.5,
        maximum: 2.0,
      },
      fontSize: {
        type: 'number',
        default: 16,
        title: '字号',
        minimum: 12,
        maximum: 24,
      },
      lineHeight: {
        type: 'number',
        default: 1.8,
        title: '行高',
        minimum: 1.2,
        maximum: 2.5,
      },
      padding: {
        type: 'number',
        default: 16,
        title: '内边距',
        minimum: 8,
        maximum: 32,
      },
    },
  },
  
  // 默认设置
  defaultSettings: {
    spectrumColor: '#818cf8',
    lyricColor: '#d49a6a',
    barCount: 64,
    sensitivity: 1.0,
    fontSize: 16,
    lineHeight: 1.8,
    padding: 16,
  },
  
  // Fallback主题ID
  fallback: 'waveform-theme',
};

// 导出
if (typeof module !== 'undefined' && module.exports) {
  module.exports = spectrumTheme;
} else if (typeof window !== 'undefined') {
  window.spectrumTheme = spectrumTheme;
}

</script>

<script>
(function () {
  try {
    var ticket = new URLSearchParams(location.search).get("appSurfaceSession");
    if (!ticket) return;
    var KEY = "appSurfaceSession";

    function withTicket(v) {
      if (typeof v !== "string" || !v) return v;
      if (v.indexOf(KEY + "=") >= 0) return v;
      var same;
      try {
        same = new URL(v, location.href).origin === location.origin;
      } catch (e) {
        same = v.charAt(0) === "/";
      }
      if (!same) return v;
      return v + (v.indexOf("?") > -1 ? "&" : "?") + KEY + "=" + encodeURIComponent(ticket);
    }
    window.__apWithTicket = withTicket;

    function patchSrc(proto) {
      if (!proto) return;
      var d = Object.getOwnPropertyDescriptor(proto, "src");
      if (d && d.set) {
        Object.defineProperty(proto, "src", {
          configurable: true,
          enumerable: d.enumerable,
          get: d.get,
          set: function (v) {
            return d.set.call(this, withTicket(v));
          },
        });
      }
      var origSetAttr = proto.setAttribute;
      proto.setAttribute = function (name, value) {
        if (String(name).toLowerCase() === "src") value = withTicket(value);
        return origSetAttr.call(this, name, value);
      };
    }

    patchSrc(window.HTMLMediaElement && window.HTMLMediaElement.prototype);
    patchSrc(window.HTMLImageElement && window.HTMLImageElement.prototype);
  } catch (e) {
    /* 补不上也不能把页面弄死 */
  }
})();
</script>
<script>
(function () {
  var tries = { idx: null, n: 0, ts: 0 };
  function install() {
    if (typeof window.load !== "function") return false;
    if (window.load.__retryGuarded) return true;
    var orig = window.load;
    window.load = function (i) {
      var now = Date.now();
      if (i === tries.idx && now - tries.ts < 20000) {
        tries.n++;
        if (tries.n > 2) {
          console.warn("[guard] 同一曲目连续失败 " + tries.n + " 次，停止重试");
          return;
        }
      } else {
        tries.idx = i;
        tries.n = 1;
      }
      tries.ts = now;
      return orig.apply(this, arguments);
    };
    window.load.__retryGuarded = true;
    return true;
  }
  // 页面脚本在 body 里，晚于本脚本执行 —— 轮询等它出现。
  var t = setInterval(function () {
    if (install()) clearInterval(t);
  }, 300);
})();
</script>
<script>
(function () {
  var ticket = new URLSearchParams(location.search).get("appSurfaceSession");
  if (!ticket || !window.fetch) return;
  var orig = window.fetch;
  window.fetch = function (input, init) {
    try {
      var url = typeof input === "string" ? input : (input && input.url) || "";
      var isLocal = false;
      try {
        var abs = new URL(url, location.href);
        isLocal = abs.origin === location.origin;
      } catch (e) {
        isLocal = url.charAt(0) === "/";
      }
      if (isLocal) {
        init = init || {};
        var h = new Headers(init.headers || {});
        if (!h.has("X-Hana-App-Surface-Session")) h.set("X-Hana-App-Surface-Session", ticket);
        init.headers = h;
      }
    } catch (e) {
      /* 头没补上也不能把请求弄丢 */
    }
    return orig.call(this, input, init);
  };
})();

<script>
(function () {
  var APP_BASE = "/api/apps/hanako-audio-player/routes";

  // 1) 迁移 localStorage 里的 v1 路径
  try {
    var KEY = "hanako_audio_playlist";
    var s = localStorage.getItem(KEY);
    if (s && s.indexOf("/api/plugins/") >= 0) {
      localStorage.setItem(KEY, s.split("/api/plugins/hanako-audio-player/").join(APP_BASE + "/"));
    }
  } catch (e) {
    /* 迁移失败不能拦住界面 */
  }

  // 2) 当前歌词行 → 输入框上方横幅（每 2 秒看一眼，变了才推）
  //
  // 前提：必须先在对话里用过一次工具（audio_play），把会话绑上。
  // 卡片自己拿不到 sessionPath —— 宿主只给 appId/slot/cardInstanceId，
  // SDK 里也没有任何 session API（查过）。所以这里只能“报告状态”，
  // 不能在卡片里自己把会话绑上。
  var lastLine = "";
  var warned = false;
  var lastReportedTitle = "";

  // 2b) 当前曲目 → 后端
  //
  // 症状：在卡片里换歌后，横幅里的歌名还是旧的。
  // 根因：后端只在 audio_play 工具调用时更新曲目；卡片自己换歌只改了
  // 界面（trackName），从没告知后端。而 /api/lyric-line 拼文案时读的
  // 就是后端的 track.title。
  // 这里盯 #trackName 的变化，一变就上报。
  setInterval(function () {
    try {
      var el = document.getElementById("trackName");
      if (!el) return;
      var title = (el.textContent || "").trim();
      // “播放器”是待机占位，不是真曲目，别上报
      if (!title || title === "播放器" || title === lastReportedTitle) return;
      lastReportedTitle = title;
      fetch(APP_BASE + "/api/now-playing", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title: title }),
      }).catch(function () {});
    } catch (e) {}
  }, 1500);

  function tipOnce(msg) {
    if (warned) return;
    warned = true;
    // 页面自带的 toast（toastContainer + .toast-item 样式）
    try {
      if (typeof showToast === "function") showToast(msg, 5000);
    } catch (e) {}
  }

  // 启动时查一次会话绑定状态，未绑就提醒（只提一次，不烦人）
  setTimeout(function () {
    fetch(APP_BASE + "/api/session-status")
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (res && res.bound === false) {
          tipOnce("想让歌词显示在输入框上方？先在对话里让我播一首（会用 audio_play）。");
        }
      })
      .catch(function () {});
  }, 2500);

  setInterval(function () {
    try {
      var el = document.querySelector(".lyric-line.current");
      if (!el) return;
      var line = (el.textContent || "").trim();
      if (!line || line === lastLine) return;
      lastLine = line;
      fetch(APP_BASE + "/api/lyric-line", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ line: line }),
      })
        .then(function (r) { return r.json().catch(function () { return null; }); })
        .then(function (res) {
          if (res && res.error === "no-bound-session") {
            tipOnce("歌词横幅需要先在对话里播一首（用 audio_play）绑定会话。");
          }
        })
        .catch(function () {});
    } catch (e) {
      /* 推不了就算了，不打扰播放 */
    }
  }, 2000);
  // 3) SMTC 可行性探针（只读，Phase B 用；验完可拆）
  //
  // 需求文档 §八 的前置条件：先查 navigator.mediaSession 在这个沙盒 iframe
  // 里到底能不能用，再决定要不要投入实现。
  // 这个探针不碰播放、不改任何状态，只把“能不能用”报回后端。
  setTimeout(function () {
    try {
      var ms = navigator.mediaSession;
      var result = {
        inIframe: window.self !== window.top,
        hasMediaSession: "mediaSession" in navigator,
        hasMediaMetadata: typeof window.MediaMetadata === "function",
        // 逐个方法查存在性 —— 光看对象存在不够，要能真调
        methods: {},
        // 权限策略：能不能看到 mediaSession 相关的 controlled features
        permPolicy:
          document.featurePolicy && typeof document.featurePolicy.allowsFeature === "function"
            ? {
                "mediasession": document.featurePolicy.allowsFeature("mediasession"),
                autoplay: document.featurePolicy.allowsFeature("autoplay"),
              }
            : null,
        origin: location.origin,
        isSecureContext: window.isSecureContext === true,
      };
      [
        "setActionHandler",
        "setPositionState",
        "setMicrophoneActive",
        "setCameraActive",
      ].forEach(function (k) {
        result.methods[k] = ms ? typeof ms[k] === "function" : false;
      });
      // 再试一次真调：setActionHandler 传个合法 action + 空函数
      if (ms && typeof ms.setActionHandler === "function") {
        try {
          ms.setActionHandler("play", function () {});
          ms.setActionHandler("play", null);
          result.setActionHandlerWorks = true;
        } catch (e) {
          result.setActionHandlerWorks = false;
          result.setActionHandlerError = String(e && e.message);
        }
      }
      // metadata 赋值测试
      if (result.hasMediaMetadata && ms) {
        try {
          ms.metadata = new window.MediaMetadata({ title: "probe", artist: "probe" });
          result.metadataAssignWorks = true;
        } catch (e) {
          result.metadataAssignWorks = false;
          result.metadataError = String(e && e.message);
        }
      }
      fetch(APP_BASE + "/api/_probe/smtc", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(result),
      }).catch(function () {});
    } catch (e) {
      /* 探针本身报错不能影响界面 */
    }
  }, 1500);

  // 5) 尺寸探针（只读，诊断用；验完可拆）
  //
  // 症状：卡片在聊天流里撑满整个视口，聊天区被顶住滑不动。我上报的是 460px，
  // 但看着没生效。这里把真实尺寸 + envelope（宿主告知的容器约束）报回后端。
  // 同时轮询 /api/_probe/resize：从后端就能触发一次 resize，
  // 用来区分「通道不通」和「通道通但宿主不采纳」。
  setInterval(function () {
    try {
      function box(sel) {
        var el = document.querySelector(sel);
        return el ? Math.round(el.getBoundingClientRect().height) : null;
      }
      function boxW(sel) {
        var el = document.querySelector(sel);
        return el ? Math.round(el.getBoundingClientRect().width) : null;
      }
      var env = null;
      try {
        env =
          window.__hana && window.__hana.envelope
            ? window.__hana.envelope.getSnapshot()
            : null;
      } catch (e) {}
      fetch(APP_BASE + "/api/_probe/size", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          probeKey:
            (/standalone\.html$/i.test(location.pathname) ? "win" : "card") +
            ":" + ((window.__hanaGetView && window.__hanaGetView()) || "?"),
          innerHeight: window.innerHeight,
          docClientHeight: document.documentElement.clientHeight,
          bodyClientHeight: document.body.clientHeight,
          bodyScrollHeight: document.body.scrollHeight,
          cssBodyHeight: getComputedStyle(document.body).height,
          cssHtmlHeight: getComputedStyle(document.documentElement).height,
          container: box(".player-container"),
          playerRight: box(".player-right"),
          plBody: box("#plBody"),
          // ── 布局诊断（主机侧看不到这个窗口，就把事实写出来）──
          // 注：这里量的是“布局结果”，不是像素——截图我看不到，数字能看。
          bodyClass: document.body.className,
          viewportW: window.innerWidth,
          leftW: boxW(".player-left"),
          rightW: boxW(".player-right"),
          lyricsH: box(".lyrics-section"),
          lyricBodyH: box(".lyric-body"),
          lyricLineCount: document.querySelectorAll(".lyric-body > *").length,
          wideOff: document.body.classList.contains("wide-off"),
          popup: document.body.classList.contains("player-popup"),
          hasHana: !!window.__hana,
          build: window.__HANA_BUILD || null,
          envelope: env,
          // ── 滚动诊断 ──
          // 症状：卡片高度修好了，但内部滚不动。
          // 这里把每个候选滚动容器的可滚性量出来，不靠猜。
          scroll: (function () {
            function m(sel) {
              var el = document.querySelector(sel);
              if (!el) return null;
              var cs = getComputedStyle(el);
              return {
                scrollH: el.scrollHeight,
                clientH: el.clientHeight,
                scrollable: el.scrollHeight - el.clientHeight,
                overflowY: cs.overflowY,
                flex: cs.flex,
                height: cs.height,
                minHeight: cs.minHeight,
                display: cs.display,
              };
            }
            // 把 .player-container 的直接子元素逐个量出来（窄版下 display:contents
            // 会让 .player-left / .player-right 从布局里消失，子元素变成容器的 flex item）
            var kids = [];
            try {
              var cont = document.querySelector(".player-container");
              if (cont) {
                var walk = function (n, depth) {
                  for (var i = 0; i < n.children.length; i++) {
                    var c = n.children[i];
                    var cs = getComputedStyle(c);
                    var r = c.getBoundingClientRect();
                    if (depth < 2) {
                      kids.push({
                        d: depth,
                        cls: (c.className || c.id || c.tagName) + "",
                        h: Math.round(r.height),
                        display: cs.display,
                        flex: cs.flex,
                        flexShrink: cs.flexShrink,
                        overflowY: cs.overflowY,
                      });
                    }
                    if (cs.display === "contents") walk(c, depth);
                    else if (depth < 1) walk(c, depth + 1);
                  }
                };
                walk(cont, 0);
              }
            } catch (e) {}
            return {
              container: m(".player-container"),
              tabContent: m(".tab-content"),
              tabPane: m(".tab-pane.active"),
              plBody: m("#plBody"),
              kids: kids,
            };
          })(),
        }),
      }).catch(function () {});
    } catch (e) {}
  }, 3000);

  // 6) 修「白天/黑夜切换失效」
  //
  // 症状：AI 主题跑过一次后，右上角那个日/月图标就切不动了。
  //
  // 原因：applyThemeToCSS() 用 root.style.setProperty() 把 19 个变量写在
  // **inline style** 上（--bg / --surface / --text …），而 applyTheme() 只改
  // data-theme 属性。[data-theme="light"] 那些 CSS 规则优先级低于行内，
  // 所以行内一铺上去，切换就被压住了。
  //
  // 不去改 applyThemeToCSS（那是主题引擎的地盘），而在外层包 applyTheme：
  // 切主题时把那些行内覆盖清掉，让 CSS 接管。清空之后 AI 主题下次仍会重写，
  // 行为不回退。
  var THEMED_VARS = [
    "--accent", "--accent-hover", "--accent-glow", "--accent-soft",
    "--bg", "--card-bg", "--surface", "--surface-hover", "--surface-active",
    "--border", "--border-strong", "--text", "--text-dim", "--text-faint",
    "--lyric-color", "--lyric-active-color", "--lyric-chorus-color",
    "--font-base", "--anim-speed",
  ];
  function clearInlineTheme() {
    var root = document.documentElement;
    for (var i = 0; i < THEMED_VARS.length; i++) {
      root.style.removeProperty(THEMED_VARS[i]);
    }
  }
  function patchApplyTheme() {
    if (typeof window.applyTheme !== "function") return false;
    if (window.applyTheme.__themed) return true;
    var orig = window.applyTheme;
    window.applyTheme = function () {
      clearInlineTheme();
      return orig.apply(this, arguments);
    };
    window.applyTheme.__themed = true;
    return true;
  }
  var pt = setInterval(function () {
    if (patchApplyTheme()) clearInterval(pt);
  }, 300);
  setTimeout(function () { clearInterval(pt); }, 15000);

  // 1.5 秒后清一次：初始 applyTheme 会先跑，可能存在早期污染。
  // 但清的时候会把「配色主题」预设刚写上去的行内变量一并清掉（实测：
  // 金夜的 #D4AF37 被清回默认 #d49a6a）。所以清完发个事件，
  // 让预设层把当前预设重写一遍。
  setTimeout(function () {
    clearInlineTheme();
    try { document.dispatchEvent(new CustomEvent("hana:theme-reapply")); } catch (e) {}
  }, 1500);

  setInterval(function () {
    fetch(APP_BASE + "/api/_probe/resize")
      .then(function (r) {
        return r.json();
      })
      .then(function (res) {
        if (!res || !res.ok || res.height == null) return;
        try {
          if (window.__hana) window.__hana.ui.resize({ height: res.height });
        } catch (e) {}
      })
      .catch(function () {});
  }, 5000);
})();
</script>
<script>
(function () {
  var MINE = window.__HANA_BUILD;
  if (!MINE) return;
  // APP_BASE 是 .../routes，静态资源在 .../ui
  var APP_BASE = "/api/apps/hanako-audio-player/routes";
  var UI_BASE = APP_BASE.replace(/\/routes$/, "/ui");
  var last = 0;
  setInterval(function () {
    var now = Date.now();
    if (now - last < 5000) return;
    last = now;
    fetch(UI_BASE + "/_build.json", { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (j && j.build && j.build !== MINE) {
          // 自限：10 秒内只自动重载一次。
          // 宿主若对 ui/ 静态资源强缓存，重载后仍是旧页面，
          // 它会反复拿到新构建号 —— 那就变成无限刷新，比“没自动更新”糟得多。
          var t = Date.now();
          var lastTry = 0;
          try {
            lastTry = Number(sessionStorage.getItem("hana:build-reload-at") || 0);
          } catch (e) {}
          if (t - lastTry < 10000) {
            console.warn("[hana] 构建号不一致，但刚刚已重载过，停止自动刷新（可能命中了缓存）");
            return;
          }
          try {
            sessionStorage.setItem("hana:build-reload-at", String(t));
          } catch (e) {}
          console.log("[hana] 检测到新构建 " + j.build + "（当前 " + MINE + "），重载页面");
          location.reload();
        }
      })
      .catch(function () {});
  }, 5000);
})();
</script>

<script>
// === audio-event-bus.js ===
/**
 * audio-event-bus.js
 * 统一音频事件总线
 * 
 * 为音频播放器提供标准化事件发射和订阅机制
 * 支持桌宠、视觉层、状态栏、歌词舞台等消费方
 * 
 * AUDIO-09 独立歌词舞台扩展：
 * - track-change: 曲目切换时发射，携带完整歌词数据
 * - progress: 播放进度更新（调用方节流）
 * - play-state: 播放/暂停状态变化
 * - theme: 主题变更
 * - lyrics-toggle: 翻译显隐切换（舞台→播放器）
 */

class AudioEventBus {
  constructor() {
    this.listeners = new Map();
    this.debug = false;
    this.currentTrackId = null;
    this.currentTrackName = null;
    this.currentAudioType = 'music';
    // AUDIO-09: 缓存最近一次 track-change 数据，供舞台重连时恢复
    this._lastTrackChange = null;
    this._lastProgress = null;
  }

  /**
   * 发射音频事件
   * @param {string} type - 事件类型
   * @param {string} audioType - 音频类型（music/tts/notification）
   * @param {object} payload - 事件数据
   */
  emit(type, audioType, payload = {}) {
    const event = new CustomEvent('audio-event', {
      detail: {
        type,
        timestamp: Date.now(),
        audioType: audioType || this.currentAudioType,
        trackId: this.currentTrackId,
        trackName: this.currentTrackName,
        payload
      },
      bubbles: true,
      cancelable: false
    });

    // 发射到当前窗口
    window.dispatchEvent(event);

    // 尝试冒泡到父窗口（iframe场景）
    try {
      if (window.parent && window.parent !== window) {
        window.parent.dispatchEvent(event);
      }
    } catch (e) {
      // 跨域限制，忽略
    }

    if (this.debug) {
      console.log('[AudioEventBus]', type, event.detail);
    }
  }

  /**
   * 订阅音频事件
   * @param {string} type - 事件类型（可选，不传则监听所有）
   * @param {function} callback - 回调函数
   * @returns {function} 取消订阅函数
   */
  on(type, callback) {
    const handler = (event) => {
      if (!type || event.detail.type === type) {
        callback(event.detail);
      }
    };

    window.addEventListener('audio-event', handler);

    // 返回取消订阅函数
    return () => {
      window.removeEventListener('audio-event', handler);
    };
  }

  /**
   * 一次性订阅
   * @param {string} type - 事件类型
   * @param {function} callback - 回调函数
   */
  once(type, callback) {
    const unsubscribe = this.on(type, (detail) => {
      unsubscribe();
      callback(detail);
    });
  }

  /**
   * 设置当前播放曲目信息
   * @param {string} trackId - 曲目ID
   * @param {string} trackName - 曲目名称
   */
  setTrack(trackId, trackName) {
    this.currentTrackId = trackId;
    this.currentTrackName = trackName;
  }

  /**
   * 设置当前音频类型
   * @param {string} audioType - 音频类型（music/tts/notification）
   */
  setAudioType(audioType) {
    this.currentAudioType = audioType;
  }

  /**
   * 开启调试模式
   */
  enableDebug() {
    this.debug = true;
  }

  /**
   * 关闭调试模式
   */
  disableDebug() {
    this.debug = false;
  }

  /**
   * 获取当前播放信息
   * @returns {object} 当前播放信息
   */
  getCurrentInfo() {
    return {
      trackId: this.currentTrackId,
      trackName: this.currentTrackName,
      audioType: this.currentAudioType
    };
  }

  // ═══════════════════════════════════════════
  // AUDIO-09 扩展方法
  // ═══════════════════════════════════════════

  /**
   * 发射曲目切换事件
   * @param {object} trackInfo - 曲目信息
   * @param {Array} lrcData - 歌词数据 [{time, text, translate?}]
   */
  emitTrackChange(trackInfo, lrcData) {
    const data = {
      trackId: trackInfo.url || trackInfo.name || String(Date.now()),
      trackName: trackInfo.name || '未知曲目',
      mode: trackInfo.mode || '在线',
      lrcData: lrcData || [],
      hasLyrics: !!(lrcData && lrcData.length > 0)
    };
    
    this._lastTrackChange = data;
    this.setTrack(data.trackId, data.trackName);
    this.emit('track-change', null, data);
  }

  /**
   * 发射进度事件（调用方负责节流）
   * @param {number} currentTime - 当前秒数
   * @param {number} duration - 总时长秒数
   * @param {boolean} isPlaying - 是否正在播放
   */
  emitProgress(currentTime, duration, isPlaying) {
    const data = {
      currentTime: Math.round(currentTime * 1000), // ms
      duration: Math.round(duration * 1000),        // ms
      isPlaying: !!isPlaying
    };
    
    this._lastProgress = data;
    this.emit('progress', null, data);
  }

  /**
   * 发射播放状态事件
   * @param {boolean} playing - 是否正在播放
   */
  emitPlayState(playing) {
    this.emit('play-state', null, { playing: !!playing });
  }

  /**
   * 发射主题事件
   * @param {string} theme - 'dark' | 'light'
   */
  emitTheme(theme) {
    this.emit('theme', null, { theme: theme || 'dark' });
  }

  /**
   * 获取缓存的最近一次曲目切换数据（用于舞台重连恢复）
   * @returns {object|null}
   */
  getLastTrackChange() {
    return this._lastTrackChange;
  }

  /**
   * 获取缓存的最近一次进度数据
   * @returns {object|null}
   */
  getLastProgress() {
    return this._lastProgress;
  }
}

/**
 * theme-registry.js
 * 歌词视觉主题注册表
 * 
 * 为音频播放器提供主题注册、加载、性能检查和fallback机制
 */

class ThemeRegistry {
  constructor() {
    this.themes = new Map();
    this.loadedModules = new Map();
    this.currentTheme = null;
    this.currentSettings = null;
    this.performanceTier = 'medium';
    this.fallbackManager = new FallbackManager(this);
  }

  /**
   * 注册主题
   * @param {ThemeDefinition} theme - 主题定义
   */
  register(theme) {
    if (!theme.id) throw new Error('Theme must have an id');
    this.themes.set(theme.id, theme);
  }

  /**
   * 批量注册主题
   * @param {ThemeDefinition[]} themes
   */
  registerBatch(themes) {
    themes.forEach(t => this.register(t));
  }

  /**
   * 获取主题列表
   * @returns {ThemeDefinition[]}
   */
  listThemes() {
    return Array.from(this.themes.values());
  }

  /**
   * 获取主题
   * @param {string} themeId
   * @returns {ThemeDefinition | undefined}
   */
  getTheme(themeId) {
    return this.themes.get(themeId);
  }

  /**
   * 加载主题（懒加载）
   * @param {string} themeId
   * @returns {Promise<ThemeDefinition>}
   */
  async loadTheme(themeId) {
    // 检查是否已加载
    if (this.loadedModules.has(themeId)) {
      return this.loadedModules.get(themeId);
    }

    // 获取主题定义
    const theme = this.themes.get(themeId);
    if (!theme) {
      throw new Error(`Theme not found: ${themeId}`);
    }

    // 检查性能要求
    if (!this.checkRequirements(theme)) {
      console.warn(`Theme ${themeId} requires higher performance, using fallback`);
      return this.loadTheme(theme.fallback || 'default-theme');
    }

    // 动态加载渲染器模块
    if (theme.renderer.module) {
      const module = await import(theme.renderer.module);
      theme.renderer = { ...theme.renderer, ...module.default };
    }

    this.loadedModules.set(themeId, theme);
    return theme;
  }

  /**
   * 检查性能要求
   * @param {ThemeDefinition} theme
   * @returns {boolean}
   */
  checkRequirements(theme) {
    const tierOrder = { low: 0, medium: 1, high: 2 };
    const current = tierOrder[this.performanceTier] || 1;
    const required = tierOrder[theme.requirements.minTier] || 0;
    
    if (current < required) return false;
    
    // 检查特性支持
    if (theme.requirements.features) {
      for (const feature of theme.requirements.features) {
        if (!this.checkFeatureSupport(feature)) return false;
      }
    }
    
    return true;
  }

  /**
   * 检查特性支持
   * @param {string} feature
   * @returns {boolean}
   */
  checkFeatureSupport(feature) {
    switch (feature) {
      case 'canvas':
        return !!document.createElement('canvas').getContext;
      case 'webgl':
        try {
          const canvas = document.createElement('canvas');
          return !!(canvas.getContext('webgl') || canvas.getContext('experimental-webgl'));
        } catch (e) {
          return false;
        }
      case 'css-animations':
        return CSS.supports('animation', 'test');
      default:
        return true;
    }
  }

  /**
   * 应用主题
   * @param {string} themeId
   * @param {HTMLElement} container
   * @param {object} settings
   */
  async applyTheme(themeId, container, settings = {}) {
    // 销毁当前主题
    if (this.currentTheme) {
      this.currentTheme.renderer.destroy();
    }

    // 加载新主题
    const theme = await this.loadTheme(themeId);
    
    // 合并设置
    const mergedSettings = { ...theme.defaultSettings, ...settings };
    
    // 初始化渲染器
    theme.renderer.init(container, mergedSettings);
    
    this.currentTheme = theme;
    this.currentSettings = mergedSettings;
    
    return theme;
  }

  /**
   * 渲染当前主题
   * @param {object} state - 歌词状态
   */
  render(state) {
    if (this.currentTheme) {
      this.currentTheme.renderer.render(state);
    }
  }

  /**
   * 设置性能档位
   * @param {string} tier
   */
  setPerformanceTier(tier) {
    this.performanceTier = tier;
  }

  /**
   * 获取当前主题
   * @returns {ThemeDefinition | null}
   */
  getCurrentTheme() {
    return this.currentTheme;
  }

  /**
   * 获取当前设置
   * @returns {object | null}
   */
  getCurrentSettings() {
    return this.currentSettings;
  }
}

/**
 * Fallback管理器
 */
class FallbackManager {
  constructor(registry) {
    this.registry = registry;
  }

  /**
   * 获取可用主题（带fallback）
   * @param {string} themeId
   * @returns {Promise<ThemeDefinition>}
   */
  async getAvailableTheme(themeId) {
    const visited = new Set();
    let currentId = themeId;
    
    while (currentId) {
      if (visited.has(currentId)) {
        // 循环检测，使用默认主题
        console.warn('Theme fallback loop detected, using default');
        return this.registry.getTheme('default-theme');
      }
      
      visited.add(currentId);
      const theme = this.registry.getTheme(currentId);
      
      if (!theme) {
        // 主题不存在，使用默认
        console.warn(`Theme ${currentId} not found, using default`);
        return this.registry.getTheme('default-theme');
      }
      
      // 检查性能要求
      if (this.registry.checkRequirements(theme)) {
        return theme;
      }
      
      // 降级到fallback
      console.warn(`Theme ${currentId} requires higher performance, falling back to ${theme.fallback}`);
      currentId = theme.fallback;
    }
    
    // 所有fallback都失败，使用默认
    return this.registry.getTheme('default-theme');
  }
}

// 全局单例
if (!window.themeRegistry) {
  window.themeRegistry = new ThemeRegistry();
}

// 导出（支持模块化）
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { ThemeRegistry, FallbackManager };
}
