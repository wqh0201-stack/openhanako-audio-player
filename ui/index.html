  PV.onFrame = function (fn) { if (fn && _subs.indexOf(fn) < 0) _subs.push(fn); };
  PV.offFrame = function (fn) { var i = _subs.indexOf(fn); if (i >= 0) _subs.splice(i, 1); };
  PV.frameCount = function () { return _subs.length; };
  PV.startLoop = function () {
    if (_raf) return;
    var tick = function () {
      _raf = requestAnimationFrame(tick);
      if (!PV.active()) return;
      var p = S.plan;
      var c = p && p.ctx;
      if (c) c.lt = (performance.now() - S.cutT) / 1000;
      for (var i = 0; i < _subs.length; i++) { try { _subs[i](c); } catch (e) { } }
      if (!p || !S.cur || !S.cur.parentNode) return;
      if (p.hold && p.hold.frame) p.hold.frame(c);
      if (p.camera && p.camera.frame) p.camera.frame(c);
      p.treatment.forEach(function (t) { if (t.frame) t.frame(c); });
    };
    _raf = requestAnimationFrame(tick);
  };

  PV.empty = function (msg) {
    if (!PV.mount()) return;
    stopAll();
    S.cur = null; S.idx = -1; S.cuts = null; S.cutI = 0; S.cutsLine = -1; S.cuts = null; S.cutI = 0;
    S.track.innerHTML = '<div class="jv-line jv-center show"><div class="cur" style="opacity:.4">' + (msg || '暂无歌词') + '</div></div>';
  };

  /* ---------- 事件 ---------- */
  PV.dispatch = function (name, detail) {
    try { document.dispatchEvent(new CustomEvent(name, { detail: detail || {} })); } catch (e) { }
  };

  /* ---------- 测试钩子（无播放环境时用这些验骨架） ---------- */
  PV.demo = function (lines, i) {
    PV.setLyrics((lines || ['主歌的第一句歌词', 'Short latin line here', '夜']).map(function (t, n) {
      return { text: t, time: n * 4000, end: n * 4000 + 4000 };
    }));
    PV.mount();
    return PV.show(i == null ? 0 : i, { force: true });
  };
})();

})();

  PV.reg('layout', 'label', {

    render: function (c) {
      return '<div class="tagbox" data-n="' + String((c.idx || 0) + 1).padStart(2, '0') + '">' + PV.spans(c) + '</div>';
    }
  });

  PV.reg('layout', 'type', {
    nm: '打字', tags: ['editorial', 'glitch'], w: 1,
    render: function (c) { return '<div>&gt; ' + PV.spans(c) + '<span class="caret"></span></div>'; }
  });

  PV.reg('layout', 'caption', {
    nm: '字幕', tags: ['editorial', 'calm'], w: 1,
    render: function (c) { return '<div class="capbar">' + PV.spans(c) + '</div>'; }
  });

  /* ---------- 7 个补齐版式 ---------- */
  PV.reg('layout', 'diag', {
    nm: '斜带', tags: ['pop', 'graphic'], w: 0.9,
    fit: function (c) { return c.tokens.length <= 14; },
    render: function (c) {
      return '<div class="bd"></div><div class="bd bd2"></div><div class="dt">' + PV.spans(c) + '</div>';
    }
  });

  PV.reg('layout', 'circle', {
    nm: '圆窗', tags: ['calm', 'emotional'], w: 0.8,
    fit: function (c) { return c.tokens.length <= 10; },
    render: function (c) { return '<div class="disc"></div><div class="ct">' + PV.spans(c) + '</div>'; }
  });

  PV.reg('layout', 'stack', {
    nm: '残像叠', tags: ['graphic', 'emotional'], w: 0.8,
    fit: function (c) { return c.tokens.length <= 12; },
    render: function (c) { return '<div class="sk">' + PV.spans(c) + '</div>'; }
  });

  PV.reg('layout', 'pill', {
    nm: '胶囊', tags: ['pop', 'editorial'], w: 0.9,
    fit: function (c) { return c.tokens.length <= 14; },
    render: function (c) {
      var l = c.lyrics, i = c.idx;
      var pv = i > 0 && l[i - 1] ? PV.plain(l[i - 1].text) : '';
      var nx = i < l.length - 1 && l[i + 1] ? PV.plain(l[i + 1].text) : '';
      return '<div class="pd pt2">' + pv + '</div><div class="pd pb2">' + nx + '</div><div class="pl">' + PV.spans(c) + '</div>';
    }
  });

  PV.reg('layout', 'cond', {
    nm: '纵压', tags: ['graphic', 'glitch'], w: 0.7,
    fit: function (c) { return !c.ltr && c.tokens.length <= 10; },
    render: function (c) { return '<div class="cd">' + PV.spans(c) + '</div>'; }
  });

  PV.reg('layout', 'cad', {
    nm: '星散', tags: ['emotional', 'calm'], w: 0.9, spread: 1,
    pre: function (c) { c.stagger = 60; },
    render: function (c) {
      // 词/字种子散落 + 微旋转 + 漂浮几何；发光交给 treatment 层的逐字扫光
      var txt = c.text, idx = c.idx || 0, seedBase = txt.length * 7 + idx * 13, out = '';
      var cr = function (o) { var x = Math.sin(seedBase + o) * 10000; return x - Math.floor(x); };
      var glyphs = ['◇', '✕', '△', '+', '□'];
      for (var d = 0; d < 4; d++) {
        out += '<span class="deco" style="left:' + (8 + cr(d + 40) * 84).toFixed(1) + '%;top:' + (10 + cr(d + 50) * 76).toFixed(1) +
          '%;font-size:' + (10 + cr(d + 60) * 16).toFixed(0) + 'px;animation-delay:' + (d * 1.7).toFixed(1) + 's;color:var(--jv-acc)">' +
          glyphs[Math.floor(cr(d + 70) * glyphs.length)] + '</span>';
      }
      return out + PV.spans(c, {
        style: function (i) {
          var x = 6 + cr(i * 3) * 82, y = 14 + cr(i * 3 + 1) * 64, r = (cr(i * 3 + 2) - 0.5) * 24, s = (22 + cr(i * 3 + 4) * 22).toFixed(0);
          return 'left:' + x.toFixed(1) + '%;top:' + y.toFixed(1) + '%;font-size:' + s + 'px;transform:rotate(' + r.toFixed(1) + 'deg)';
        }
      });
    }
  });

  PV.reg('layout', 'ren', {
    nm: '连行', tags: ['calm', 'editorial'], w: 1,
    render: function (c) {
      var l = c.lyrics, i = c.idx;
      var p = i > 0 && l[i - 1] ? PV.plain(l[i - 1].text) : '';
      var n = i < l.length - 1 && l[i + 1] ? PV.plain(l[i + 1].text) : '';
      return '<div class="prev">' + p + '</div><div class="rule"></div><div class="cur">' + PV.spans(c) +
        '</div><div class="rule"></div><div class="next">' + n + '</div>';
    }
  });

  /* ---------- 2 个专用版式：不进随机池，由 special 显式调用 ----------
   * 旧实现里它们只在部件表和 CSS 里存在，switch 没有对应分支——
   * 一旦被抽中就是白屏。这里补上 render，并且只走显式路径。 */
  PV.reg('layout', 'title', {
    nm: '标题', sp: 1,
    render: function (c) {
      var song = (document.querySelector('.np-title') || {}).textContent || '';
      return '<div class="tt">' + (c.text || song || '—') + '</div>' +
        '<div class="sb">' + ((document.querySelector('.np-artist') || {}).textContent || 'NOW PLAYING') + '</div>';
    }
  });

  PV.reg('layout', 'interlude', {
    nm: '间奏', sp: 1,
    render: function (c) {
      var mm = Math.floor((c.line && c.line.time || 0) / 60000), ss = Math.floor(((c.line && c.line.time || 0) / 1000) % 60);
      var v = String(mm).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
      if (PV.rnd(1) < 0.5) {
        return '<div class="dg"></div><div class="ct2">' + v + '</div>';
      }
      return '<svg viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet">' +
        [60, 110, 160, 200].map(function (r) { return '<circle cx="200" cy="200" r="' + r + '"/>'; }).join('') +
        '</svg><div class="nt">INTERLUDE</div>';
    }
  });
})();

/* PV 引擎 · 03 登场层 enter
 * 只动 i.jv-t（内层）。版式写在外层 .jv-w 上的 transform 不受影响。
 * 一律用 WAAPI（el.animate），fill:both 保证停稳在终态。
 */
(function () {
  'use strict';
  var PV = window.PV;

  /* 统一跑一条动画并登记取消。
   * c.tempo 是引擎算的时长收缩系数（本段太短时一并缩时长），不读它就等于
   * 引擎收了个空——件自己该多快还多快。 */
  function ani(c, el, kf, opt) {
    if (!el.animate) {                         // 极端降级：直接终态
      Object.keys(kf[kf.length - 1] || {}).forEach(function (p) {
        if (p !== 'offset') el.style[p] = kf[kf.length - 1][p];
      });
      return;
    }
    if (opt && opt.duration != null && c && c.tempo && c.tempo < 1)
      opt = Object.assign({}, opt, { duration: Math.max(90, Math.round(opt.duration * c.tempo)) });
    var a = el.animate(kf, opt);
    PV.addStop(function () { try { a.cancel(); } catch (e) { } });
  }

  function each(c, els, kf, opt, stagger, base) {
    var st = c.stagger == null ? 45 : c.stagger;
    if (stagger != null) st = stagger;
    els.forEach(function (el, i) {
      var o = Object.assign({ delay: (base || 0) + i * st, fill: 'both', easing: 'cubic-bezier(.22,1,.36,1)' }, opt || {});
      ani(c, el, kf, o);
    });
  }

  PV.reg('enter', 'none', { nm: '直出', dur: 0, staggerOf: 1, apply: function () { } });

  /* 旧实现唯一的入场：逐字淡入 + 上移一个 em（jzWin → rise，参数原样） */
  PV.reg('enter', 'rise', {
    nm: '升起', tags: ['calm', 'pop', 'graphic', 'editorial'], w: 1.3, dur: 500, staggerOf: 1,
    apply: function (c, els) {
      each(c, els, [{ opacity: 0, transform: 'translateY(.5em)' }, { opacity: 1, transform: 'none' }], { duration: 500 });
    }
  });

  PV.reg('enter', 'fade', {
    nm: '淡入', tags: ['calm', 'emotional'], w: 0.9, dur: 620, staggerOf: 0.5,
    apply: function (c, els) {
      each(c, els, [{ opacity: 0 }, { opacity: 1 }], { duration: 620, easing: 'ease-out' }, Math.max(18, (c.stagger || 45) * 0.5));
    }
  });

  PV.reg('enter', 'drop', {
    nm: '落下', tags: ['pop', 'graphic'], w: 1, dur: 560, staggerOf: 1,
    apply: function (c, els) {
      each(c, els, [
        { opacity: 0, transform: 'translateY(-.7em) scale(1.12)' },
        { opacity: 0.6, transform: 'translateY(.12em) scale(.99)', offset: 0.62 },
        { opacity: 1, transform: 'none' }
      ], { duration: 560, easing: 'cubic-bezier(.3,1.4,.5,1)' });
    }
  });

  PV.reg('enter', 'zoomIn', {
    nm: '放大落定', tags: ['emotional', 'pop'], w: 0.9, dur: 480, staggerOf: 0.45,
    apply: function (c, els) {
      each(c, els, [{ opacity: 0, transform: 'scale(1.85)' }, { opacity: 1, transform: 'scale(1)' }],
        { duration: 480, easing: 'cubic-bezier(.16,.9,.3,1)' }, Math.max(14, (c.stagger || 45) * 0.45));
    }
  });

  PV.reg('enter', 'wipe', {
    nm: '擦出', tags: ['editorial', 'graphic'], w: 0.9, dur: 420, staggerOf: 0.6,
    fit: function (c) { return c.tokens.length <= 26; },
    apply: function (c, els) {
      each(c, els, [{ opacity: 0, clipPath: 'inset(0 100% 0 0)' }, { opacity: 1, clipPath: 'inset(0 0 0 0)' }],
        { duration: 420, easing: 'cubic-bezier(.4,0,.2,1)' }, Math.max(22, (c.stagger || 45) * 0.6));
    }
  });

  PV.reg('enter', 'blur', {
    nm: '聚焦', tags: ['calm', 'emotional'], w: 0.8, dur: 540, staggerOf: 0.55,
    when: function () { return PV.fx.motion >= 0; },
    apply: function (c, els) {
      each(c, els, [{ opacity: 0, filter: 'blur(9px)' }, { opacity: 1, filter: 'blur(0)' }],
        { duration: 540, easing: 'ease-out' }, Math.max(20, (c.stagger || 45) * 0.55));
    }
  });

  /* 砸入：紧 stagger + 缩放过冲，整行像被拍到屏幕上 */
  PV.reg('enter', 'slam', {
    nm: '砸入', tags: ['pop', 'graphic', 'glitch'], w: 1, dur: 260, staggerOf: 0.4,
    apply: function (c, els) {
      each(c, els, [
        { opacity: 0, transform: 'scale(2.1) rotate(-2deg)' },
        { opacity: 1, transform: 'scale(.97)', offset: 0.55 },
        { opacity: 1, transform: 'none' }
      ], { duration: 260, easing: 'cubic-bezier(.2,.9,.2,1)' }, 18);
    }
  });

  /* 乱码定格：先滚本行自己的字 + 符号，逐字落定 */
  var SYM = '＊＋◇○△□※';
  PV.reg('enter', 'scramble', {
    nm: '乱码定格', tags: ['glitch', 'graphic'], w: 0.8, dur: 90, staggerOf: 1,
    fit: function (c) { return c.tokens.length <= 24; },
    apply: function (c, els) {
      var pool = (c.text || '').replace(/\s/g, '').split('').concat(SYM.split(''));
      if (!pool.length || !els.length) return;
      var st = c.stagger == null ? 45 : c.stagger;
      var t0 = performance.now(), done = [], raf = 0;
      els.forEach(function (el, i) { el._final = el.textContent; done[i] = false; });
      /* 一条 rAF 看完一整行，切行时一次取消——旧写法每字一条链，取消只记得住最后一个 */
      var tick = function () {
        var d = performance.now() - t0, alive = false;
        for (var i = 0; i < els.length; i++) {
          if (done[i]) continue;
          alive = true;
          if (d >= 90 + i * st) { els[i].textContent = els[i]._final; done[i] = true; continue; }
          if (Math.floor(d / 46) !== Math.floor((d - 16) / 46)) els[i].textContent = pool[Math.floor(Math.random() * pool.length)];
        }
        if (alive) raf = requestAnimationFrame(tick);
      };
      tick();
      PV.addStop(function () { if (raf) cancelAnimationFrame(raf); });
    }
  });
})();

/* PV 引擎 · 04 保持层 hold
 * 行说完之前画面得活着。写在外层 .jv-w 或整行容器上，避开登场层的 i.jv-t。
 * frame(c) 由全局一条 rAF 驱动，c.lt = 本 cut 已过的秒数。
 */
(function () {
  'use strict';
  var PV = window.PV;

  /* 量化随机时钟：24Hz 以内的整数步，抖动才不会糊成噪声 */
  function stepClock(hz) {
    return Math.floor(performance.now() / (1000 / (hz || 12)));
  }
  function sr(n) { var x = Math.sin(n * 12.9898) * 43758.5453; return x - Math.floor(x); }

  PV.reg('hold', 'none', { nm: '静止', w: 0.6 });

  PV.reg('hold', 'breathe', {
    nm: '呼吸', tags: ['calm', 'emotional'], w: 1,
    frame: function (c) {
      var k = 1 + Math.sin(c.lt * 1.5) * (0.004 + 0.011 * PV.fx.motion);
      c.el.style.transform = PV.tfScale(k);
    }
  });

  PV.reg('hold', 'sway', {
    nm: '轻摆', tags: ['pop', 'calm', 'emotional'], w: 1,
    when: function (c) { return PV.fx.motion > 0.18; },
    apply: function (c) {
      c._w = Array.prototype.slice.call(c.el.querySelectorAll('.jv-w'));
    },
    frame: function (c) {
      var ws = c._w || (c._w = Array.prototype.slice.call(c.el.querySelectorAll('.jv-w')));
      var amp = 1.6 + 5.5 * PV.fx.motion;
      for (var i = 0; i < ws.length; i++) {
        var p = Math.sin(c.lt * 2.1 + i * 0.55);
        ws[i].style.translate = (p * amp * 0.35).toFixed(2) + 'px ' + (p * amp).toFixed(2) + 'px';
      }
    }
  });

  PV.reg('hold', 'wave', {
    nm: '起伏', tags: ['pop', 'graphic'], w: 0.9,
    when: function (c) { return PV.fx.motion > 0.45; },
    apply: function (c) { c._w = Array.prototype.slice.call(c.el.querySelectorAll('.jv-w')); },
    frame: function (c) {
      var ws = c._w || [];
      var amp = 3 + 9 * PV.fx.motion;
      for (var i = 0; i < ws.length; i++) {
        ws[i].style.translate = '0 ' + (Math.sin(c.lt * 3.1 + i * 0.42) * amp).toFixed(2) + 'px';
      }
    }
  });

  PV.reg('hold', 'jitter', {
    nm: '抖动', tags: ['glitch', 'horror'], w: 0.9,
    when: function () { return PV.fx.glitch > 0.18; },
    apply: function (c) { c._w = Array.prototype.slice.call(c.el.querySelectorAll('.jv-w')); },
    frame: function (c) {
      var g = PV.fx.glitch, s = stepClock(10 + 14 * g);
      var amp = g * (2 + 5 * PV.fx.motion);
      var ws = c._w || [];
      for (var i = 0; i < ws.length; i++) {
        var dx = (sr(s * 7 + i * 31) - 0.5) * amp * 2;
        var dy = (sr(s * 11 + i * 17) - 0.5) * amp;
        ws[i].style.translate = dx.toFixed(2) + 'px ' + dy.toFixed(2) + 'px';
      }
    }
  });

  PV.reg('hold', 'drift', {
    nm: '漂移', tags: ['graphic', 'editorial', 'calm'], w: 0.8,
    /* 写 --drift-* 而不是 style.translate：那个位置已经给装配守卫占了，
     * 两个写手抢同一个属性就会互相闪。 */
    frame: function (c) {
      var d = 1.4 + 3.6 * PV.fx.motion;
      c.el.style.setProperty('--drift-x', (Math.sin(c.lt * 0.34) * d).toFixed(2) + 'px');
      c.el.style.setProperty('--drift-y', (Math.cos(c.lt * 0.27) * d * 0.6).toFixed(2) + 'px');
    }
  });

  PV.reg('hold', 'pulse', {
    nm: '拍脉', tags: ['pop', 'glitch', 'graphic'], w: 1,
    when: function () { return !!(PV.audio.beat || PV.audio.energy != null); },
    frame: function (c) {
      var b = PV.audio.beat, e = PV.audio.energy;
      var k = 0;
      if (b && b.len) k = Math.max(0, 1 - b.since / (b.len * 0.55));
      else if (e != null) k = e;
      var s = 1 + k * (0.012 + 0.05 * PV.fx.motion);
      c.el.style.transform = PV.tfScale(s);
    }
  });
})();


/* PV 引擎 · 05 退场层 exit
 * play(ctx, el, drop)：把上一行送走，动画收尾必须调 drop()（引擎负责摘掉元素）。
 * 旧实现没有这一层——innerHTML 直接覆盖，所以「退场」一直是零。
 */
(function () {
  'use strict';
  var PV = window.PV;

  function tk(el) { return Array.prototype.slice.call(el.querySelectorAll('.jv-t')); }
  function after(ms, fn) { var t = setTimeout(fn, ms); return function () { clearTimeout(t); }; }

  PV.reg('exit', 'none', {
    nm: '直切', w: 1.1,
    play: function (c, el, drop) { drop(); }
  });

  PV.reg('exit', 'fade', {
    nm: '淡出', tags: ['calm', 'emotional', 'editorial'], w: 1,
    play: function (c, el, drop) {
      var d = 260 + 220 * PV.fx.motion;
      el.classList.add('jv-out');
      if (el.animate) el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: d, fill: 'both', easing: 'ease-in' });
      PV.addStop(after(d, drop));
    }
  });

  /* 逐字散开：每字一个随机方向，配微旋转 */
  PV.reg('exit', 'scatter', {
    nm: '吹散', tags: ['emotional', 'pop', 'graphic'], w: 1,
    when: function (c) { return c.tokens.length <= 34; },
    play: function (c, el, drop) {
      var els = tk(el), dur = 380 + 200 * PV.fx.motion;
      els.forEach(function (e, i) {
        var a = Math.random() * Math.PI * 2, r = 20 + Math.random() * 70;
        if (e.animate) e.animate([
          { opacity: 1, transform: 'none' },
          { opacity: 0, transform: 'translate(' + (Math.cos(a) * r).toFixed(1) + 'px,' + (Math.sin(a) * r).toFixed(1) + 'px) rotate(' + (a * 30).toFixed(0) + 'deg) scale(.8)' }
        ], { duration: dur, delay: i * 8, fill: 'both', easing: 'cubic-bezier(.4,0,.6,1)' });
      });
      PV.addStop(after(dur + els.length * 8 + 30, drop));
    }
  });

  /* 爆散：先顿一下再炸开，落在拍点上更狠 */
  PV.reg('exit', 'burst', {
    nm: '爆散', tags: ['pop', 'glitch', 'graphic'], w: 0.9,
    when: function () { return PV.fx.motion > 0.35; },
    play: function (c, el, drop) {
      var els = tk(el);
      if (el.animate) el.animate([{ opacity: 1, transform: 'scale(1)' }, { opacity: 1, transform: 'scale(1.06)', offset: 0.18 }, { opacity: 0, transform: 'scale(1.16)' }],
        { duration: 300, fill: 'both', easing: 'steps(3,end)' });
      els.forEach(function (e, i) {
        var a = Math.random() * Math.PI * 2, r = 60 + Math.random() * 180;
        if (e.animate) e.animate([
          { opacity: 1, transform: 'none' },
          { opacity: 1, transform: 'translate(' + (Math.cos(a) * r * 0.3).toFixed(1) + 'px,' + (Math.sin(a) * r * 0.3).toFixed(1) + 'px)', offset: 0.3 },
          { opacity: 0, transform: 'translate(' + (Math.cos(a) * r).toFixed(1) + 'px,' + (Math.sin(a) * r).toFixed(1) + 'px) scale(.4)' }
        ], { duration: 420, delay: i * 6, fill: 'both', easing: 'cubic-bezier(.1,.7,.3,1)' });
      });
      PV.addStop(after(460, drop));
    }
  });

  /* 切片错位：整行切成几横条各自滑走 */
  PV.reg('exit', 'slice', {
    nm: '切片', tags: ['glitch', 'graphic'], w: 0.8,
    when: function () { return PV.fx.glitch > 0.3; },
    play: function (c, el, drop) {
      var n = 4, h = 100 / n;
      for (var i = 0; i < n; i++) {
        var b = document.createElement('div');
        b.className = 'jv-slice';
        b.style.top = (i * h) + '%';
        b.style.height = h + '%';
        b.style.clipPath = 'inset(' + (i * h) + '% 0 ' + (100 - (i + 1) * h) + '% 0)';
        b.textContent = el.textContent;
        el.appendChild(b);
        if (b.animate) b.animate([{ transform: 'none', opacity: 1 }, { transform: 'translateX(' + (i % 2 ? 40 : -40) + '%)', opacity: 0 }],
          { duration: 280, fill: 'both', easing: 'cubic-bezier(.5,0,.9,.4)' });
      }
      Array.prototype.forEach.call(tk(el), function (e) { e.style.opacity = '0'; });
      PV.addStop(after(300, drop));
    }
  });

  /* 故障闪灭：抖三下再断 */
  PV.reg('exit', 'glitchOut', {
    nm: '闪灭', tags: ['glitch', 'horror'], w: 0.8,
    when: function () { return PV.fx.glitch > 0.45; },
    play: function (c, el, drop) {
      if (el.animate) el.animate([
        { opacity: 1, transform: 'none' },
        { opacity: 1, transform: 'translate(-3%,1%) skewX(6deg)', offset: 0.2 },
        { opacity: .25, transform: 'translate(4%,-2%) skewX(-8deg)', offset: 0.4 },
        { opacity: 1, transform: 'none', offset: 0.6 },
        { opacity: 0, transform: 'translate(-6%,0) scaleY(.4)' }
      ], { duration: 320, fill: 'both', easing: 'steps(6,end)' });
      PV.addStop(after(330, drop));
    }
  });

  /* 掉落：逐字加速坠出画面 */
  PV.reg('exit', 'smash', {
    nm: '坠出', tags: ['pop', 'graphic', 'emotional'], w: 0.9,
    when: function (c) { return c.tokens.length <= 30; },
    play: function (c, el, drop) {
      var els = tk(el);
      els.forEach(function (e, i) {
        if (e.animate) e.animate([
          { opacity: 1, transform: 'none' },
          { opacity: 1, transform: 'translateY(-.18em)', offset: 0.22 },
          { opacity: 0, transform: 'translateY(1.6em) rotate(' + (Math.random() * 24 - 12).toFixed(0) + 'deg)' }
        ], { duration: 420, delay: i * 26, fill: 'both', easing: 'cubic-bezier(.6,0,.9,.4)' });
      });
      PV.addStop(after(430 + els.length * 26, drop));
    }
  });
})();

/* PV 引擎 · 06 镜头层 camera
 * 动的是 .jv-track（整屏），所以镜头与版式互不抢占。
 * 旧实现根本没有镜头层，而且 fix-jizura-layout 用 transform:none !important
 * 把 track 焊死了——那条规则已在迁移时删掉。
 */
(function () {
  'use strict';
  var PV = window.PV;

  function sr(n) { var x = Math.sin(n * 78.233) * 43758.5453; return x - Math.floor(x); }

  /* 本 cut 走到哪了：有行时长就按时长，没歌词时序时退化成 4 秒 */
  function prog(c) {
    var l = c.line || {};
    var d = (l.end && l.time && l.end > l.time) ? Math.max(0.6, (l.end - l.time) / 1000) : 4;
    return Math.min(1, Math.max(0, c.lt / d));
  }
  PV.prog = prog;

  PV.reg('camera', 'none', { nm: '固定', w: 0.8 });

  /* 缓推：整行时长里慢慢压近一点 */
  PV.reg('camera', 'pushIn', {
    nm: '缓推', tags: ['calm', 'emotional', 'editorial'], w: 1,
    apply: function (c) {
      c._cam = { dir: 1, k: 0.022 + 0.055 * PV.fx.motion, rot: (PV.rnd(2) - 1) * 0.5 };
    },
    frame: function (c) {
      var m = c._cam || (c._cam = { k: 0.04, rot: 0 });
      var p = prog(c);
      c.track.style.transform = PV.tfScale(1 + m.k * p, 'rotate(' + (m.rot * p).toFixed(2) + 'deg)');
    }
  });

  PV.reg('camera', 'pullOut', {
    nm: '缓拉', tags: ['calm', 'emotional'], w: 0.9,
    apply: function (c) { c._cam = { k: 0.03 + 0.05 * PV.fx.motion }; },
    frame: function (c) {
      var m = c._cam || { k: 0.04 };
      c.track.style.transform = PV.tfScale(1 + m.k * (1 - prog(c)));
    }
  });

  /* 横移：往一个方向慢慢飘，幅度小 */
  PV.reg('camera', 'pan', {
    nm: '横移', tags: ['graphic', 'editorial', 'pop'], w: 0.9,
    apply: function (c) { c._cam = { x: (PV.rnd(2) < 1 ? -1 : 1) * (0.8 + 2.2 * PV.fx.motion), rot: (PV.rnd(2) - 1) * 0.9 }; },
    frame: function (c) {
      var m = c._cam || { x: 1, rot: 0 };
      var p = prog(c);
      c.track.style.transform = PV.tfMove(m.x * p * 10, 0, 'rotate(' + (m.rot * p).toFixed(2) + 'deg)');
    }
  });

  /* 荷兰角：歪着拍，配轻微呼吸 */
  PV.reg('camera', 'dutch', {
    nm: '荷兰角', tags: ['graphic', 'pop', 'emotional'], w: 0.8,
    apply: function (c) { c._cam = { a: (PV.rnd(2) < 1 ? -1 : 1) * (1.5 + 4.5 * PV.fx.motion) }; },
    frame: function (c) {
      var m = c._cam || { a: 3 };
      c.track.style.transform = PV.tfScale(1.035, 'rotate(' + m.a.toFixed(2) + 'deg)');
    }
  });

  /* 手持：量化随机抖，跟 motion 走 */
  PV.reg('camera', 'handheld', {
    nm: '手持', tags: ['pop', 'emotional', 'glitch', 'horror'], w: 0.9,
    when: function () { return PV.fx.motion > 0.4; },
    frame: function (c) {
      var s = Math.floor(performance.now() / 90);
      var a = PV.fx.motion * 3.2;
      var dx = (sr(s) - 0.5) * a, dy = (sr(s + 91) - 0.5) * a, dr = (sr(s + 17) - 0.5) * a * 0.35;
      c.track.style.transform = PV.tfMove(dx, dy, 'rotate(' + dr.toFixed(2) + 'deg)');
    }
  });

  /* 拍震：有音频数据才开——③ 接 analyser 之前不会中签 */
  PV.reg('camera', 'beatZoom', {
    nm: '拍震', tags: ['pop', 'glitch', 'graphic'], w: 1,
    when: function () { return !!(PV.audio.beat || PV.audio.energy != null); },
    frame: function (c) {
      var b = PV.audio.beat, e = PV.audio.energy, k = 0;
      if (b && b.len) k = Math.max(0, 1 - b.since / (b.len * 0.5));
      else if (e != null) k = e;
      var s = 1 + k * (0.015 + 0.06 * PV.fx.motion);
      c.track.style.transform = PV.tfScale(s);
    }
  });

  /* 升降：一边推近一边上移 */
  PV.reg('camera', 'crane', {
    nm: '升降', tags: ['editorial', 'calm', 'emotional'], w: 0.7,
    apply: function (c) { c._cam = { y: PV.rnd(2) < 1 ? -1 : 1 }; },
    frame: function (c) {
      var m = c._cam || { y: -1 };
      var p = prog(c);
      c.track.style.transform = PV.tfMove(0, m.y * p * 16, 'scale(' + (1 + 0.03 * p).toFixed(4) + ')');
    }
  });
})();



/* PV 引擎 · 07 衔接层 transition
 * play(ctx, prev, next, swap)：决定新行什么时候上、怎么上。
 * prev 怎么送走属于退场层，不在这里抢；只有 overlap 类需要 transition 自己按住 prev。
 * 旧实现等于这里的 cut——innerHTML 直接覆盖。
 */
(function () {
  'use strict';
  var PV = window.PV;

  function an(el, kf, opt) {
    if (!el || !el.animate) return null;
    var a = el.animate(kf, opt);
    PV.addStop(function () { try { a.cancel(); } catch (e) { } });
    return a;
  }

  PV.reg('transition', 'cut', {
    nm: '硬切', w: 1,
    play: function (c, prev, next, swap) { swap(); }
  });

  PV.reg('transition', 'fade', {
    nm: '叠化', tags: ['calm', 'emotional', 'editorial'], w: 1,
    play: function (c, prev, next, swap) {
      swap();
      an(next, [{ opacity: 0 }, { opacity: 1 }], { duration: 300 + 220 * PV.fx.motion, fill: 'both', easing: 'ease-out' });
    }
  });

  PV.reg('transition', 'wipe', {
    nm: '擦入', tags: ['graphic', 'pop', 'editorial'], w: 0.9,
    play: function (c, prev, next, swap) {
      var dir = PV.rnd(4);
      var from = ['inset(0 100% 0 0)', 'inset(0 0 0 100%)', 'inset(100% 0 0 0)', 'inset(0 0 100% 0)'][dir];
      swap();
      an(next, [{ clipPath: from, opacity: 1 }, { clipPath: 'inset(0 0 0 0)', opacity: 1 }],
        { duration: 320 + 180 * PV.fx.motion, fill: 'both', easing: 'cubic-bezier(.5,0,.2,1)' });
    }
  });

  PV.reg('transition', 'push', {
    nm: '推入', tags: ['pop', 'graphic'], w: 0.9,
    play: function (c, prev, next, swap) {
      var horiz = PV.rnd(2) < 1;
      var dx = horiz ? (PV.rnd(2) < 1 ? 46 : -46) : 0;
      var dy = horiz ? 0 : (PV.rnd(2) < 1 ? 42 : -42);
      swap();
      an(next, [{ transform: 'translate(' + dx + 'vw,' + dy + 'vh)' }, { transform: 'none' }],
        { duration: 360 + 160 * PV.fx.motion, fill: 'both', easing: 'cubic-bezier(.2,.9,.25,1)' });
      if (prev) an(prev, [{ transform: 'none', opacity: 1 }, { transform: 'translate(' + (-dx * 0.55) + 'vw,' + (-dy * 0.55) + 'vh)', opacity: .25 }],
        { duration: 360, fill: 'both', easing: 'ease-out' });
    }
  });

  PV.reg('transition', 'zoomThrough', {
    nm: '穿越', tags: ['pop', 'emotional', 'glitch'], w: 0.85,
    when: function () { return PV.fx.motion > 0.25; },
    play: function (c, prev, next, swap) {
      swap();
      an(next, [{ transform: 'scale(1.34)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }],
        { duration: 420, fill: 'both', easing: 'cubic-bezier(.16,.86,.32,1)' });
      if (prev) an(prev, [{ transform: 'none', opacity: 1 }, { transform: 'scale(1.3)', opacity: 0 }],
        { duration: 300, fill: 'both', easing: 'ease-in' });
    }
  });

  PV.reg('transition', 'iris', {
    nm: '光圈', tags: ['calm', 'graphic', 'editorial'], w: 0.7,
    play: function (c, prev, next, swap) {
      swap();
      an(next, [{ clipPath: 'circle(3% at 50% 50%)', opacity: 1 }, { clipPath: 'circle(78% at 50% 50%)', opacity: 1 }],
        { duration: 480, fill: 'both', easing: 'cubic-bezier(.3,.7,.3,1)' });
    }
  });

  PV.reg('transition', 'whip', {
    nm: '甩镜', tags: ['pop', 'glitch', 'graphic'], w: 0.8,
    when: function () { return PV.fx.motion > 0.5; },
    play: function (c, prev, next, swap) {
      var sgn = PV.rnd(2) < 1 ? 1 : -1;
      swap();
      an(next, [
        { transform: 'translateX(' + (sgn * 22) + 'vw) skewX(' + (sgn * 9) + 'deg)', filter: 'blur(7px)', opacity: .2 },
        { transform: 'translateX(' + (sgn * 3) + 'vw) skewX(' + (sgn * 2) + 'deg)', filter: 'blur(2px)', opacity: 1, offset: .6 },
        { transform: 'none', filter: 'blur(0)', opacity: 1 }
      ], { duration: 340, fill: 'both', easing: 'cubic-bezier(.2,.8,.3,1)' });
    }
  });

  PV.reg('transition', 'flash', {
    nm: '白闪', tags: ['glitch', 'pop', 'graphic', 'horror'], w: 0.9,
    impact: 1,
    when: function (c) { return PV.fx.glitch > 0.12 || PV.fx.motion > 0.55 || !!(c && c.flash); },
    play: function (c, prev, next, swap) {
      swap();
      var layer = PV.layer();
      if (!layer) return;
      var f = document.createElement('div');
      f.className = 'jv-flash' + (PV.fx.glitch > 0.5 ? ' hard' : '');
      layer.appendChild(f);
      var t = setTimeout(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 150);
      PV.addStop(function () { clearTimeout(t); if (f.parentNode) f.parentNode.removeChild(f); });
      if (f.animate) f.animate([{ opacity: .85 }, { opacity: 0 }], { duration: 150, fill: 'both', easing: 'steps(2,end)' });
    }
  });

  PV.reg('transition', 'blur', {
    nm: '虚接', tags: ['calm', 'emotional'], w: 0.8,
    play: function (c, prev, next, swap) {
      swap();
      an(next, [{ filter: 'blur(12px)', opacity: 0 }, { filter: 'blur(0)', opacity: 1 }],
        { duration: 460, fill: 'both', easing: 'ease-out' });
    }
  });
})();

/* PV 引擎 · 08 装饰与处理层 decor / treatment
 * decor：可叠加 0..n 件的附加图形，apply(ctx, lineEl) 返回 cleanup
 * treatment：按帧处理（扫光等），frame(ctx) 由全局 rAF 驱动
 */
(function () {
  'use strict';
  var PV = window.PV;

  /* ================= decor ================= */
  PV.reg('decor', 'none', { nm: '无' });

  /* 全局粒子层：从 inject-ambient 搬来，参数原样（14 粒，30% 为方块描边） */
  PV.reg('decor', 'particles', {
    nm: '粒子', tags: ['calm', 'emotional', 'pop'], w: 1,
    when: function () { return PV.fx.decor > 0.2; },
    apply: function (c) {
      var layer = PV.layer();
      if (!layer) return null;
      var pl = layer.querySelector('.jv-particles');
      if (!pl) {
        pl = document.createElement('div');
        pl.className = 'jv-d jv-particles';
        if (!pl.childElementCount) {
          for (var pi = 0; pi < 14; pi++) {
            var sp = document.createElement('i');
            var sz = (2 + Math.random() * 4).toFixed(1);
            sp.style.width = sz + 'px'; sp.style.height = sz + 'px';
            sp.style.left = (Math.random() * 96).toFixed(1) + '%';
            sp.style.top = (10 + Math.random() * 80).toFixed(1) + '%';
            sp.style.animationDuration = (7 + Math.random() * 9).toFixed(1) + 's';
            sp.style.animationDelay = (-Math.random() * 10).toFixed(1) + 's';
            if (Math.random() < 0.3) sp.className = 'sq';
            pl.appendChild(sp);
          }
        }
        layer.appendChild(pl);
      }
      var n = Math.max(0, Math.round(14 * PV.fx.density));
      Array.prototype.forEach.call(pl.children, function (el2, i) { el2.style.display = i < n ? '' : 'none'; });
      return null;
    }
  });

  /* 边角 HUD：坐标环 + 行号，够安静，给画面一个"被记录"的边 */
  PV.reg('decor', 'hud', {
    nm: 'HUD', tags: ['graphic', 'editorial', 'glitch'], w: 0.8,
    when: function () { return PV.fx.decor > 0.5; },
    apply: function (c) {
      var line = c.el;
      if (!line || line.querySelector('.jv-hud')) return null;
      var d = document.createElement('div');
      /* jv-d 带 horizontal-tb：不带就会被竖写版式把整块子层带走方向（⑤ 修了 HUD，这轮补上引线） */
      d.className = 'jv-d jv-hud';
      d.innerHTML = '<span class="no">No.' + String((c.idx || 0) + 1).padStart(2, '0') + '</span>' +
        '<span class="tc">TC ' + tc(c.line && c.line.time) + '</span>';
      line.appendChild(d);
      return null;
    }
  });

  function tc(ms) {
    ms = ms || 0;
    var m = Math.floor(ms / 60000), s = Math.floor(ms / 1000) % 60, f = Math.floor((ms % 1000) / 40);
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0') + '.' + String(f).padStart(2, '0');
  }

  /* 细引 lines：左右两条短线把整行夹住 */
  PV.reg('decor', 'rule', {
    nm: '引线', tags: ['editorial', 'calm', 'graphic'], w: 0.7,
    when: function () { return PV.fx.decor > 0.5 && c_short(); },
    apply: function (c) {
      if (!c.el || c.el.querySelector('.jv-rules')) return null;
      var d = document.createElement('div');
      d.className = 'jv-d jv-rules';
      d.innerHTML = '<i></i><i></i>';
      c.el.appendChild(d);
      return null;
    }
  });
  function c_short() { return !PV.plan() || (PV.plan().ctx.tokens || []).length <= 18; }

  /* ================= treatment ================= */
  /* 逐字扫光（folia 的 MonetGlow 包络：smoothstep 升起→驻留→衰减）。
   * 时序优先 TTML 的 words，没有就按行起止均分。frame 型件：全局一条 rAF。 */
  PV.reg('treatment', 'sweep', {
    nm: '逐字扫光', w: 1,
    frame: function (c) {
      var els = c.tokensEls;
      if (!els || !els.length) return;
      var line = c.line || {}, toks = c.tokens || [];
      /* 时间源：有外部推值（PV.audio.time，预览台与③的音频链都用它）就用它，
       * 否则回落到 DOM 里的 <audio>。扫光不再自己读时钟，才能被驱动。 */
      var ms = PV.audio.time;
      if (ms == null) {
        var audio = document.querySelector('audio');
        if (!audio) return;
        ms = audio.currentTime * 1000;
      }
      var offs = [], acc = 0;
      toks.forEach(function (tk) { offs.push(acc); acc += tk === ' ' ? 1 : Array.from(tk).length; });
      var total = Math.max(1, acc);
      var next = PV.lyrics()[c.idx + 1];
      var whole = (c.cutN || 1) <= 1;      /* 有 cut（④）时用本段自己的时间窗；TTML 逐词时序只在整行不被切开时有效 */
      var t0 = !whole && c.t0 != null ? c.t0 : (line.time || 0);
      var t1 = !whole && c.t1 != null ? c.t1 : (line.end || (next && next.time) || (t0 + 4000));
      if (line.words && line.words.length && whole) {
        t0 = line.words[0].time;
        t1 = line.words[line.words.length - 1].time + line.words[line.words.length - 1].dur;
      }
      var span = Math.max(1, t1 - t0);
      var now = ms;
      for (var i = 0; i < els.length; i++) {
        var len = toks[i] === ' ' ? 1 : Array.from(toks[i]).length;
        var w0 = t0 + span * (offs[i] / total), w1 = t0 + span * ((offs[i] + len) / total);
        var el = els[i];
        if (now < w0) { el.style.color = 'color-mix(in srgb,var(--jv-fg) 38%,transparent)'; el.style.textShadow = 'none'; }
        else if (now > w1) { el.style.color = ''; el.style.textShadow = 'none'; }
        else {
          var p = (now - w0) / Math.max(1, w1 - w0);
          var glow = p * p * (3 - 2 * p);
          el.style.color = 'var(--jv-acc)';
          el.style.textShadow = '0 0 ' + (6 + 16 * glow).toFixed(1) + 'px var(--jv-acc), 0 0 ' + (2 + 5 * glow).toFixed(1) + 'px var(--jv-fg)';
        }
      }
    }
  });

  /* 色偏残影：整行三趟（青/红错位复制），chroma 滑块推它 */
  PV.reg('treatment', 'chroma', {
    nm: '色偏', tags: ['glitch', 'pop', 'graphic'], w: 0.9,
    when: function () { return PV.fx.chroma > 0.25; },
    apply: function (c) {
      var src = c.el;
      if (!src) return null;
      /* 整行克隆预算：衔接层已经拿走了残影名额（trail 正在拷上一行）时，
       * 这件就不拷了——两层同文字叠加就是用户报的 B 类重叠。*/
      if (PV.requestGhost && !PV.requestGhost('chroma')) return null;
      var d = (1 + 3.4 * PV.fx.chroma).toFixed(2);
      /* 只剩一层残影。原来是两层（青、红各一份整行副本）——那就是用户说的
       * 「歌词都重叠到一起」：chroma 高时两层透明度到 .58，看着就是第二行字。
       * 双色错位用一层就足够读到，不想碰 text-shadow 是因为那是 ⑩ 外观层的地盘。*/
      var g1 = clone(src, 'jv-ghostA', d + 'px ' + (-d) + 'px', 'color-mix(in srgb,var(--jv-acc) 70%,#0ff)');
      var g2 = null;
      function clone(el, cls, tr, col) {
        var n = el.cloneNode(true);
        n.className = el.className + ' ' + cls;
        n.setAttribute('aria-hidden', 'true');
        Array.prototype.forEach.call(n.querySelectorAll('.jv-t'), function (t) { t.style.color = col; t.style.textShadow = 'none'; });
        n.style.transform = 'translate(' + tr + ')';
        n.style.opacity = String(Math.min(.34, 0.18 + 0.2 * PV.fx.chroma));   /* 残影是色边，不是第二行歌词：上限 .34 */
        el.parentNode.insertBefore(n, el);
        return n;
      }
      return function () {
        [g1, g2].forEach(function (n) { if (n && n.parentNode) n.parentNode.removeChild(n); });
        if (PV.releaseGhost) PV.releaseGhost('chroma');
      };
    }
  });

  /* 扫描线 + 纸纹：texture 滑块推它，整层一片，不随 cut 重建 */
  PV.reg('treatment', 'grain', {
    nm: '纹理', tags: ['editorial', 'graphic', 'glitch', 'calm'], w: 0.7,
    when: function () { return PV.fx.texture > 0.2; },
    apply: function () {
      var layer = PV.layer();
      if (!layer) return null;
      var g = layer.querySelector('.jv-texture');
      if (!g) {
        g = document.createElement('div');
        g.className = 'jv-texture';
        layer.appendChild(g);
      }
      g.style.opacity = (0.08 + 0.4 * PV.fx.texture).toFixed(3);
      return null;
    }
  });
})();

/* PV 引擎 · 04 舞台附件（骰子 / 标签 / 前后行 ghost / 风格条）
 * 全部挂在 #pvJv 内部，所以 CSS 只要 .pv-jv{display:none} 就能一起收起，
 * 不再需要旧那套 body:not(.jizura-mode) .jizura-* {display:none!important}。
 */
(function () {
  'use strict';
  var PV = window.PV;

  PV.mountChrome = function () {
    var layer = PV.layer();
    if (!layer) return null;
    var S = PV.S;
    if (layer.querySelector('.jv-dice')) {
      S.tag = layer.querySelector('.jv-tag');
      S.ghosts = { up: layer.querySelector('.jv-ghost.up'), dn: layer.querySelector('.jv-ghost.dn') };
      return layer;
    }

    var tag = document.createElement('div');
    tag.className = 'jv-tag';
    tag.textContent = 'LAYOUT · —';
    /* 默认不出现（PV.tagOn=false），要看按 T。不再做“点一下循环三态”：
     * 既然平时不显示，那个可点区域就是个没人会发现而且会误触的隐形控件。*/
    tag.title = '配牌读数（按 T 开关）：版式 · 字体 · 外观 · 背景 · 气氛 · 第几段 · 音频链';
    layer.appendChild(tag);

    var dice = document.createElement('button');
    dice.className = 'jv-dice';
    dice.type = 'button';
    dice.textContent = '\uD83C\uDFB2';
    dice.title = 'おまかせ（R）— 重掷 seed 与风格';
    dice.addEventListener('click', function (e) { e.stopPropagation(); PV.omakase(); });
    dice.addEventListener('dblclick', function (e) { e.stopPropagation(); });
    layer.appendChild(dice);

    var gu = document.createElement('div'); gu.className = 'jv-ghost up';
    var gd = document.createElement('div'); gd.className = 'jv-ghost dn';
    layer.appendChild(gu); layer.appendChild(gd);

    /* 风格条：读注册表，不再有第二份风格表 */
    var bar = document.createElement('div');
    bar.className = 'jv-bar';
    PV.parts('style').forEach(function (s) {
      var dot = document.createElement('button');
      dot.type = 'button';
      dot.title = s.nm;
      dot.className = 'jv-dot' + (s.id === 'auto' ? ' auto' : '');
      dot.style.setProperty('--d-bg', s.id === 'auto' ? 'var(--card-bg)' : s.bg);

/* PV 引擎 · 05 对外接口与宿主接线
 * 核心只认四样东西：body.jizura-mode、window._jizuraLrcData、
 * window.renderJizuraInit()、window.renderJizuraLine(idx)。
 * 这四个名字保持稳定，核心代码从此不用再改；其余都走 window.PV。
 */
(function () {
  'use strict';
  var PV = window.PV;
  var core = function () { return window.__pvCore || null; };

  PV.idxFromTime = function () {
    var l = PV.lyrics();
    if (!l.length) return -1;

    if (!a) return 0;

    if (PV.audioStart) PV.audioStart();          // ③ 音频驱动：跟着 PV 开，不单独常驻
    if (PV.tuneRestore) PV.tuneRestore();        // ⑲ 把上次选的档位贴回来

    return true;
  };

   * 核心在换歌时是**重新赋值** lrcData（lrcData = parsed），旧数组立刻作废。
   * 而这里以前写的是 `if (!PV.lyrics().length) PV.setLyrics(...)`——只有空表才灌，
   * 于是第一首歌把表灌满之后，换歌永远灌不进来：PV 就拿着上一首的旧数组反复演，
   * 看上去像「歌词被固定住了」，而且行号还是按新曲时间去查旧表——全盘对不上。
   *
   * 现在每帧都对身份：引用不同或首尾签名不同就重灌。同一张表不会重复灌
   * （setLyrics 会清 cut 缓存，重灌就等于重掷版式，所以“只在真变了时变”是必须的）。
   */

    if (PV._tblRef === l && PV._tblSig === sig) return false;   // 同一张表，没动
    PV.setLyrics(l);

    PV.syncTable(c && c.lrc ? c.lrc() : null);
    var i = c && c.idx ? c.idx() : PV.idxFromTime();
    var l = PV.lyrics();
    if (!l.length) { PV.empty('暂无歌词'); return; }

  };

  window.renderJizuraLine = function (idx) {
    if (!PV.boot()) return;
    if (!PV.active()) return;

    if (PV.syncTable(c && c.lrc ? c.lrc() : null)) {
      var l = PV.lyrics();
      if (!l.length) { PV.empty('暂无歌词'); return; }

    if (l.length && i >= 0 && i < l.length) PV.show(i, { force: true });

  };

  /* 只重掷版式（保留风格与歌词时序）——② 的「部分重掷」入口 */
  PV.reroll = function (opts) {

     * 现在直接请核心重画，退出后不会停在上一句 PV。 */
    if (c && c.render) c.render();

    if (e.key === 'r' || e.key === 'R') {

    if (!st || !st.contains(e.target)) return;
    if (e.target.closest && e.target.closest('.jv-dice,.jv-bar,.jv-tag')) return;

  /* 控制台与自检 */
  PV.version = 'pv-registry/0.6';
  /* 核心靠这两个字段判断能不能用 PV：没 PV 块时 window.PV 不存在，
   * 三档胶囊与循环自动降级成两档——lite 包就是「不带 PV 块」，不用改核心 */

  PV.selftest = function () {
    var out = { version: PV.version, groups: PV.stats(), mounted: !!PV.layer() };
    out.demo = [];
    ['主歌的第一句歌词', 'We are the champions', '夜', ''].forEach(function (t, i) {
      var p = PV.demo([t], 0);
      out.demo.push({ text: t || '(空行)', layout: p && p.layout.key, enter: p && p.enter.key });
    });
    return out;
  };
})();

 * 生产者，不是消费者：把频谱变成 PV.audio.energy / beat / bpm，供 fx 与件读。
 *
 * 数据源优先复用 App 已有的那条链——core 的 startReactiveLoop() 每帧把 analyser 的

 *
 * 归谁接 <audio>：一个元素只能被 createMediaElementSource 接一次，而且接了不可逆——
 * 谁先接谁赢，输了的一方再也听不见（实测就是 PV 先接、把 core 顶掉，然后 PV 拆桥，
 * 两边都哑）。所以现在的规矩很硬：App 里 PV 绝不接元素，只读 core 摊到
 * window.__reactiveBins 的频谱；自建图只在没有 core 的预览台里打开（PV.audioOwn）。
 *
 * 拍点检测：高通能量 → 自适应阈值的 onset → IOI 直方图定周期 → 相位锁定跟随。
 * 拍网格用歌自己的时钟（媒体时间），不用墙钟：拖进度条、暂停、变速都不该让相位漂走。

(function () {

    else bins = ownFrame();
    if (!bins) {
      A.mode = A.mode || 'none'; A.energy = 0; A.beat = null;
      PV.audio.energy = null; PV.audio.beat = null; return;
    }

    var n = bins.length;
    /* 暂停状态下不判拍：频谱是静态的，硬算只会从平滑尾巴里编出假 onset；
     * 也免得 media↔wall 来回切将历史抹掉 */
    if (au && au.paused && au.currentTime > 0) {
      A.energy = 0; A.beat = null; A.confidence = 0;
      Object.assign(PV.audio, { energy: 0, beat: null, confidence: 0, time: A.time });
      return;
    }
    var low = band(bins, 0, Math.max(1, Math.floor(n * 0.12)));
    var mid = band(bins, Math.floor(n * 0.12), Math.floor(n * 0.45));
    var high = band(bins, Math.floor(n * 0.45), n);
    A.low = low; A.mid = mid; A.high = high;

    /* 能量：字节频谱很容易饱和（嗑鼓时低段直接顶 255）。拿最大值或单一 p95 当满量程，
     * 连续响的材料会长期贴在 1（实测踩过）；改成 p10..p95 的百分位区间归一化。 */
    var raw = low * 0.55 + mid * 0.3 + high * 0.15;
    rawWin.push(raw);
    if (rawWin.length > RAW_N) rawWin.shift();
    var lo = pAt(rawWin, 0.1), hi = pAt(rawWin, 0.95);
    A.energy = Math.max(0, Math.min(1, (raw - lo) / Math.max(0.035, hi - lo)));

    /* onset：高通能量的正增量超过近期均值 + 1.4σ，且与上一个至少隔 0.11s */
    var hp = low * 0.35 + mid * 0.45 + high * 0.2;
    flux = Math.max(0, hp - prev); prev = hp;
    hist.push(flux);
    if (hist.length > HP) hist.shift();
    var m = 0, q;
    for (q = 0; q < hist.length; q++) m += hist[q];
    m /= Math.max(1, hist.length);
    var sd = 0;
    for (q = 0; q < hist.length; q++) sd += Math.pow(hist[q] - m, 2);
    sd = Math.sqrt(sd / Math.max(1, hist.length));

    var t = clock();
    PV.audio._thr = m + 2 * sd;
    /* 静默不该产生 onset：实测音频放完之后，能从平滑衰减的尾巴里编出 194 BPM */
    var silent = raw < 0.02 || (au && au.paused);
    /* onset 门限：相对阈值 + 相对峰值 + 绝对地板 + 最短间隔。
     * 只用均值+kσ 会被宽带噪声喂饱：实测带 4% 白噪声的测试音里，中位 IOI 被压到 0.26s → 229 BPM。
     * 峰值门限（须达近期最大 flux 的 40%）才是“真瞬态”战“连续小抖动”的分水岭。 */
    var maxF = 0;
    for (var y = 0; y < hist.length; y++) if (hist[y] > maxF) maxF = hist[y];

    /* 峰选取：嗑鼓的衰减与噪声会在同一个拍上造成两个峰，周期就折了一半
     * （实测 96 BPM 的纯正拍测试音报出 0.318s → 189）。候选延后 0.18s 确认：
     * 窗口里若有更大的峰就替换。视觉脉冲用 0.18s 检测延迟看不出来。 */
    var cand = flux > m + 2 * sd && flux > maxF * 0.4 && flux > 0.02 && hp > 0.05 && !silent;
    if (cand && (!pend || flux > pend.flux)) pend = { t: t, flux: flux };
    if (pend && t - pend.t >= 0.18) {
      var p0 = pend; pend = null;
      if (p0.t - A._last > 0.2) { A._last = p0.t; A._onsets.push(p0.t); A._idx++; }
    }
    if (A._onsets.length > 40) A._onsets.splice(0, A._onsets.length - 40);

    var est = silent ? null : estimatePeriod(A._onsets);
    if (est && est.period) {
      /* 周期慢变，稳定性当置信度 */
      A._period = A._period ? A._period * 0.85 + est.period * 0.15 : est.period;
      A.bpm = 60 / A._period;
      A.confidence = est.reg;
    }
    if (A._period && !silent) {
      var since = t - A._last;                        // 距上一个瞬态：天然零漂移
      A.beat = { since: since, len: A._period, index: A._idx };
      if (since > A._period * 4) { A.beat = null; A.confidence = 0; }   // 瞬态断了就失效
    } else { A.beat = null; }
    if (silent) { A.beat = null; A.confidence = 0; A.energy = 0; }
    Object.assign(PV.audio, {
      energy: A.energy, beat: A.beat, bpm: A.bpm, time: A.time, confidence: A.confidence,
      low: A.low, mid: A.mid, high: A.high
    });
  };

  /* ---------- fx 随能量浮动 ----------
   * 同一套件在副歌和主歌里力度不同。PV.audioModulate=false 可关。
   * 面板/预览台改滑块要写 PV.setFxBase，直接改 PV.fx 会被下一帧的调制覆掉。 */
  var base = null;
  PV.audioModulate = true;

  PV._fxBaseChanged = function () {          // 气氛一换，基准重设成该气氛的预设
    var m = PV.mood && PV.part('mood', PV.mood);
    base = Object.assign({}, PV.fx);
    if (m && m.fx) Object.keys(m.fx).forEach(function (k) { base[k] = m.fx[k]; PV.fx[k] = m.fx[k]; });
  };

  function applyModulate() {
    if (!base) base = Object.assign({}, PV.fx);
    if (PV.audioModulate === false) { Object.assign(PV.fx, base); return; }
    var e = PV.audio.energy || 0;
    PV.fx.motion = Math.min(1, base.motion * (0.65 + 0.55 * e) + 0.08 * e);
    PV.fx.chroma = Math.min(1, base.chroma + e * 0.28);
    PV.fx.glitch = Math.min(1, base.glitch + (e > 0.75 ? (e - 0.75) * 0.9 : 0));
  }

  PV.setFxBase = function (k, v) {
    if (!base) base = Object.assign({}, PV.fx);
    if (typeof k === 'object') Object.keys(k).forEach(function (x) { base[x] = k[x]; });
    else base[k] = v;
    applyModulate();
    return PV.fx;
  };
  PV.restoreFxBase = function () { if (base) Object.assign(PV.fx, base); };

  PV.audioStart = function () {
    if (A.on) return;
    A.on = true; hostWaitSince = 0;
    anchorHostWait();
    PV.dispatch('pv:audio', { on: true });
  };
  PV.audioStop = function () {
    A.on = false; A.ticks = 0; A.mode = null;
    A.beat = null; A.energy = 0; A.bpm = 0; A.confidence = 0;
    rebase(0);
    A._idx = 0; clockMode = null;
    Object.assign(PV.audio, { energy: null, beat: null, bpm: 0, confidence: 0, time: null });
    if (base) Object.assign(PV.fx, base);
    /* 退出 PV 就拆桥：不能给后台留一个挂着的图，那是静音的源头 */
    if (own.src || own.actx) releaseOwn('exit');
    own.failed = false; own.err = null; own.released = null;
  };

  /* 挂到引擎的帧循环上，不另开 rAF */
  PV.onFrame(function () { PV.audioTick(); applyModulate(); });
})();

/* PV 引擎 · 13 歌词语法层
 * JIZURA 那套行内记号，播放器里同样吃：
 *   今夜/我还在这里    → 分 cut（12-cuts 做）
 *   *透明*             → 强调：该段优先抽冲击型版式、装饰加权
 *   行末 !             → 闪：入场更狠、允许白闪
 *   歌词|注釈          → 注釈：小号副文本，交给 decor/note 件
 *
 * 记号不单独跑一遍「先剥后配」的解析——那样会丢掉位置信息，
 * 到底是哪一段被强调就查不回来了。所以 * 与 ! 留在 token 流里，
 * 由 12-cuts 分段时顺手带上 cut.emph / cut.flash 标记；
 * 这里只管两件事：把 `|` 之后的注釈摘出来（行级），以及给出判定用的正则。
 */
(function () {
  'use strict';
  var PV = window.PV;

  PV.MARK = { star: '*', bang: '!' };

  /* 行级：摘注釈。返回 {text, note}，text 里保留 * 与 ! 交给分段 */
  PV.splitNote = function (raw) {
    var s = raw || '';
    var i = s.indexOf('|');
    if (i < 0) return { text: s, note: '' };
    return { text: s.slice(0, i), note: s.slice(i + 1).trim() };
  };

  /* token 级：这一段里有 * 就算强调（成对与否都认，写歌词的人经常只打一半） */
  PV.markFlags = function (tokens) {
    var emph = 0, flash = 0;
    for (var i = 0; i < tokens.length; i++) {
      if (tokens[i] === PV.MARK.star) emph = 1;
      else if (tokens[i] === PV.MARK.bang) flash = 1;
    }
    return { emph: emph, flash: flash };
  };

  /* 渲染前清掉记号字符：记号只表达意图，不该出现在画面上 */
  PV.cleanTokens = function (tokens) {
    return tokens.filter(function (t) { return t !== PV.MARK.star && t !== PV.MARK.bang; });
  };

  /* 给「邻行文本」用：前后行、ghost、注釈外的地方显示的是原始行，
   * 不加这一步会把 / * ! | 这些记号直接印到画面上（实测连行版式的前行就泄露了） */
  PV.plain = function (raw) {
    var s = (raw || '').split('|')[0];
    return s.replace(/[\/*!]/g, '').replace(/\s+/g, ' ').trim();
  };
})();

/* PV 引擎 · 12 分 cut 与拍对齐（④）+ 记号承载（⑤的语法接入口）
 *
 * 一行 ≠ 一个 cut。规则：
 *   1. 显式 `/` 优先（`风也/停了/星也落了` 切三段）；
 *   2. 没写就按字数自动切：超过 PV.maxCutChars 的行在标点 / 空格 / 拉丁词边界处断，
 *      最多 PV.maxCuts 段——长句不再挤成一坨，短句一律不动；
 *   3. 时间：有 TTML words 用词的真实起止，否则按字符权重在行起止之间分配；
 *   4. PV.beatSnap 为真且节拍可信时，把每段起点吸到最近的拍点（最多吸半拍）。
 *
 * `*强调*` 与行末 `!` 在这里随分段一起打标（cut.emph / cut.flash），
 * 注釈 `歌词|注釈` 是行级的，摘出来挂在第一段上——记号本身不进画面。
 *
 * 推进由帧循环做：PV.audio.time 越过下段起点就换段。没有播放时钟时一行就是一段，
 * 行为与 ③ 之前完全一致。
 */
(function () {
  'use strict';
  var PV = window.PV;

  PV.beatSnap = true;
  PV.autoSplit = true;
  PV.maxCutChars = 13;      // 超过这个字数才考虑自动切
  PV.maxCuts = 3;
  PV.minCutMs = 900;         // 一段的最短可用时长（比最硬的入场 500ms 加上阅读时间再宽一点）

  var MARK = /[，。、！？；：,.?;:…—–)」』”’]/;
  function isSpace(t) { return /^\s+$/.test(t); }
  function bare(t) { return t.replace(/[*!]/g, ''); }
  function len(t) { return isSpace(t) ? 1 : Math.max(1, Array.from(bare(t)).length); }
  function len2(toks) { var s = 0; toks.forEach(function (t) { s += len(t); }); return s; }

  function bySlash(tokens) {
    var gs = [], cur = [], i;
    for (i = 0; i < tokens.length; i++) {
      if (tokens[i] === '/') { if (cur.length) gs.push(cur); cur = []; continue; }
      cur.push(tokens[i]);
    }
    if (cur.length) gs.push(cur);
    if (!gs.length) gs = [tokens.slice()];
    return gs.map(function (g) { return { tokens: g, explicit: gs.length > 1 }; });
  }

  /* 在 [lo,hi] 里挑最后一个好断点（空格 / 标点之后 / 拉丁词之后） */
  function findBreak(toks, lo, hi) {
    var best = -1;
    hi = Math.min(hi, toks.length - 1);
    for (var i = lo; i <= hi; i++) {
      if (i + 1 >= toks.length) break;
      if (isSpace(toks[i]) || MARK.test(bare(toks[i])) || toks[i + 1] === ' ' || /[a-zA-Z]{2,}/.test(toks[i])) best = i + 1;
    }
    return best;
  }

  function autoSplit(g) {
    var toks = g.tokens.slice();
    if (!PV.autoSplit || g.explicit || len2(toks) <= PV.maxCutChars) return [g];
    var out = [], guard = 0;
    while (toks.length && out.length < PV.maxCuts && guard++ < 8) {
      var rest = len2(toks);
      if (rest <= PV.maxCutChars || out.length === PV.maxCuts - 1) { out.push({ tokens: toks, explicit: false }); break; }
      var lo = Math.max(3, Math.round(PV.maxCutChars * 0.55));
      var hi = Math.min(toks.length - 1, Math.round(PV.maxCutChars * 1.35));
      var br = findBreak(toks, lo, hi);
      if (br <= 0 || br >= toks.length) br = Math.min(toks.length - 1, Math.max(lo, Math.floor(toks.length / 2)));
      out.push({ tokens: toks.slice(0, br), explicit: false });
      toks = toks.slice(br);
      while (toks.length && isSpace(toks[0])) toks = toks.slice(1);
    }
    return out;
  }

  /* 吸附：偏移不超过半拍才吸，且不得越界 */
  function snapMs(ms, perMs) {
    if (!PV.beatSnap || !perMs || perMs < 120) return ms;
    var b = PV.audio.beat;
    if (!b || (PV.audio.confidence || 0) < 0.35) return ms;
    var phase = ((ms % perMs) + perMs) % perMs;
    var off = phase - Math.round(phase / perMs) * perMs;
    if (Math.abs(off) > perMs * 0.5) return ms;
    return Math.max(0, ms - off);
  }

  PV.splitLine = function (line, i) {
    var rawLine = (line && line.text) || '';
    if (!rawLine.trim()) return [];
    var sn = PV.splitNote ? PV.splitNote(rawLine) : { text: rawLine, note: '' };
    var toks = PV.tokens(sn.text);
    var groups = [];
    bySlash(toks).forEach(function (g) { autoSplit(g).forEach(function (x) { groups.push(x); }); });
    if (!groups.length) return [];

    var w = groups.map(function (g) { return Math.max(1, len2(g.tokens)); }), tot = 0;
    w.forEach(function (x) { tot += x; });

    var t0 = line.time || 0, t1 = line.end || 0;
    if (!t1) { var nx = PV.lyrics()[i + 1]; t1 = nx && nx.time ? nx.time : t0 + 4000; }
    var span = Math.max(800, t1 - t0);

    var cuts = [], acc = 0;
    groups.forEach(function (g, gi) {
      var s = t0 + span * (acc / tot), e = t0 + span * ((acc + w[gi]) / tot);
      acc += w[gi];
      var flags = PV.markFlags ? PV.markFlags(g.tokens) : { emph: 0, flash: 0 };
      var clean = PV.cleanTokens ? PV.cleanTokens(g.tokens) : g.tokens;
      cuts.push({
        i: gi, n: groups.length, tokens: clean, raw: g.tokens,
        text: clean.join('').replace(/\u00a0/g, ' ').trim(),
        t0: s, t1: e, explicit: !!g.explicit,
        emph: flags.emph, flash: flags.flash,
        note: gi === 0 ? sn.note : ''            // 注釈是行级的，挂在第一段
      });
    });
    if (!cuts.some(function (c) { return c.text; })) return [];

    /* TTML 逐词时间比字符权重准，直接覆盖 */
    var ws = line.words;
    if (ws && ws.length && cuts.length > 1) {
      var wEnd = ws[ws.length - 1].time + (ws[ws.length - 1].dur || 0);
      cuts.forEach(function (c) {
        var f0 = c.i / cuts.length, f1 = (c.i + 1) / cuts.length;
        c.t0 = ws[0].time + (wEnd - ws[0].time) * f0;
        c.t1 = ws[0].time + (wEnd - ws[0].time) * f1;
      });
    }

    var perMs = PV.audio.beat ? PV.audio.beat.len * 1000 : 0;
    for (var k = 1; k < cuts.length; k++) {
      var sn2 = snapMs(cuts[k].t0, perMs);
      var lo = cuts[k - 1].t0 + 320, hi = Math.max(lo + 200, cuts[k].t1 - 160);
      cuts[k].t0 = Math.max(lo, Math.min(hi, sn2));
      cuts[k - 1].t1 = Math.min(cuts[k].t0, Math.max(cuts[k - 1].t0 + 400, cuts[k - 1].t1));
    }
    cuts[cuts.length - 1].t1 = Math.max(cuts[cuts.length - 1].t1, t1);

    /* 段不能切得比入场还短：实测英文长句能切出 340ms 的段，
     * 而最硬的入场也要 500ms——段比入场短就没有“出完”这一说。
     * 不靠调小 stagger 压（挤到 4ms 以下字就糊成一排），而是往回合并。 */
    var MIN = PV.minCutMs || 900;
    while (cuts.length > 1) {
      var minI = -1, minV = 1e9;
      for (var q = 0; q < cuts.length; q++) {
        var d = cuts[q].t1 - cuts[q].t0;
        if (d < minV) { minV = d; minI = q; }
      }
      if (minV >= MIN) break;
      var joinWith = minI === 0 ? 1 : minI - 1;
      var keep = cuts[Math.min(minI, joinWith)], eat = cuts[Math.max(minI, joinWith)];
      keep.t1 = eat.t1;
      keep.tokens = keep.tokens.concat(eat.tokens);
      keep.text = (keep.text + eat.text).replace(/\s+/g, ' ').trim();
      keep.n = cuts.length - 1;
      cuts.splice(Math.max(minI, joinWith), 1);
      if (keep.n !== cuts.length) cuts.forEach(function (x, k) { x.i = k; x.n = cuts.length; });
    }
    for (var z = 1; z < cuts.length; z++) { cuts[z].t0 = cuts[z - 1].t1; cuts[z - 1].t1 = cuts[z].t0; }
    cuts[cuts.length - 1].t1 = Math.max(cuts[cuts.length - 1].t1, t1);
    return cuts;
  };

  /* 帧推进：过了下段起点就换段 */
  PV.cutTick = function () {
    var S = PV.S;
    if (!S.cuts || S.cuts.length < 2) return;
    var now = PV.audio.time;
    if (now == null || S.idx < 0) return;
    var nextI = S.cutI + 1;
    if (nextI >= S.cuts.length) return;
    if (now >= S.cuts[nextI].t0) PV.show(S.idx, { force: true, keepCuts: true, cutI: nextI });
  };
  PV.onFrame(PV.cutTick);

  PV.cutsInfo = function () {
    var S = PV.S;
    return { line: S.idx, cut: S.cutI, n: S.cuts ? S.cuts.length : 1, at: PV.audio.time,
      times: (S.cuts || []).map(function (c) { return [Math.round(c.t0), Math.round(c.t1)]; }) };
  };
})();

/* PV 引擎 · 14 装饰层扩容（⑤）
 *
 * 开头有一段「元数据补标」：给 ① 平移过来的既有件打 impact 标记——
 * `*强调*` 与行末 `!` 的行要靠冲击型件来体现，而件是分散在各文件里的，
 * 与其回头改十几个定义，不如在语法层落地处统一声明一次。只加元数据，不改行为。
 *
 * 装饰的规矩：一律挂在本次 cut 的 .jv-line 里（元素随段生灭，不用自己清理），
 * 并且全部 writing-mode:horizontal-tb —— 竖写版式会把子层的文字方向一起带走（①踩过）。
 */
(function () {
  'use strict';
  var PV = window.PV;

  /* ---- 元数据补标：哪些件算「冲击型」（强调行优先抽它们） ---- */
  var IMPACT = {
    layout: ['break', 'mix', 'diag', 'stack', 'cond', 'tile', 'band', 'scatter', 'cad'],
    enter: ['slam', 'zoomIn', 'drop', 'scramble'],
    exit: ['burst', 'smash', 'scatter', 'glitchOut'],
    transition: ['whip', 'flash', 'zoomThrough', 'push']
  };
  Object.keys(IMPACT).forEach(function (g) {
    IMPACT[g].forEach(function (k) { var d = PV.part(g, k); if (d) d.impact = 1; });
  });

  /* ---------- 小工具 ---------- */
  function el(cls, html) {
    var d = document.createElement('div');
    d.className = 'jv-d ' + cls;
    if (html != null) d.innerHTML = html;
    return d;
  }
  function add(c, node) {
    if (!c.el) return null;
    if (c.el.querySelector('.' + node.className.split(' ')[1])) return null;
    c.el.appendChild(node);
    return null;
  }
  function n(c, k) { return PV.rnd(k); }         // 走引擎的 seed，同 seed 同画面

  /* ---------- frame 双线框 + 角刻度 ---------- */
  PV.reg('decor', 'frame', {
    nm: '框', tags: ['editorial', 'graphic', 'calm'], w: 0.9,
    when: function () { return PV.fx.decor > 0.35; },
    apply: function (c) {
      return add(c, el('jv-frame',
        '<i class="e"></i><i class="e2"></i><b class="c tl"></b><b class="c tr"></b><b class="c bl"></b><b class="c br"></b>'));
    }
  });

  /* ---------- ticks 顶部刻度尺 ---------- */
  PV.reg('decor', 'ticks', {
    nm: '刻度', tags: ['graphic', 'editorial', 'glitch'], w: 0.8,
    when: function () { return PV.fx.decor > 0.4; },
    apply: function (c) {
      var h = '', N = 26;
      for (var i = 0; i < N; i++) h += '<i style="height:' + (i % 5 === 0 ? 13 : 6) + 'px;opacity:' + (i % 5 === 0 ? .8 : .4) + '"></i>';
      return add(c, el('jv-ticks', h));
    }
  });

  PV.reg('decor', 'target', {
    nm: '准星', tags: ['graphic', 'glitch', 'editorial'], w: 0.7,
    when: function () { return PV.fx.decor > 0.45; },
    apply: function (c) {

/* PV 引擎 · 15 处理层扩容（⑤）
 * treatment 分两类：apply 建层（多数只建一次，随滑块改透明度/强度），frame 每帧推。
 * 一律挂在 #pvJv 上（整屏），不碰 folia 的 #pvTrack；全部 pointer-events:none。
 */
(function () {
  'use strict';
  var PV = window.PV;

  function layerEl(cls) {
    var L = PV.layer();
    if (!L) return null;
    var g = L.querySelector('.' + cls);
    if (!g) {
      g = document.createElement('div');
      g.className = 'jv-fx ' + cls;
      L.appendChild(g);
    }
    return g;
  }

  /* ---------- scan CRT 扫描线滚动 ---------- */
  PV.reg('treatment', 'scan', {
    nm: '扫描线', tags: ['glitch', 'graphic', 'editorial'], w: 0.8,
    when: function () { return PV.fx.texture > 0.25; },
    apply: function () {
      var g = layerEl('jv-scan');
      if (g) g.style.opacity = (0.12 + 0.4 * PV.fx.texture).toFixed(3);
      return null;
    }
  });

  /* ---------- vig 暗角随能量呼吸 ---------- */
  PV.reg('treatment', 'vig', {
    nm: '暗角', tags: ['calm', 'emotional', 'graphic'], w: 0.9,
    apply: function () {
      var g = layerEl('jv-vig');
      if (!g) return null;
      var fr = function () {
        var e = PV.audio.energy || 0;
        g.style.opacity = (0.34 + 0.4 * (1 - e)).toFixed(3);
      };
      fr();
      PV.onFrame(fr);
      return function () { PV.offFrame(fr); };
    }
  });

  /* ---------- punch 拍点轻闪（有节拍数据才中签） ---------- */
  PV.reg('treatment', 'punch', {
    nm: '拍闪', tags: ['pop', 'glitch', 'graphic'], w: 0.9,
    when: function () { return !!PV.audio.beat; },
    apply: function () {
      var g = layerEl('jv-punch');
      if (!g) return null;
      var last = -1;
      var fr = function () {
        var b = PV.audio.beat;
        if (!b) { g.style.opacity = '0'; return; }
        if (b.index !== last) {
          last = b.index;
          g.style.opacity = String(0.1 + 0.22 * (PV.audio.energy || 0.5));
        }
        g.style.opacity = (Math.max(0, parseFloat(g.style.opacity || '0') - 0.035)).toFixed(3);
      };

      return function () { PV.offFrame(fr); };
    }
  });

  /* ---------- edgeglow 边缘光随能量 ---------- */
  PV.reg('treatment', 'edgeglow', {
    nm: '缘光', tags: ['pop', 'emotional', 'glitch'], w: 0.8,
    when: function () { return PV.audio.energy != null && PV.fx.chroma > 0.1; },
    apply: function () {
      var g = layerEl('jv-edge');
      if (!g) return null;
      var fr = function () {
        var e = PV.audio.energy || 0;
        g.style.opacity = (0.06 + 0.55 * e).toFixed(3);
      };
      fr();
      PV.onFrame(fr);
      return function () { PV.offFrame(fr); };
    }
  });

  /* ---------- glitchbars 随机色块错位（glitch 推） ---------- */
  PV.reg('treatment', 'glitchbars', {
    nm: '故障条', tags: ['glitch', 'graphic'], w: 0.8,
    when: function () { return PV.fx.glitch > 0.3; },
    apply: function () {
      var g = layerEl('jv-gbars');
      if (!g) return null;
      g.innerHTML = '<i></i><i></i><i></i><i></i>';
      var bars = g.children, last = 0;
      var fr = function () {
        var now = performance.now();
        if (now - last < 90) return;                 // ~11Hz 才像故障，60Hz 会糊成噪点
        last = now;
        var hot = PV.fx.glitch * (PV.audio.energy || 0.4);
        for (var i = 0; i < bars.length; i++) {
          var on = Math.random() < hot;
          bars[i].style.opacity = on ? (0.15 + Math.random() * 0.5 * hot).toFixed(3) : '0';
          bars[i].style.top = (Math.random() * 92).toFixed(1) + '%';
          bars[i].style.height = (1 + Math.random() * 9 * hot).toFixed(1) + 'px';
          bars[i].style.transform = 'translateX(' + ((Math.random() - 0.5) * 12 * hot).toFixed(1) + 'vw)';
        }
      };
      PV.onFrame(fr);
      return function () { PV.offFrame(fr); };
    }
  });

  /* ---------- duotone 套色层（chroma 推） ---------- */
  PV.reg('treatment', 'duotone', {
