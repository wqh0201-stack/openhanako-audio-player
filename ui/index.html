<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hana Player</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-shell="card">
<audio id="audio" preload="metadata"></audio>

<div class="frame" id="frame">
  <div class="player" id="player" data-layout="long" data-page="play" data-drawer="0" data-lyrics="1">

    <section class="stage" id="stage">
      <!-- 舞台：封面（贴左不裁切）+ 晕开背景 + 歌词/频谱 -->
      <div class="scene" id="scene">
        <div class="cover-haze" id="coverHaze" aria-hidden="true"></div>
        <div class="cover" id="cover" aria-hidden="true"></div>
        <div class="lyric-scrim" id="lyricScrim" aria-hidden="true"></div>

        <div class="scene-top" id="sceneTop">
          <h1 class="track-title" id="trackTitle">风经过的地方</h1>
          <p class="track-artist" id="trackArtist">林间来信</p>
          <p class="track-meta" id="trackMeta"></p>
        </div>

        <div class="lyric-wrap" id="lyricWrap">
          <div class="lyrics" id="lyrics"></div>
          <button class="lyric-back" id="lyricBack" type="button" hidden>
            <svg class="icon icon-sm" aria-hidden="true"><use href="#i-arrow-down"></use></svg>
            <span>回到当前歌词</span>
          </button>
        </div>

        <!-- 歌词关闭时的替代内容：纯装饰频谱（不接 Web Audio） -->
        <div class="spectrum" id="spectrum" aria-hidden="true"></div>
      </div>

      <div class="drawer-scrim" id="drawerScrim" hidden></div>

      <!-- 播放队列：三种布局共用一份 DOM -->
      <section class="queue" id="queue" aria-label="播放队列">
        <div class="queue-topline">
          <button class="back-btn" id="backBtn" type="button">
            <svg class="icon icon-sm" aria-hidden="true"><use href="#i-chevron-left"></use></svg>
            <span>返回播放</span>
          </button>
        </div>

        <header class="queue-head" id="queueHead">
          <h2 class="queue-title">播放队列 <span class="queue-count"><span id="queueCount">12</span> 首</span></h2>
          <div class="queue-head-actions">
            <button class="icon-btn" id="importBtn" type="button" aria-label="添加曲目" title="添加曲目" aria-expanded="false">
              <svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg>
            </button>
            <button class="icon-btn" id="drawerCloseBtn" type="button" aria-label="关闭队列" title="关闭队列">
              <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
            </button>
          </div>
        </header>

        <ol class="queue-list" id="queueList"></ol>

        <!-- 行内「更多」菜单 -->
        <div class="pop pop-more" id="morePop" hidden>
          <p class="pop-title" id="moreTitle"></p>
          <button class="pop-item" id="removeBtn" type="button">
            <svg class="icon icon-sm" aria-hidden="true"><use href="#i-trash"></use></svg>
            <span>从队列移除</span>
          </button>
        </div>

        <!-- 导入面板 -->
        <div class="pop pop-import" id="importPop" hidden>
          <p class="pop-title">添加曲目</p>
          <div class="pop-link">
            <input class="pop-input" id="linkInput" type="url" inputmode="url" placeholder="粘贴歌曲 / 歌单链接" aria-label="在线链接">
            <button class="pop-go" id="linkAddBtn" type="button" aria-label="添加链接">添加</button>
          </div>
          <button class="pop-item" data-import="file" type="button">
            <svg class="icon icon-sm" aria-hidden="true"><use href="#i-file"></use></svg>
            <span>本地文件</span>
          </button>
          <button class="pop-item" data-import="folder" type="button">
            <svg class="icon icon-sm" aria-hidden="true"><use href="#i-folder"></use></svg>
            <span>本地文件夹</span>
          </button>
          <p class="pop-note" id="importNote"></p>
        </div>
      </section>
    </section>

    <!-- 底部播放控制：三种布局常驻 -->
    <footer class="controls" id="controls">
      <div class="controls-info">
        <div class="ci-title" id="ciTitle">风经过的地方</div>
        <div class="ci-artist" id="ciArtist">林间来信</div>
      </div>

      <div class="controls-main">
        <div class="progress-row">
          <span class="time" id="curTime">1:03</span>
          <input class="range range-seek" id="seek" type="range" min="0" max="284" step="0.1" value="63" aria-label="播放进度">
          <span class="time" id="durTime">4:44</span>
        </div>

        <!-- 控制条第二行：设计稿节奏 ⟳ ⏮ (⏸) ⏭ 🔊 | ☰ 队列，整行均分间距。
             「歌词」保留（tab 行砍掉后无处安放），做成与「队列」同一套文字按钮。 -->
        <div class="btn-row">
          <button class="text-btn" id="lyricToggle" type="button" aria-pressed="true" title="歌词显示：开">
            <svg class="icon icon-sm" aria-hidden="true"><use href="#i-lyric"></use></svg>
            <span>歌词</span>
          </button>

          <button class="icon-btn" id="modeBtn" type="button"></button>
          <button class="icon-btn" id="prevBtn" type="button" aria-label="上一首" title="上一首">
            <svg class="icon" aria-hidden="true"><use href="#i-prev"></use></svg>
          </button>
          <button class="play-btn" id="playBtn" type="button" aria-label="暂停" title="暂停"></button>
          <button class="icon-btn" id="nextBtn" type="button" aria-label="下一首" title="下一首">
            <svg class="icon" aria-hidden="true"><use href="#i-next"></use></svg>
          </button>

          <div class="vol-group">
            <button class="icon-btn" id="muteBtn" type="button" aria-label="静音" title="静音"></button>
            <input class="range range-vol" id="vol" type="range" min="0" max="100" step="1" value="72" aria-label="音量">
          </div>

          <span class="ctl-divider" aria-hidden="true"></span>

          <button class="queue-btn" id="queueBtn" type="button">
            <svg class="icon icon-sm" aria-hidden="true"><use href="#i-list"></use></svg>
            <span class="qb-label"><span class="qb-word">队列</span> <span id="queueBtnCount">12</span><span class="qb-now">正在播放</span></span>
          </button>
        </div>
      </div>
    </footer>

    <div class="toast" id="toast" hidden></div>
    <pre class="report" id="report" hidden></pre>
  </div>
</div>

<svg class="svg-defs" aria-hidden="true" focusable="false"><defs>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8.2 5.6 19 12 8.2 18.4Z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9.3 5.8v12.4M14.7 5.8v12.4"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6.9 6.2v11.6M19.2 6.8 10 12l9.2 5.2Z"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M17.1 6.2v11.6M4.8 6.8 14 12l-9.2 5.2Z"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24">
    <path d="M7 8.6A5.5 5.5 0 0 1 12.5 5.2H17"/>
    <path d="M14.9 3 17.1 5.2 14.9 7.4"/>
    <path d="M17 15.4a5.5 5.5 0 0 1-5.5 3.4H7"/>
    <path d="M9.1 21 6.9 18.8 9.1 16.6"/>
  </symbol>
  <symbol id="i-repeat-one" viewBox="0 0 24 24">
    <path d="M7 8.6A5.5 5.5 0 0 1 12.5 5.2H17"/>
    <path d="M14.9 3 17.1 5.2 14.9 7.4"/>
    <path d="M17 15.4a5.5 5.5 0 0 1-5.5 3.4H7"/>
    <path d="M9.1 21 6.9 18.8 9.1 16.6"/>
    <path d="M11.3 10.6 12.8 9.5v5"/>
    <path d="M11.1 14.5h3"/>
  </symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24">
    <path d="M4 6.8h3.3c1.3 0 2.5.7 3.2 1.8l3 4.8c.7 1.1 1.9 1.8 3.2 1.8H20"/>
    <path d="M4 17.2h3.3c1.3 0 2.5-.7 3.2-1.8l.9-1.4"/>
    <path d="M14.1 9.4l.9-1.4c.7-1.1 1.9-1.8 3.2-1.8H20"/>
    <path d="M17.7 4.2 20 6.4l-2.3 2.2"/>
    <path d="M17.7 15.4 20 17.6l-2.3 2.2"/>
  </symbol>
  <symbol id="i-volume" viewBox="0 0 24 24">
    <path d="M4.4 9.4h3.2l4.2-3.4v12l-4.2-3.4H4.4z"/>
    <path d="M14.8 9.5a3.8 3.8 0 0 1 0 5"/>
    <path d="M17.3 7.2a7.2 7.2 0 0 1 0 9.6"/>
  </symbol>
  <symbol id="i-volume-mute" viewBox="0 0 24 24">
    <path d="M4.4 9.4h3.2l4.2-3.4v12l-4.2-3.4H4.4z"/>
    <path d="M15 9.6 19.6 14.4M19.6 9.6 15 14.4"/>
  </symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5.4v13.2M5.4 12h13.2"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.6 6.6 17.4 17.4M17.4 6.6 6.6 17.4"/></symbol>
  <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M14.4 5.8 8 12l6.4 6.2"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><path d="M6.2 12h.01M12 12h.01M17.8 12h.01"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M4.6 7h14.8M4.6 12h14.8M4.6 17h9"/></symbol>
  <symbol id="i-lyric" viewBox="0 0 24 24"><path d="M5 6.6h14M5 11h14M5 15.4h9M5 19.8h6"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M6.8 4.8h6.4l4 4v10.4H6.8zM13.2 4.8v4h4"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M4.4 6.6h5.2l2 2.4h8v9.4H4.4z"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24">
    <path d="M10.2 13.8a3.4 3.4 0 0 0 4.8 0l2.8-2.8a3.4 3.4 0 0 0-4.8-4.8l-1 1"/>
    <path d="M13.8 10.2a3.4 3.4 0 0 0-4.8 0L6.2 13a3.4 3.4 0 0 0 4.8 4.8l1-1"/>
  </symbol>
  <symbol id="i-trash" viewBox="0 0 24 24">
    <path d="M5.6 7.4h12.8M9.6 7.4V5.6h4.8v1.8M7.2 7.4l.8 11h8l.8-11M10.4 10.6v4.8M13.6 10.6v4.8"/>
  </symbol>
  <symbol id="i-arrow-down" viewBox="0 0 24 24"><path d="M12 5.6v11.2M7.6 12.6 12 17l4.4-4.4"/></symbol>
</defs></svg>

<script src="app.js" defer></script>
<script>window.__HANA_BUILD = "1003131546";</script>
<script type="module">
  import { hana } from "./sdk.js";
  window.hana = hana;
  window.__hana = hana;
  try { hana.ready(); } catch (e) { console.warn("[hana] ready failed", e); }
  window.dispatchEvent(new Event("hana-sdk-ready"));
</script>
</body>
</html>
