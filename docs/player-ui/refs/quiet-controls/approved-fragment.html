#hana-control-studies .study {
  --hp-surface: light-dark(#fcfaf5,#414d56); --hp-ink: light-dark(#3b3d3f,#e1eaf0);
  --hp-secondary: light-dark(#746e68,#acbdc7); --hp-accent: light-dark(#537d96,#c99aaf);
  --hp-on: light-dark(#fffdf7,#2a3238); --hp-line: color-mix(in srgb,var(--hp-ink) 12%,transparent);
  --hp-hover: color-mix(in srgb,var(--hp-ink) 7%,transparent);
  --hp-track: color-mix(in srgb,var(--hp-ink) 15%,transparent);
  --hp-scene: light-dark(#d5c4c3,#454652); --hp-scene-text: light-dark(#383440,#f5eef2);
  --hp-veil: light-dark(#e6d6d4,#454652); --hp-ease: cubic-bezier(.22,.61,.36,1);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
  font-size:13px;line-height:1.45;color:var(--hp-ink); min-height:554px;
  padding:20px 0 0; display:flex; justify-content:center; align-items:flex-start;
}
#hana-control-studies .study[hidden]{display:none}
#hana-control-studies .player-study {container-type:inline-size;position:relative;width:100%;max-width:1040px;height:530px;background:var(--hp-surface);border-radius:14px 14px 0 0;display:flex;flex-direction:column;isolation:isolate}
#hana-control-studies .player-study * {box-sizing:border-box}
#hana-control-studies button,#hana-control-studies input {font:inherit}
#hana-control-studies button {border:0;margin:0;background:none;color:inherit;flex-shrink:0;touch-action:manipulation}
#hana-control-studies .scene-area {flex:1;min-height:0;position:relative;z-index:1;overflow:hidden;border-radius:14px 14px 0 0;background:var(--hp-scene);color:var(--hp-scene-text)}
#hana-control-studies .scene-cover {position:absolute;inset:0 auto 0 0;height:100%;aspect-ratio:1666 / 1655;background-image:var(--hp-cover);background-size:100% 100%;background-position:left center;mask-image:linear-gradient(to right,#000 76%,transparent)}
#hana-control-studies .scene-wash {position:absolute;inset:0;background:linear-gradient(90deg,transparent 24%,color-mix(in srgb,var(--hp-veil) 32%,transparent) 48%,var(--hp-veil) 100%)}
#hana-control-studies .lyric-preview {position:absolute;left:56%;right:36px;top:50%;transform:translateY(-46%);display:grid;gap:21px}
#hana-control-studies .lyric-preview p {margin:0;font-size:15px;line-height:1.7;opacity:.6;letter-spacing:.02em}
#hana-control-studies .lyric-preview .lyric-active {opacity:1;font-size:21px;font-weight:500}
#hana-control-studies .stage-track {position:absolute;left:28px;top:22px;max-width:calc(100% - 140px);display:none}
#hana-control-studies .stage-track strong {display:block;font-size:17px;font-weight:500}
#hana-control-studies .stage-track span {font-size:12px;opacity:.75}
#hana-control-studies .hp-control {position:relative;z-index:5;flex:none;background:var(--hp-surface);color:var(--hp-ink)}
#hana-control-studies .tool {display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:6px;color:var(--hp-secondary);position:relative;transition:background 140ms,color 140ms,transform 140ms var(--hp-ease)}
#hana-control-studies .tool:hover {background:var(--hp-hover);color:var(--hp-ink)}
#hana-control-studies .tool:active {transform:scale(.96)}
#hana-control-studies .tool svg {width:19px;height:19px;stroke-width:1.65}
#hana-control-studies .tool.is-on {color:var(--hp-accent)}
#hana-control-studies .heart.is-on svg {fill:currentColor}
#hana-control-studies .heart.is-pop svg {animation:hp-heart 360ms var(--hp-ease)}
#hana-control-studies .play {width:48px;height:48px;border-radius:50%;background:var(--hp-accent);color:var(--hp-on);display:grid;place-items:center;position:relative;transition:transform 180ms var(--hp-ease),filter 180ms}
#hana-control-studies .play:hover {transform:scale(1.025);filter:brightness(1.04)}
#hana-control-studies .play:active {transform:scale(.96)}
#hana-control-studies .play .play-glyph {position:absolute;display:grid;place-items:center;transition:opacity 160ms,transform 240ms var(--hp-ease)}
#hana-control-studies .play .play-glyph svg {width:21px;height:21px;stroke-width:1.7;fill:currentColor}
#hana-control-studies .play .glyph-play {opacity:0;transform:scale(.82);margin-left:2px}
#hana-control-studies .player-study.is-paused .glyph-play {opacity:1;transform:none}
#hana-control-studies .player-study.is-paused .glyph-pause {opacity:0;transform:scale(.82)}
#hana-control-studies .transport {display:flex;gap:16px;align-items:center;justify-content:center;position:relative}
#hana-control-studies .transport .prev svg,#hana-control-studies .transport .next svg {width:20px;height:20px;fill:currentColor;stroke-width:1.3}
#hana-control-studies .identity {display:flex;align-items:center;gap:10px;min-width:0}
#hana-control-studies .context-left {display:flex;align-items:center;gap:16px;min-width:0}
#hana-control-studies .context-left .identity {min-width:0;flex:1}
#hana-control-studies .track-copy {min-width:0;max-width:235px;text-align:left;overflow:hidden}
#hana-control-studies .track-copy strong {font-weight:500;font-size:14px;display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--hp-ink)}
#hana-control-studies .track-copy span {display:block;font-size:11px;color:var(--hp-secondary);margin-top:3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#hana-control-studies .right-tools {display:flex;align-items:center;justify-content:flex-end;gap:10px;position:relative;min-width:0}
#hana-control-studies .group-rule {display:block;height:16px;width:1px;background:var(--hp-line);margin:0 5px}
#hana-control-studies .mode::after {content:"";position:absolute;bottom:3px;width:3px;height:3px;border-radius:50%;background:currentColor;opacity:0}
#hana-control-studies .mode.is-on::after {opacity:1}
#hana-control-studies .range {appearance:none;-webkit-appearance:none;background:transparent;height:24px;margin:0;display:block;min-width:0;width:100%;touch-action:pan-y}
#hana-control-studies .range::-webkit-slider-runnable-track {height:3px;border-radius:8px;background:linear-gradient(to right,var(--hp-accent) var(--hp-fill,26%),var(--hp-track) var(--hp-fill,26%))}
#hana-control-studies .range::-webkit-slider-thumb {appearance:none;-webkit-appearance:none;width:9px;height:9px;margin-top:-3px;background:var(--hp-accent);border-radius:50%;border:none;transition:transform 140ms,opacity 140ms;opacity:0;transform:scale(.6)}
#hana-control-studies .range:hover::-webkit-slider-thumb,#hana-control-studies .range:focus-visible::-webkit-slider-thumb,#hana-control-studies .range:active::-webkit-slider-thumb {opacity:1;transform:scale(1)}
#hana-control-studies .range::-moz-range-track {height:3px;background:var(--hp-track);border:none}
#hana-control-studies .range::-moz-range-progress {height:3px;background:var(--hp-accent)}
#hana-control-studies .range::-moz-range-thumb {width:9px;height:9px;border:none;border-radius:50%;background:var(--hp-accent)}
#hana-control-studies .time {font-size:11px;color:var(--hp-secondary);font-variant-numeric:tabular-nums;white-space:nowrap}
#hana-control-studies .timeline {display:flex;align-items:center;gap:12px;min-width:0;position:relative}
#hana-control-studies .timeline .range {flex:1}
#hana-control-studies .scrub-readout {position:absolute;left:50%;bottom:27px;transform:translateX(-50%) translateY(3px);background:var(--hp-surface);color:var(--hp-ink);padding:3px 8px;border-radius:5px;font-size:11px;opacity:0;transition:opacity 140ms,transform 140ms;pointer-events:none}

(() => {
 const root = document.getElementById('hana-control-studies');
 const songs=[{name:'風と行く道',artist:'大原ゆい子',duration:244},{name:'旅人の唄',artist:'大原ゆい子',duration:265},{name:'目覚めの唄',artist:'大原ゆい子',duration:281},{name:'遠くの子守の唄',artist:'大原ゆい子',duration:251}];
 const ui={size:'long',width:465,height:650,longTitle:false};
 const players=[...root.querySelectorAll('.player-study')];
 const records=new Map();
 const clone=(name)=>document.getElementById('hp-'+name+'-template').content.cloneNode(true);
 const time=(s)=>Math.floor(s/60)+':'+String(Math.round(s)%60).padStart(2,'0');
 const refreshIcons=()=>globalThis.lucide?.createIcons({attrs:{width:18,height:18}});
 const safeSaved=window.openai?.widgetState;
 if(safeSaved?.privateContent?.ui) Object.assign(ui,safeSaved.privateContent.ui);
 const save=()=>window.openai?.setWidgetState({modelContent:{design:'静听 · 连续布局',previewSize:ui.size,width:ui.width,height:ui.height,longTitle:ui.longTitle},privateContent:{ui,players:players.map(p=>records.get(p))}})?.catch(()=>{});
 const notice=(p,message)=>{const el=p.querySelector('.toast-preview');el.textContent=message;el.classList.add('is-open');clearTimeout(el._timer);el._timer=setTimeout(()=>el.classList.remove('is-open'),1500);};
 function renderRows(p) {
  const s=records.get(p);
  for(const list of p.querySelectorAll('.search-songs,.queue-songs,.queue-static-songs')) {
   const limit=list.classList.contains('queue-static-songs')?2:songs.length;
   list.innerHTML=songs.slice(0,limit).map((song,i)=>`<div class="song-row" data-song-row="${i}"><button class="song-button cursor-interaction ${s.index===i?'is-current':''}" data-action="song" data-song="${i}" type="button"><span class="song-no">${s.index===i?'—':String(i+1).padStart(2,'0')}</span><span><span class="song-name">${song.name}</span><span class="song-artist">${song.artist}</span></span></button><button class="tool heart cursor-interaction ${s.liked.includes(i)?'is-on':''}" data-action="heart" data-song="${i}" type="button" aria-label="喜欢 ${song.name}" aria-pressed="${s.liked.includes(i)}"><i data-lucide="heart" aria-hidden="true"></i></button></div>`).join('');
  }
 }
 function renderState(p) {
  const s=records.get(p),song=songs[s.index];
  p.classList.toggle('is-paused',!s.playing);
  const label=ui.longTitle?'風と行く道 — TV Animation Theme Song Collection':song.name;
  p.querySelectorAll('[data-track-name]').forEach(el=>el.textContent=label);
  p.querySelectorAll('.track-copy').forEach(el=>el.dataset.tooltip=label+' · '+song.artist);
  p.querySelectorAll('[data-action="play"]').forEach(el=>{el.setAttribute('aria-label',s.playing?'暂停':'播放');el.dataset.tooltip=s.playing?'暂停':'播放';});
  p.querySelectorAll('.heart').forEach(el=>{const i=el.dataset.song===undefined?s.index:Number(el.dataset.song);el.classList.toggle('is-on',s.liked.includes(i));el.setAttribute('aria-pressed',String(s.liked.includes(i)));el.dataset.tooltip=s.liked.includes(i)?'取消喜欢':'喜欢这首歌';});
  p.querySelectorAll('[data-action="seek"]').forEach(el=>{el.max=song.duration;el.value=s.position;el.style.setProperty('--hp-fill',(s.position/song.duration*100)+'%');});
  p.querySelectorAll('.current-time,.scrub-readout').forEach(el=>el.textContent=time(s.position));
  p.querySelectorAll('.total-time').forEach(el=>el.textContent=time(song.duration));
  p.querySelectorAll('[data-action="volume-slider"]').forEach(el=>{el.value=s.volume;el.style.setProperty('--hp-fill',s.volume+'%');});
  p.querySelectorAll('.volume-number').forEach(el=>el.textContent=s.volume+'%');
  p.querySelectorAll('[data-action="volume"]').forEach(el=>el.classList.toggle('is-on',s.volume===0));
 }
 function setPanel(p,kind,open) {
  const panel=p.querySelector('.'+kind+'-panel');panel.classList.toggle('is-open',open);panel.inert=!open;
  p.querySelectorAll('[data-action="'+kind+'"]').forEach(el=>{el.classList.toggle('is-on',open);el.setAttribute('aria-expanded',String(open));});
  if(kind==='queue'){const scrim=p.querySelector('.panel-scrim');scrim.classList.toggle('is-open',open);scrim.inert=!open;const search=p.querySelector('.search-panel');search.inert=open||!search.classList.contains('is-open');}
 }
 function selectSong(p,index) {
  const s=records.get(p);s.index=(index+songs.length)%songs.length;s.position=0;s.playing=true;
  p.classList.remove('is-changing');void p.offsetWidth;p.classList.add('is-changing');setTimeout(()=>p.classList.remove('is-changing'),300);
  renderRows(p);renderState(p);refreshIcons();save();
 }
 for(const [index,p] of players.entries()) {
  records.set(p,Object.assign({index:0,position:63,playing:true,liked:[],volume:72,mode:0},safeSaved?.privateContent?.players?.[index]||{}));
  p.querySelector('.scene-area').append(clone('scene'));
  p.querySelector('.queue-static').innerHTML='<header class="panel-head"><strong>我的喜欢</strong><span>4 首</span></header><div class="queue-static-songs"></div>';
  for(const el of p.querySelectorAll('[data-part]')) el.append(clone(el.dataset.part));
  renderRows(p);renderState(p);
  p.addEventListener('click',e=>{
   const el=e.target.closest('[data-action]');if(!el||!p.contains(el))return;const s=records.get(p),a=el.dataset.action;
   if(a==='play'){s.playing=!s.playing;renderState(p);save();}
   if(a==='prev'||a==='next')selectSong(p,s.index+(a==='next'?1:-1));
   if(a==='song')selectSong(p,Number(el.dataset.song));
   if(a==='heart'){const i=el.dataset.song===undefined?s.index:Number(el.dataset.song);const liked=s.liked.includes(i);s.liked=liked?s.liked.filter(x=>x!==i):[...s.liked,i];renderState(p);el.classList.remove('is-pop');void el.offsetWidth;el.classList.add('is-pop');setTimeout(()=>el.classList.remove('is-pop'),400);notice(p,liked?'已取消喜欢':'已加入我的喜欢');save();}
   if(a==='mode'){s.mode=(s.mode+1)%3;const names=['列表循环','单曲循环','随机播放'],icons=['repeat','repeat-1','shuffle'];p.querySelectorAll('.mode').forEach(b=>{b.innerHTML='<i data-lucide="'+icons[s.mode]+'" aria-hidden="true"></i>';b.dataset.tooltip=names[s.mode];b.setAttribute('aria-label',names[s.mode]);b.classList.toggle('is-on',s.mode>0);});refreshIcons();notice(p,names[s.mode]);save();}
   if(a==='search'||a==='queue')setPanel(p,a,!p.querySelector('.'+a+'-panel').classList.contains('is-open'));
   if(a==='close-search')setPanel(p,'search',false);if(a==='close-queue')setPanel(p,'queue',false);
   if(a==='volume'){const pop=el.nextElementSibling;const open=!pop.classList.contains('is-open');p.querySelectorAll('.volume-pop').forEach(v=>{v.classList.remove('is-open');v.inert=true;});p.querySelectorAll('[data-action="volume"]').forEach(b=>b.setAttribute('aria-expanded','false'));pop.classList.toggle('is-open',open);pop.inert=!open;el.setAttribute('aria-expanded',String(open));}
   if(a==='mute'){s.volume=s.volume===0?72:0;renderState(p);save();}
  });
  p.addEventListener('input',e=>{const s=records.get(p),el=e.target;if(el.dataset.action==='seek'){s.position=Number(el.value);renderState(p);}if(el.dataset.action==='volume-slider'){s.volume=Number(el.value);renderState(p);}if(el.type==='search'){p.querySelector('.panel-label').textContent=el.value?'搜索结果':'为你推荐';p.querySelectorAll('.search-songs .song-row').forEach(row=>row.hidden=!songs[Number(row.dataset.songRow)].name.concat('大原ゆい子').toLowerCase().includes(el.value.toLowerCase()));}});
  p.addEventListener('change',save);
  p.addEventListener('keydown',e=>{if(e.key!=='Escape')return;const q=p.querySelector('.queue-panel'),search=p.querySelector('.search-panel');if(q.classList.contains('is-open'))setPanel(p,'queue',false);else if(search.classList.contains('is-open'))setPanel(p,'search',false);p.querySelectorAll('.volume-pop').forEach(v=>{v.classList.remove('is-open');v.inert=true;});p.querySelectorAll('[data-action="volume"]').forEach(b=>b.setAttribute('aria-expanded','false'));});
  p.addEventListener('pointerdown',e=>{if(e.target.closest('.volume-wrap'))return;p.querySelectorAll('.volume-pop').forEach(v=>{v.classList.remove('is-open');v.inert=true;});p.querySelectorAll('[data-action="volume"]').forEach(b=>b.setAttribute('aria-expanded','false'));});
 }
 const sizes={window:[1040,560],medium:[720,560],long:[465,650],compact:[465,510],narrow:[312,510]};
 let previousSize=null,readyForMotion=false;
 const motion=matchMedia('(prefers-reduced-motion: reduce)');
 function arrange(p,animate=true) {
  const r=p.getBoundingClientRect();
  const form=r.width>=720?'window':r.height>=560?'long':'card';
  const density=r.width<400?'narrow':'normal';
  if(p.dataset.form===form&&p.dataset.density===density)return;
  const footer=p.querySelector('.unified-control');
  const movable=[...footer.querySelectorAll(':scope>.mode,:scope>.volume-wrap,.identity>.heart')];
  const fr=footer.getBoundingClientRect();
  const before=movable.map(el=>{const b=el.getBoundingClientRect();return{x:b.x-fr.x,y:b.y-fr.y};});
  movable.forEach(el=>{el._layoutAnimation?.cancel();});
  p.dataset.form=form;p.dataset.density=density;
  const search=p.querySelector('.unified-control>.search');search.disabled=form!=='window';
  p.querySelector('.queue-static').inert=form!=='long';
  if(form!=='window')setPanel(p,'search',false);
  if(form==='long')setPanel(p,'queue',false);
  if(animate&&readyForMotion&&!motion.matches){
   const afterFooter=footer.getBoundingClientRect();
   movable.forEach((el,i)=>{const b=el.getBoundingClientRect(),dx=before[i].x-(b.x-afterFooter.x),dy=before[i].y-(b.y-afterFooter.y);if(Math.abs(dx)+Math.abs(dy)<1)return;el._layoutAnimation=el.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'translate(0,0)'}],{duration:340,easing:'cubic-bezier(.22,.61,.36,1)'});});
  }
 }
 function applyDesign(animate=true) {
  if(ui.size!==previousSize&&sizes[ui.size]){[ui.width,ui.height]=sizes[ui.size];}
  previousSize=ui.size;
  for(const p of players){if(!animate)p.classList.add('is-initial');p.style.maxWidth=ui.width+'px';p.style.height=ui.height+'px';p.dataset.size=ui.size;renderState(p);arrange(p,animate);}
 }
 applyDesign(false);
 players.forEach(p=>new ResizeObserver(()=>arrange(p)).observe(p));
 requestAnimationFrame(()=>requestAnimationFrame(()=>{players.forEach(p=>p.classList.remove('is-initial'));readyForMotion=true;}));
 if(globalThis.Tweak){
  const tweak=new Tweak({container:root,onChange:()=>{if(ui.size===previousSize&&sizes[ui.size]&&(ui.width!==sizes[ui.size][0]||ui.height!==sizes[ui.size][1]))ui.size='custom';applyDesign();save();}});
  tweak.addSelect(ui,'size',{label:'形态切换',options:[{label:'窗口',value:'window'},{label:'长卡',value:'long'},{label:'窄卡',value:'narrow'},{label:'自由缩放',value:'custom'}]});
  tweak.addSlider(ui,'width',{label:'宽度',min:312,max:1040,step:1,unit:'px'});
  tweak.addSlider(ui,'height',{label:'高度',min:420,max:740,step:1,unit:'px'});
  tweak.addToggle(ui,'longTitle',{label:'长歌名'});
 }
 window.addEventListener('openai:set_globals',e=>{const restored=e.detail?.globals?.widgetState?.privateContent;if(!restored)return;if(restored.ui)Object.assign(ui,restored.ui);players.forEach((p,i)=>{if(restored.players?.[i])Object.assign(records.get(p),restored.players[i]);renderRows(p);});applyDesign();refreshIcons();});
 refreshIcons();
})();
</script>
